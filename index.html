<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crime Life — Simulation de vie criminelle</title>
<style>
:root{
  --bg:#111;--bg2:#161618;--card:#1e1e21;--card2:#27272b;--line:#2e2e34;
  --tx:#ececec;--mut:#9a9aa3;--red:#ff2d55;--red2:#c2002f;--green:#32ff7e;
  --gold:#ffd23f;--purple:#b45cff;--cyan:#00e5ff;--orange:#ff9f1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);
  border-left:1px solid #1b1b1d;border-right:1px solid #1b1b1d}

/* ---------- HUD ---------- */
#hud{flex:none;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,#1c0a10,#131316);
  border-bottom:1px solid #3a1420;box-shadow:0 2px 18px rgba(255,45,85,.10)}
.hud-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;flex:none;border-radius:50%;background:#222;display:grid;place-items:center;font-size:24px;padding:0;cursor:pointer;position:relative;
  border:2px solid var(--red);box-shadow:0 0 10px rgba(255,45,85,.55)}
.avatar:active{transform:scale(.94)}
.who{flex:1;min-width:0}
.who .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.loc small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.gear{background:none;border:0;font-size:18px;padding:4px 2px 4px 6px;cursor:pointer;opacity:.85}
.hud-money{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.chip b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
.chip.cash b{color:var(--green)} .chip.bank b{color:var(--cyan)} .chip.ap b{color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 10px;margin-top:8px}
.bar{font-size:11px}
.bar .bl{display:flex;justify-content:space-between;gap:4px;color:var(--mut);margin-bottom:2px;white-space:nowrap}
.bar .bl b{color:var(--tx)}
.bt{height:6px;background:#2a2a2f;border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .4s}
.hp .bf{background:linear-gradient(90deg,#16c25a,#32ff7e)}
.rs .bf{background:linear-gradient(90deg,#d99a00,#ffd23f)}
.ad .bf{background:linear-gradient(90deg,#7a2cff,#c77dff)}
.ht .bf{background:linear-gradient(90deg,#2d6bff,#ff2d55)}
.jailband{margin-top:8px;background:repeating-linear-gradient(45deg,#2a1a00,#2a1a00 8px,#1c1200 8px,#1c1200 16px);
  border:1px solid var(--orange);color:var(--orange);text-align:center;border-radius:8px;padding:4px;font-size:12px;font-weight:800}

/* ---------- MAIN / LOG ---------- */
main{flex:1;position:relative;overflow:hidden;min-height:0}
#log{position:absolute;inset:0;overflow-y:auto;padding:8px 12px 46px;-webkit-overflow-scrolling:touch}
.log-age{display:table;margin:14px auto 6px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--red);background:rgba(255,45,85,.08);border:1px solid rgba(255,45,85,.35);border-radius:20px;padding:3px 12px}
.log-e{display:flex;gap:8px;padding:8px 10px;margin:5px 0;background:var(--card);border-radius:10px;font-size:14px;line-height:1.38;border-left:3px solid #3a3a40}
.log-e.good{border-left-color:var(--green)} .log-e.bad{border-left-color:var(--red)}
.log-e.money{border-left-color:var(--gold)} .log-e.drug{border-left-color:var(--purple)}
.log-e.info{border-left-color:var(--cyan)} .log-e.death{border-left-color:#fff;background:#2a0d14}
.le-i{flex:none;width:22px;text-align:center}
.empty-log{color:var(--mut);text-align:center;margin-top:40px}

/* ---------- PANEL ---------- */
#panel{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(103%);transition:transform .24s ease;z-index:5}
#panel.open{transform:none}
.p-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#141417}
.p-head h2{flex:1;margin:0;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-head button{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.p-head button.hide{visibility:hidden}
.p-body{flex:1;overflow-y:auto;padding:6px 12px 52px;-webkit-overflow-scrolling:touch}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin:16px 2px 6px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;min-height:54px}
button.row:active{background:var(--card2);transform:scale(.99)}
.row[disabled]{opacity:.42;cursor:not-allowed}
.row.static{cursor:default}
.row.owned{border-color:rgba(50,255,126,.35)}
.row.hl{border-color:rgba(255,45,85,.6);box-shadow:inset 0 0 0 1px rgba(255,45,85,.25)}
.r-ic{font-size:22px;width:30px;text-align:center;flex:none}
.r-tx{flex:1;min-width:0}
.r-tx b{display:block;font-size:15px;font-weight:650}
.r-tx small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.35}
.r-rt{font-size:13px;font-weight:700;text-align:right;flex:none;max-width:42%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;line-height:1.45}
.card.accent{border-color:rgba(255,45,85,.45);background:linear-gradient(180deg,#221418,#1b1b1e)}
.big{font-size:20px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kv div{background:#17171a;border-radius:8px;padding:8px;min-width:0}
.kv small{display:block;color:var(--mut);font-size:11px}
.kv b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.note{color:var(--mut);font-size:12.5px;margin:8px 2px;line-height:1.4}
.g{color:var(--green)} .r{color:var(--red)} .y{color:var(--gold)} .p{color:var(--purple)} .c{color:var(--cyan)} .m{color:var(--mut)}
.mini{height:6px;background:#2a2a2f;border-radius:4px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red));border-radius:4px}
.mini.gr i{background:linear-gradient(90deg,#16c25a,#32ff7e)}

/* ---------- NAV ---------- */
#tabs{flex:none;display:grid;grid-template-columns:1fr 1fr 90px 1fr 1fr;align-items:end;background:#0c0c0e;border-top:1px solid #3a1420;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:relative;z-index:10}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:4px 0;cursor:pointer}
.tab .ti{font-size:21px;line-height:1.1}
.tab.on{color:var(--red)} .tab.on .ti{filter:drop-shadow(0 0 6px var(--red))}
.age-btn{justify-self:center;width:78px;height:78px;border-radius:50%;border:3px solid #ff6b86;
  background:radial-gradient(circle at 30% 28%,#ff5577,#c2002f 70%);color:#fff;font-weight:900;margin-top:-34px;cursor:pointer;
  box-shadow:0 0 16px rgba(255,45,85,.75),0 0 42px rgba(255,45,85,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
  animation:pulse 2.4s infinite}
.age-btn small{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.95}
.age-btn b{font-size:15px;white-space:nowrap}
.age-btn:active{transform:scale(.93)}
.age-btn[disabled]{filter:grayscale(1);opacity:.45;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(255,45,85,.75),0 0 42px rgba(255,45,85,.3)}50%{box-shadow:0 0 24px rgba(255,45,85,.95),0 0 60px rgba(255,45,85,.45)}}

/* ---------- MODAL ---------- */
#modal-root{position:fixed;inset:0;z-index:50;display:none}
#modal-root.show{display:block}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:14px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{width:100%;max-width:420px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:#1a1a1d;border:1px solid #45202b;border-radius:18px;
  padding:18px 16px 14px;box-shadow:0 0 30px rgba(255,45,85,.22);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}
.modal.good{border-color:rgba(50,255,126,.5);box-shadow:0 0 30px rgba(50,255,126,.14)}
.modal.bad{border-color:rgba(255,45,85,.75);box-shadow:0 0 34px rgba(255,45,85,.3)}
.modal.drug{border-color:rgba(180,92,255,.6);box-shadow:0 0 30px rgba(180,92,255,.22)}
.m-icon{font-size:46px;text-align:center;line-height:1.1}
.modal h3{text-align:center;margin:6px 0 8px;font-size:19px}
.m-text{color:#d8d8dc;font-size:14.5px;line-height:1.5;text-align:center}
.m-choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mbtn{background:var(--card2);border:1px solid #3b3b42;border-radius:12px;padding:11px 12px;font-size:15px;font-weight:650;cursor:pointer;text-align:center}
.mbtn small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.mbtn:active{transform:scale(.98)}
.mbtn.primary{background:linear-gradient(180deg,#ff2d55,#c2002f);border-color:#ff6b86;color:#fff;box-shadow:0 0 12px rgba(255,45,85,.4)}
.mbtn.primary small{color:#ffd6de}
.mbtn.danger{border-color:var(--red);color:#ff8aa0}
.mbtn.ghost{background:transparent;color:var(--mut);border-color:#2c2c31}
.mbtn[disabled]{opacity:.38;cursor:not-allowed}
.qty{margin-top:12px}
.qty-row{display:flex;gap:8px;align-items:center}
.qty-row input{flex:1;min-width:0;background:#111;border:1px solid #3b3b42;border-radius:10px;color:#fff;font-size:18px;font-weight:700;padding:8px;text-align:center}
.qb{width:44px;height:44px;border-radius:10px;border:1px solid #3b3b42;background:var(--card2);font-size:22px;cursor:pointer}
.qty-unit{text-align:center;color:var(--mut);font-size:12px;margin:4px 0}
.qty input[type=range]{width:100%;accent-color:var(--red);margin:6px 0}
.qty-pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qty-pre button{background:#141417;border:1px solid #3b3b42;border-radius:8px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer}
.qty-info{margin-top:10px;text-align:center;font-size:14px;line-height:1.5;background:#141417;border-radius:10px;padding:8px}
.form label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.6px;text-align:left}
.form input[type=text]{width:100%;background:#111;border:1px solid #3b3b42;border-radius:10px;color:#fff;font-size:16px;padding:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:#141417;border:1px solid #3b3b42;border-radius:10px;padding:7px 9px;font-size:14px;cursor:pointer}
.pick.av{font-size:22px;padding:4px 8px}
.pick.sel{border-color:var(--red);background:rgba(255,45,85,.15);box-shadow:0 0 8px rgba(255,45,85,.35)}
.logo{display:block;font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;color:#fff;text-shadow:0 0 12px var(--red),0 0 28px var(--red)}
.disclaimer{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;text-align:left}
.sumgrid div{background:#141417;border-radius:8px;padding:7px;font-size:12px;color:var(--mut)}
.sumgrid b{display:block;color:#fff;font-size:14px}

/* ---------- HUD : force, énergie, avatar ---------- */
.fo .bf{background:linear-gradient(90deg,#ff7a00,#ffb347)}
.en .bf{background:linear-gradient(90deg,#0097b2,#00e5ff)}
.sx .bf{background:linear-gradient(90deg,#c77700,#ff5e3a)}
.avatar::after{content:'👕';position:absolute;right:-6px;bottom:-6px;font-size:10px;width:18px;height:18px;border-radius:50%;background:#18181b;
  border:1px solid var(--line);display:grid;place-items:center}

/* ---------- MODE DÉTENTION ---------- */
body.jail #hud{background:linear-gradient(180deg,#201a0c,#141416);border-bottom-color:#5c4513;box-shadow:0 2px 18px rgba(255,159,28,.12)}
body.jail .avatar{border-color:var(--orange);box-shadow:0 0 10px rgba(255,159,28,.55)}
body.jail #log{background:repeating-linear-gradient(90deg,transparent 0 56px,rgba(170,170,180,.06) 56px 62px)}
body.jail .log-age{color:var(--orange);background:rgba(255,159,28,.08);border-color:rgba(255,159,28,.4)}
body.jail #tabs{border-top-color:#5c4513}
body.jail .tab.on{color:var(--orange)} body.jail .tab.on .ti{filter:drop-shadow(0 0 6px var(--orange))}
body.jail .sec{color:var(--orange)}
body.jail .age-btn{border-color:#ffc27a;background:radial-gradient(circle at 30% 28%,#ffb347,#a65200 70%);box-shadow:0 0 16px rgba(255,159,28,.7);animation:none}
.log-e.jail{border-left-color:var(--orange);background:#1d1a14}
.m-text:empty,.m-choices:empty{display:none}

/* ---------- COMBAT ---------- */
.cb-head{text-align:center;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.cb-arena{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.cb-f{background:#141417;border:1px solid #2e2e34;border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.cb-f .ic{font-size:34px;line-height:1.15}
.cb-f b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-f small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-vs{font-weight:900;color:var(--red);font-size:15px;text-shadow:0 0 8px var(--red)}
.hpbar{height:8px;background:#2a2a2f;border-radius:5px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#16c25a,#32ff7e);transition:width .35s}
.cb-f.foe .hpbar i{background:linear-gradient(90deg,#c2002f,#ff2d55)}
.hpnum{font-size:11px;color:#ddd;margin-top:3px}
.cb-f.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px);box-shadow:0 0 16px var(--red);border-color:var(--red)}60%{transform:translateX(6px)}}
.cb-log{margin-top:10px;background:#0e0e10;border:1px solid #2a2a2f;border-radius:10px;height:140px;overflow-y:auto;padding:8px;font-size:13px;line-height:1.4;text-align:left}
.cb-log p{margin:0 0 5px}
.cb-log .me{color:#a8ecff} .cb-log .en{color:#ffb3c0} .cb-log .sys{color:var(--gold);font-weight:700}
.cb-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cb-acts .full{grid-column:1/-1}

/* ---------- RITUELS DE CONSOMMATION ---------- */
.stage{position:relative;height:170px;margin:10px auto 4px;max-width:300px;border-radius:14px;overflow:hidden;
  background:radial-gradient(circle at 50% 65%,#2a1d36,#141417 72%);border:1px solid #2e2e34}
.r-cap{min-height:40px;text-align:center;color:#d8d8dc;font-size:14px;line-height:1.4;margin:8px 4px}
.r-steps{display:flex;justify-content:center;gap:6px}
.r-steps i{width:26px;height:4px;border-radius:2px;background:#333;transition:background .3s}
.r-steps i.on{background:var(--purple);box-shadow:0 0 6px var(--purple)}
.st-pill .box{position:absolute;left:50%;bottom:20px;width:124px;height:64px;margin-left:-62px;background:linear-gradient(180deg,#f5f7fb,#cdd5e6);border-radius:6px;box-shadow:0 5px 14px rgba(0,0,0,.55);z-index:2}
.st-pill .box span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1b3a8a;text-align:center;padding:4px;line-height:1.15}
.st-pill .lid{position:absolute;left:50%;bottom:84px;width:124px;height:12px;margin-left:-62px;background:#e3e8f2;border-radius:4px 4px 0 0;transform-origin:left bottom;transition:transform .5s;z-index:3}
.st-pill .blister{position:absolute;left:50%;bottom:36px;width:96px;height:42px;margin-left:-48px;background:linear-gradient(135deg,#dfe3e8,#9aa2ac);border-radius:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;transition:transform .9s .35s cubic-bezier(.2,.8,.2,1);z-index:1}
.st-pill .blister i{background:radial-gradient(circle at 35% 35%,#fff,#e6e6e6 60%,#b9b9b9);border-radius:50%}
.st-pill .pill{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d6d6d6);opacity:0;z-index:4}
.st-pill .mouth{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:26px;opacity:0;transition:opacity .4s;z-index:5}
.st-pill.s1 .lid{transform:translateX(-4px) rotate(-90deg)}
.st-pill.s1 .blister{transform:translateY(-60px) rotate(-3deg)}
.st-pill.s2 .blister i:first-child{background:#7d858f;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.st-pill.s2 .mouth{opacity:1}
.st-pill.s2 .pill{animation:pillTake 1.1s forwards}
@keyframes pillTake{0%{opacity:1;transform:translate(-34px,-40px)}45%{opacity:1;transform:translate(-14px,-58px) scale(1.4)}100%{opacity:0;transform:translate(0,-66px) scale(.2)}}
.st-joint .bud{position:absolute;left:50%;top:34px;font-size:48px;margin-left:-26px;transition:transform .6s,opacity .6s}
.st-joint .crumb{position:absolute;left:50%;top:62px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#5aa02c;opacity:0;transition:transform .7s .25s,opacity .4s .2s}
.st-joint .paper{position:absolute;left:50%;top:108px;width:140px;height:42px;margin-left:-70px;background:#f3eee2;border-radius:3px;opacity:0;transform:translateY(24px);transition:transform .5s,opacity .5s}
.st-joint .tip{position:absolute;left:calc(50% + 66px);top:122px;width:10px;height:14px;border-radius:3px;background:#ff5a00;opacity:0}
.st-joint .smoke{position:absolute;left:calc(50% + 64px);top:108px;width:16px;height:16px;border-radius:50%;background:rgba(225,225,225,.55);opacity:0;filter:blur(2px)}
.st-joint.s1 .bud{transform:scale(.2) rotate(120deg);opacity:0}
.st-joint.s1 .crumb{opacity:1;transform:translate(var(--x),var(--y))}
.st-joint.s2 .paper{opacity:1;transform:none;animation:roll .9s 1s forwards}
.st-joint.s2 .crumb{transform:translate(var(--px),62px);animation:hide .3s 1.05s forwards}
@keyframes roll{to{top:122px;height:14px;border-radius:7px;background:#efe8d6}}
@keyframes hide{to{opacity:0}}
.st-joint.s3 .paper{top:122px;height:14px;border-radius:7px;background:#efe8d6}
.st-joint.s3 .tip{opacity:1;animation:ember 1.1s infinite}
.st-joint.s3 .smoke{animation:smoke 2.1s infinite}
.st-joint.s3 .smoke:nth-of-type(2){animation-delay:.7s} .st-joint.s3 .smoke:nth-of-type(3){animation-delay:1.4s}
@keyframes ember{0%,100%{background:#ff4500;box-shadow:0 0 8px #ff4500}50%{background:#ffc300;box-shadow:0 0 16px #ffa000}}
@keyframes smoke{0%{opacity:.75;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-24px,-96px) scale(2.6)}}
.st-powder .mirror{position:absolute;left:50%;top:50%;width:210px;height:104px;margin:-52px 0 0 -105px;background:linear-gradient(135deg,#3b404b,#15171c);border:2px solid #565c68;border-radius:8px}
.st-powder .pile{position:absolute;left:50%;top:50%;width:34px;height:18px;margin:-9px 0 0 -17px;background:#f4f4f4;border-radius:50% 50% 40% 40%;transition:all .8s .3s}
.st-powder .line{position:absolute;left:50%;top:50%;width:124px;height:5px;margin:-2px 0 0 -62px;background:#fff;border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform .9s .3s}
.st-powder .card{position:absolute;left:50%;top:50%;width:44px;height:28px;margin:-44px 0 0 -92px;background:linear-gradient(135deg,#ffd23f,#b98a00);border-radius:4px;opacity:0}
.st-powder.s1 .pile{width:0;height:0;margin:0;opacity:0}
.st-powder.s1 .line{transform:scaleX(1)}
.st-powder.s1 .card{animation:swipe 1.1s}
@keyframes swipe{0%{opacity:1;transform:translate(0,30px)}100%{opacity:0;transform:translate(130px,30px)}}
.st-powder.s2 .line{transform:scaleX(0);transform-origin:right;transition:transform .9s}

/* ---------- PROFIL & STYLE ---------- */
.prof{display:grid;grid-template-columns:112px 1fr;gap:10px;text-align:left}
.doll{background:linear-gradient(180deg,#1f1f24,#141417);border:1px solid #2e2e34;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center}
.doll .d{width:100%;text-align:center;font-size:21px;line-height:1.2;padding:2px 0;border-bottom:1px dashed #26262b}
.doll .d:last-child{border-bottom:0}
.doll .d.head{font-size:42px;line-height:1.1}
.doll .d small{display:block;font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.doll .empty{opacity:.22;filter:grayscale(1)}
.pinfo{font-size:13px;line-height:1.55}
.pinfo .big{font-size:17px;line-height:1.25;margin-bottom:2px;word-break:break-word}
.tier{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:8px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);color:var(--gold);font-weight:800;font-size:12px}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin:14px 0 4px;font-weight:800;text-align:left}
.slot{display:flex;align-items:center;gap:8px;width:100%;background:#141417;border:1px solid #2e2e34;border-radius:10px;padding:7px 9px;margin:5px 0;cursor:pointer;text-align:left}
.slot:active{transform:scale(.99)}
.slot .si{font-size:19px;width:26px;text-align:center;flex:none}
.slot .sl{flex:1;min-width:0}
.slot .sl small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.slot .sl b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.none b{color:var(--mut);font-weight:400}
.slot .sr{font-weight:800;color:var(--gold);font-size:12px;flex:none}
.bonus{display:grid;grid-template-columns:1fr auto;gap:3px 10px;background:#141417;border-radius:10px;padding:8px 10px;font-size:13px;text-align:left}
.bonus .tot{border-top:1px solid #2e2e34;padding-top:5px;margin-top:2px;font-weight:800}

/* ---------- RENDUS RÉALISTES DE CONSOMMATION ---------- */
.stage .mouth{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:26px;opacity:0;transition:opacity .4s;z-index:5}
.stage .smk{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(225,225,225,.55);opacity:0;filter:blur(2px)}
.stage .lighter{position:absolute;width:20px;height:44px;border-radius:5px;background:linear-gradient(90deg,#1565c0,#42a5f5 50%,#0d47a1);opacity:0;transition:transform .5s,opacity .5s;z-index:3}
.stage .lighter::before{content:'';position:absolute;left:3px;right:3px;top:-6px;height:7px;background:#bdbdbd;border-radius:2px}
.stage .fl{position:absolute;left:2px;top:-30px;width:16px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff59d,#ffb300 45%,rgba(255,87,34,.85) 75%,transparent 80%);animation:flick .15s infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.st-rx.s3 .mouth,.st-fr.s3 .mouth,.st-zip.s3 .mouth,.st-vial.s2 .mouth{opacity:1}
/* comprimés : formes */
.pl{position:absolute;left:50%;top:50%;opacity:0;z-index:4}
.pl.round{width:15px;height:15px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--pc) 55%)}
.pl.capsule{width:24px;height:11px;margin:-5px -12px;border-radius:6px;background:linear-gradient(90deg,var(--pc) 50%,#fafafa 50%)}
.pl.bar{width:30px;height:9px;margin:-4px -15px;border-radius:3px;background:var(--pc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pl.bar::after{content:'';position:absolute;inset:2px 8px;border-left:1px solid rgba(0,0,0,.3);border-right:1px solid rgba(0,0,0,.3)}
/* flacon US ambré (Rx) */
.st-rx .bot{position:absolute;left:50%;bottom:20px;width:58px;height:90px;margin-left:-70px;border-radius:9px 9px 7px 7px;overflow:hidden;
  background:linear-gradient(90deg,rgba(190,100,10,.95),rgba(255,160,50,.88) 45%,rgba(160,80,5,.95));box-shadow:inset 0 0 8px rgba(0,0,0,.35);transform-origin:50% 100%;transition:transform .7s,opacity .5s;z-index:2}
.st-rx .bot::before{content:'';position:absolute;left:5px;right:5px;bottom:5px;height:20px;background:radial-gradient(circle,var(--pc) 38%,transparent 42%) 0 0/9px 9px;opacity:.85}
.st-rx .lb{position:absolute;left:4px;right:4px;top:22px;height:46px;background:#fff;border-radius:2px;font-size:6px;line-height:1.3;color:#333;text-align:center;overflow:hidden}
.st-rx .lb i{display:block;background:#6a1b9a;color:#fff;font-style:normal;font-weight:900;font-size:6.5px;letter-spacing:.4px;padding:1px 0}
.st-rx .lb b{display:block;font-size:7.5px;color:#111;margin:2px 1px 1px;line-height:1.1}
.st-rx .rcap{position:absolute;left:50%;bottom:106px;width:64px;height:18px;margin-left:-73px;border-radius:4px;background:repeating-linear-gradient(90deg,#fff 0 4px,#e2e2e2 4px 6px);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .9s,opacity .9s;z-index:3}
.st-rx .rcap::after{content:'PUSH DOWN & TURN';position:absolute;inset:0;display:grid;place-items:center;font-size:5px;font-weight:900;color:#c62828}
.st-rx .palm{position:absolute;left:50%;margin-left:48px;bottom:10px;font-size:40px;line-height:1;transition:transform .9s;z-index:1}
.st-rx.s1 .rcap{transform:translate(-30px,-36px) rotate(-320deg);opacity:0}
.st-rx.s2 .bot{transform:rotate(35deg)}
.st-rx.s2 .pl{animation:rxDrop 1.1s .6s forwards}
.st-rx.s3 .bot{opacity:.2}
.st-rx.s3 .palm{transform:translate(-68px,-86px)}
.st-rx.s3 .pl{animation:rxEat .9s forwards}
@keyframes rxDrop{0%{opacity:1;transform:translate(12px,-14px)}35%{opacity:1;transform:translate(34px,-30px)}100%{opacity:1;transform:translate(70px,38px)}}
@keyframes rxEat{0%{opacity:1;transform:translate(70px,38px)}75%{opacity:1;transform:translate(2px,-50px)}100%{opacity:0;transform:translate(0,-62px) scale(.3)}}
/* boîte de pharmacie française */
.st-fr .bx{position:absolute;left:50%;bottom:18px;width:156px;height:70px;margin-left:-78px;background:linear-gradient(180deg,#fff,#eceff3);border-radius:4px;box-shadow:0 5px 14px rgba(0,0,0,.55);overflow:hidden;z-index:2;text-align:left}
.st-fr .band{position:absolute;left:0;right:0;top:0;height:13px;background:var(--bc)}
.st-fr .bx::after{content:'';position:absolute;right:0;bottom:0;border-left:34px solid transparent;border-bottom:34px solid var(--bc);opacity:.85}
.st-fr .nm{position:absolute;left:8px;top:16px;font-size:14px;font-weight:900;color:#1b1b1b;letter-spacing:.4px;white-space:nowrap}
.st-fr .nm small{font-size:9px;font-weight:700;color:#444}
.st-fr .dci{position:absolute;left:8px;top:35px;font-size:8.5px;color:#555}
.st-fr .qt{position:absolute;left:8px;bottom:6px;font-size:7.5px;color:#777}
.st-fr .flap{position:absolute;left:50%;bottom:88px;width:156px;height:10px;margin-left:-78px;background:#e4e8ee;border-radius:3px 3px 0 0;transform-origin:left bottom;transition:transform .6s;z-index:3}
.st-fr .blister{position:absolute;left:50%;bottom:34px;width:100px;height:42px;margin-left:-50px;background:linear-gradient(135deg,#e2e6ea,#9aa2ac);border-radius:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;transition:transform 1s cubic-bezier(.2,.8,.2,1);z-index:1}
.st-fr .blister i{background:radial-gradient(circle at 35% 35%,#fff,#e6e6e6 60%,#b9b9b9);border-radius:50%}
.st-fr .pill{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d8d8d8);opacity:0;z-index:4}
.st-fr.s1 .flap{transform:translate(-8px,-12px) rotate(-16deg)}
.st-fr.s2 .blister{transform:translateY(-64px)}
.st-fr.s3 .blister i:first-child{background:#7d858f;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.st-fr.s3 .pill{animation:frTake 1.1s forwards}
@keyframes frTake{0%{opacity:1;transform:translate(-36px,-40px)}45%{opacity:1;transform:translate(-14px,-56px) scale(1.4)}100%{opacity:0;transform:translate(0,-64px) scale(.2)}}
/* lean : sirop codéiné versé dans un double cup, complété au Sprite, avec glaçons */
.st-lean .lbt{position:absolute;left:50%;bottom:18px;margin-left:-108px;width:46px;height:100px;transform-origin:50% 50%;transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .6s;z-index:4}
.st-lean .lbt .body{position:absolute;inset:0;overflow:hidden}
.st-lean .lbt .nk{position:absolute;left:14px;top:-12px;width:18px;height:13px}
.st-lean .lbt .cap{position:absolute;left:10px;top:-24px;width:26px;height:13px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 3px,#d9d9d9 3px 4px);box-shadow:0 2px 3px rgba(0,0,0,.35);transition:transform .5s,opacity .5s}
.st-lean .lb{position:absolute;left:0;right:0;top:20px;height:58px;background:#fbfbfb;text-align:center;color:#222;font-size:4.6px;line-height:1.3;overflow:hidden}
.st-lean .lb span{display:block}
.st-lean .lb em{display:block;font-style:normal;font-weight:800;margin-top:2px}
/* Actavis : pinte en plastique transparent de 473 ml, sirop violet, étiquette orange et blanche */
.st-lean .act .body{border-radius:10px 10px 7px 7px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
.st-lean .act .body::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent 22%,transparent 72%,rgba(255,255,255,.16));pointer-events:none}
.st-lean .act .lq{position:absolute;left:0;right:0;bottom:0;height:90%;background:var(--lc);transition:height 1.2s .8s}
.st-lean .act .nk{border:1px solid rgba(255,255,255,.4);border-bottom:none;background:rgba(255,255,255,.12)}
.st-lean .act .ob{height:12px;line-height:12px;background:#f26522;color:#fff;font-size:8.5px;font-weight:900;font-style:italic;letter-spacing:.3px}
.st-lean .act .lb b{display:block;margin:3px 1px 2px;font-size:5.6px;font-weight:900;color:#4a148c;line-height:1.15}
/* Euphon : flacon en verre ambré de 300 ml, bouchon sécurité blanc et godet doseur, sirop rouge */
.st-lean .eup .body{border-radius:15px 15px 8px 8px;background:linear-gradient(90deg,rgba(55,22,4,.97),rgba(150,74,20,.9) 42%,rgba(48,18,3,.97));box-shadow:inset 0 0 10px rgba(0,0,0,.55)}
.st-lean .eup .nk{background:linear-gradient(90deg,#3a1704,#8a4515 45%,#2c1203)}
.st-lean .eup .gd{position:absolute;left:1px;top:-12px;width:24px;height:12px;border:1.5px solid rgba(255,255,255,.75);border-bottom:none;border-radius:5px 5px 1px 1px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 3px,rgba(255,255,255,.45) 3px 4px)}
.st-lean .eup .lb{top:24px;height:52px;border-radius:1px}
.st-lean .eup .bl{display:block;height:5px;background:#1d4f9b}
.st-lean .eup .lb b{display:block;margin-top:4px;font-size:8.5px;font-weight:900;color:#1d4f9b;letter-spacing:.3px;line-height:1}
.st-lean .eup .lb sup{font-size:4px}
.st-lean .eup .sy{font-style:italic;font-size:6px;color:#444}
.st-lean .eup .rs{display:block;height:3px;margin:2px 5px;background:#c62828}
.st-lean .eup .lb em{color:#888;font-size:4px}
/* filets de sirop et de soda */
.st-lean .strm,.st-lean .ss{position:absolute;left:50%;width:4px;height:0;border-radius:2px;opacity:1;z-index:3}
.st-lean .strm{margin-left:6px;top:64px;background:var(--lc);transition:height .3s .8s,opacity .3s 2s}
.st-lean .ss{margin-left:32px;top:70px;width:3px;background:rgba(215,255,225,.85);transition:height .3s .8s,opacity .3s 1.9s}
/* canette de Sprite */
.st-lean .spr{position:absolute;left:50%;bottom:16px;margin-left:70px;width:28px;height:52px;border-radius:4px;background:linear-gradient(90deg,#00632f,#00a651 42%,#2fd17d 58%,#00803c);box-shadow:0 4px 10px rgba(0,0,0,.45);transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .6s;z-index:4}
.st-lean .spr::before{content:'';position:absolute;left:1px;right:1px;top:-4px;height:6px;border-radius:4px 4px 1px 1px;background:linear-gradient(90deg,#9aa4a8,#eceff1 45%,#90a4ae)}
.st-lean .spr::after{content:'';position:absolute;left:4px;right:4px;bottom:7px;height:4px;border-radius:2px;background:#ffd400;transform:skewY(-12deg)}
.st-lean .spr b{position:absolute;inset:0;display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:11px;font-weight:900;font-style:italic;letter-spacing:.5px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
/* double cup en polystyrène */
.st-lean .dc{position:absolute;left:50%;bottom:16px;margin-left:-9px;width:58px;height:74px;transform-origin:50% 0;transition:transform .9s cubic-bezier(.4,.1,.3,1);z-index:2}
.st-lean .dc .fc{position:absolute;left:0;right:0;top:7px;bottom:0;clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);background:radial-gradient(circle,rgba(0,0,0,.04) 1px,transparent 1.5px) 0 0/4px 4px,linear-gradient(90deg,#cfcfcf,#fff 35%,#f4f4f4 62%,#c9c9c9);z-index:1}
.st-lean .dc .fc::before{content:'';position:absolute;left:0;right:0;top:9px;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(255,255,255,.9))}
.st-lean .dc .op{position:absolute;left:0;top:0;width:58px;height:14px;border-radius:50%;border:2px solid #fdfdfd;box-sizing:border-box;background:radial-gradient(ellipse at 50% 30%,#bdbdbd,#e6e6e6 70%);overflow:hidden;z-index:2}
.st-lean .sf{position:absolute;inset:1px;border-radius:50%;background:var(--lc);opacity:0;transform:scale(.15);transition:transform 1.2s .9s,opacity .4s .9s,background 1.2s .9s}
.st-lean .sf i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0}
.st-lean .sf i:nth-child(1){left:8px;top:3px} .st-lean .sf i:nth-child(2){left:20px;top:5px} .st-lean .sf i:nth-child(3){left:31px;top:2px} .st-lean .sf i:nth-child(4){left:41px;top:5px} .st-lean .sf i:nth-child(5){left:14px;top:6px}
.st-lean .ice{position:absolute;top:-2px;width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.9);background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(170,215,255,.55) 60%,rgba(255,255,255,.75));box-shadow:0 1px 3px rgba(0,0,0,.25);opacity:0;z-index:3}
.st-lean.s1 .lbt{transform:translate(39px,-69px) rotate(120deg)}
.st-lean.s1 .cap{transform:translate(-16px,-34px) rotate(-170deg);opacity:0}
.st-lean.s1 .act .lq{height:52%}
.st-lean.s1 .strm{height:22px;opacity:0}
.st-lean.s1 .sf{opacity:1;transform:scale(.8)}
.st-lean.s2 .lbt{transform:none;opacity:.35}
.st-lean.s2 .spr{transform:translate(-24px,-70px) rotate(-115deg)}
.st-lean.s2 .ss{height:17px;opacity:0}
.st-lean.s2 .sf{transform:scale(1);background:var(--lm)}
.st-lean.s2 .sf i{animation:fizz 1s 1.1s infinite}
.st-lean.s2 .sf i:nth-child(2n){animation-delay:1.4s}
@keyframes fizz{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.st-lean.s3 .spr{transform:none;opacity:.35}
.st-lean.s3 .ice{animation:iceDrop .7s cubic-bezier(.5,0,.7,1) forwards}
.st-lean.s3 .ice:nth-of-type(2){animation-delay:.25s} .st-lean.s3 .ice:nth-of-type(3){animation-delay:.5s}
@keyframes iceDrop{0%{opacity:1;transform:translateY(-130px) rotate(0)}80%{opacity:1;transform:translateY(3px) rotate(var(--r))}100%{opacity:1;transform:translateY(0) rotate(var(--r))}}
.st-lean.s4 .mouth{opacity:1}
.st-lean.s4 .lbt,.st-lean.s4 .spr{opacity:.12}
.st-lean.s4 .dc{transform:translate(-40px,-60px) rotate(-28deg)}
.st-lean.s4 .sf{transform:scale(.35);transition:transform 1.1s .6s}
/* héroïne / injectable */

.st-inj .bowl{position:absolute;left:0;top:0;width:58px;height:28px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#f4f4f4,#a9a9a9 60%,#6d6d6d);box-shadow:0 3px 8px rgba(0,0,0,.6);overflow:hidden}

.st-inj .lq{position:absolute;left:8px;top:6px;width:42px;height:16px;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#f1c75b,#b8741c 70%);opacity:0;transition:opacity 1s 1s,transform 1s}

.st-inj .sy{position:absolute;left:50%;top:-120px;margin-left:-66px;width:14px;height:100px;transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity .5s;z-index:3}
.st-inj .barrel{position:absolute;left:0;top:18px;width:14px;height:56px;border:2px solid rgba(255,255,255,.75);border-radius:3px;background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px);overflow:hidden}
.st-inj .sf{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#f1c75b,#b8741c);transition:height 1s .6s}

.st-inj .needle{position:absolute;left:6px;top:74px;width:2px;height:24px;background:linear-gradient(180deg,#ccc,#888)}

.st-inj.s1 .pw{opacity:1;transform:none}
.st-inj.s2 .lighter{opacity:1;transform:none}

.st-inj.s2 .lq{opacity:1}
.st-inj.s2 .bub{animation:bub 1s infinite}

  mod(stat, d) { S[stat] = U.clamp((S[stat] || 0) + d, 0, 100); },

    if (n <= 0 || !S.alive) return;
    S.health = Math.max(0, S.health - n);
    if (S.health <= 0) Game.die(cause);
  },
  heal(n) { S.health = Math.min(100, S.health + n); },
  earn(n) { n = Math.round(n); S.cash += n; S.earned += n; },
  can(n, bank = true) { return S.cash + (bank ? S.bank : 0) >= n; },
  pay(n, bank = true) {
    if (!this.can(n, bank)) return false;
    const c = Math.min(S.cash, n); S.cash -= c; S.bank -= (n - c); return true;
  },
  // Charges légales : prélevées sur la banque puis le liquide. Renvoie l'impayé.
  charge(n) {
    const b = Math.min(S.bank, n); S.bank -= b; let rest = n - b;
    const c = Math.min(S.cash, rest); S.cash -= c; rest -= c; return rest;
  },
  items(cat) { return S.owned[cat].map((id) => SHOP[cat].items.find((i) => i.id === id)).filter(Boolean); },
  equipped(slot) {
    const id = S.equip[slot], cat = SLOTS[slot].cat;
    if (!id || !S.owned[cat].includes(id)) return null;
    return SHOP[cat].items.find((i) => i.id === id) || null;
  },
  // Respect apporté par la tenue portée, les accessoires, le meilleur véhicule, le logement et les commerces
  styleBreakdown() {
    let tenue = 0, acc = 0;
    for (const s in SLOTS) { const it = this.equipped(s); if (it) { if (SLOTS[s].cat === 'clothes') tenue += it.respect; else acc += it.respect; } }
    const veh = Math.max(0, ...this.items('vehicles').map((v) => v.respect));
    const home = Math.max(0, ...this.items('properties').map((p) => p.respect));
    const biz = S.businesses.reduce((a, b) => a + (BUSINESSES[b.type].respect || 0), 0);
    const raw = tenue + acc + veh + home + biz;
    return { tenue, acc, veh, home, biz, raw, total: Math.min(40, raw) };
  },
  possessionRespect() { return this.styleBreakdown().total; },
  respect() { return U.clamp(Math.round(S.respect + this.possessionRespect()), 0, 100); },
  firepower() {
    const ws = this.items('weapons').filter((w) => w.power).map((w) => w.power).sort((a, b) => b - a);
    if (!ws.length) return 0;
    let mods = 0, sw = 0;
    for (const w of this.items('weapons')) { const m = Armory.mods(w.id); mods += m.length * 3; if (m.includes('switch')) sw += 15; } // switch full-auto
    return Math.round(ws[0] + ws.slice(1).reduce((a, b) => a + b * 0.15, 0) + mods + sw);
  },
  armor() { return Math.max(0, ...this.items('weapons').map((w) => w.armor || 0)); },
  capacity() { return 50 + this.items('properties').reduce((a, p) => a + p.cap, 0); },
  security() { return Math.max(0, ...this.items('properties').map((p) => p.sec)); },
  home() { const ps = this.items('properties').filter((p) => !p.stash).sort((a, b) => b.price - a.price); return ps[0] || { name: 'Chambre chez ta mère', icon: '🛏️' }; },

    if (ex) { ex.value = Math.max(ex.value, value); ex.months = Math.max(ex.months, months); } else S.buffs.push({ type, value, months });
  },
  apMax() { return S.jail ? 3 : S.job ? 3 : 4; }, // un emploi légal prend du temps

    return Math.round(20 + this.firepower() * 1.2 + this.armor() * 0.3
      + this.soldiers().reduce((a, c) => a + c.skill * (c.trait === 'violent' ? 1.35 : 0.9), 0)
      + this.dealers().reduce((a, c) => a + c.skill * 0.2, 0) + this.respect() * 0.4 + S.force * 0.3 + this.crimeBuff() + Arsenal.usable() * 0.9 + ((S.special && S.special.explo) || 0) * 8);
  },
  netWorth() {
    let w = S.cash + S.bank + Inventory.value();
    for (const cat in SHOP) for (const it of this.items(cat)) w += it.price * RESALE[cat];
    for (const b of S.businesses) w += BUSINESSES[b.type].price * 0.6;
    for (const l of S.labs) w += LABS[l.type].price * 0.5;
    for (const f of S.factories) w += FACTORIES[f.type].price * 0.5;
    w += Vault.total() + Arsenal.value() + Crypto.worth();
    w -= S.debts.reduce((a, d) => a + d.amount, 0);
    return Math.round(w);
  },
  debt() { return S.debts.reduce((a, d) => a + d.amount, 0); },
  addDebt(lender, amount, rate, months) { S.debts.push({ id: U.uid(), lender, amount: Math.round(amount), rate, due: S.ageMonths + months, overdue: 0 }); },
};

/* Enregistre une drogue de synthèse (R&D) dans le catalogue et le marché */
function registerDrug(key, def, silent) {
  if (!DRUGS[key]) DRUGS[key] = def;
  if (S && S.market) MarketData.ensure();
}
/* ============================ MARKET DATA ============================ */
const MarketData = {
  init() {
    const m = { trend: {}, qual: {}, brand: {}, sold: {} };
    for (const c in CITIES) {
      m.trend[c] = {}; m.qual[c] = {}; m.brand[c] = {};
      for (const d in DRUGS) {
        m.trend[c][d] = U.rand(0.85, 1.15);
        m.qual[c][d] = this.rollQ(c, d);
        m.brand[c][d] = U.ri(0, DRUGS[d].brands.length - 1);
      }
    }
    return m;
  },
  rollQ(c, d) { const sp = (CITIES[c].spec || {})[d] || 0; return U.clamp(Math.round(U.rand(20, 72) + sp + U.rand(-5, 12)), 1, 100); },
  // crée les entrées de marché manquantes (nouvelles villes d'exil, nouveaux produits, RC)
  ensure() {
    const m = S.market; if (!m) return;
    for (const c in CITIES) {
      if (!m.trend[c]) { m.trend[c] = {}; m.qual[c] = {}; m.brand[c] = {}; }
      for (const d in DRUGS) if (m.trend[c][d] == null) { m.trend[c][d] = U.rand(0.85, 1.15); m.qual[c][d] = this.rollQ(c, d); m.brand[c][d] = U.ri(0, DRUGS[d].brands.length - 1); }
    }
  },
  cityMult(c, d) { return (CITIES[c].mult || {})[d] || 1; },
  qf: (q) => 0.5 + q / 100,
  brand(c, d) { return DRUGS[d].brands[S.market.brand[c][d]] || DRUGS[d].brands[0]; },
  retail(c, d, q) { return DRUGS[d].base * this.cityMult(c, d) * S.market.trend[c][d] * this.qf(q); },
  buyUnit(c, d) { return DRUGS[d].base * 0.42 * this.cityMult(c, d) * S.market.trend[c][d] * this.qf(S.market.qual[c][d]); },
  sellUnit(c, d, q) { return this.retail(c, d, q) * 0.5; },
  // Les gros volumes font bouger le prix (impact moyen sur la transaction)
  buyCost(c, d, n) { return n * this.buyUnit(c, d) * (1 + 0.125 * n / DRUGS[d].depth); },
  sellValue(c, d, q, n) { return n * this.sellUnit(c, d, q) * Math.max(0.4, 1 - 0.125 * n / DRUGS[d].depth); },
  impact(c, d, n, dir) { const t = S.market.trend[c]; t[d] = U.clamp(t[d] * (1 + dir * 0.25 * n / DRUGS[d].depth), 0.3, 3); },
  shock(c, d, mult) { S.market.trend[c][d] = U.clamp(S.market.trend[c][d] * mult, 0.3, 3); },
  demand(d) { return DRUGS[d].demand * (1 + PlayerData.respect() / 100) * (1 + 0.15 * S.territories); },
  demandLeft(d) { return Math.max(0, Math.floor(this.demand(d) - (S.market.sold[S.city + ':' + d] || 0))); },
  trendIcon(c, d) { const t = S.market.trend[c][d]; return t > 1.25 ? '📈' : t < 0.8 ? '📉' : ''; },
  monthly() {
    for (const c in CITIES) for (const d in DRUGS) {
      let t = S.market.trend[c][d];
      t += (1 - t) * 0.25 + U.rand(-0.12, 0.12);
      S.market.trend[c][d] = U.clamp(t, 0.3, 3);
      if (U.chance(50)) S.market.qual[c][d] = this.rollQ(c, d);
      if (U.chance(30)) S.market.brand[c][d] = U.ri(0, DRUGS[d].brands.length - 1);
    }
    S.market.sold = {};
  },
};

/* ============================== INVENTORY ============================== */
const Inventory = {
  qty: (d) => (S.stock[d] ? S.stock[d].qty : 0),
  q: (d) => (S.stock[d] ? S.stock[d].q : 0),
  list: () => Object.keys(S.stock).filter((d) => S.stock[d].qty > 0),
  // x : { look } rendu d'un comprimé pressé maison, { cut } part de fentanyl dans le lot
  add(d, n, q, b, x = null) {
    n = Math.floor(n); if (n <= 0) return;
    const s = S.stock[d] || { qty: 0, q };
    s.q = Math.round((s.q * s.qty + q * n) / (s.qty + n));
    const cut = (x && x.cut) || 0;
    if (cut || s.cut) s.cut = Math.round(((s.cut || 0) * s.qty + cut * n) / (s.qty + n) * 100) / 100;
    s.qty += n; if (b) s.b = b;
    if (x && x.look) s.look = { ...x.look, b };
    S.stock[d] = s;
  },
  cut: (d) => (S.stock[d] && S.stock[d].cut) || 0,
  look(d, brand) { const s = S.stock[d]; return s && s.look && s.look.b === brand ? s.look : null; },
  brand: (d) => (S.stock[d] && S.stock[d].b) || DRUGS[d].brands[0],
  remove(d, n) {
    const s = S.stock[d]; if (!s) return 0;
    const r = Math.min(Math.floor(n), s.qty); s.qty -= r;
    if (s.qty <= 0) delete S.stock[d];
    return r;
  },
  bulk() { return Math.round(this.list().reduce((a, d) => a + S.stock[d].qty * DRUGS[d].bulk, 0)); },
  value() { return Math.round(this.list().reduce((a, d) => a + S.stock[d].qty * MarketData.sellUnit(S.city, d, S.stock[d].q), 0)); },
  streetValue(d, n) { return n * MarketData.retail(S.city, d, this.q(d)); },
  // saisie d'une fraction du stock, renvoie la valeur de rue saisie
  seize(frac) {
    let v = 0;
    for (const d of this.list()) { const n = Math.floor(S.stock[d].qty * frac); v += this.streetValue(d, n); this.remove(d, n); }
    return Math.round(v);
  },
};

  /* ----- Crimes ----- */
  stealChance(t) {

  steal(id) {

  /* ----- Drogues : consommation ----- */

  odRisk(d, mult, q, cut = 0) {
    const D = DRUGS[d]; if (!D.od) return 0;
    const used = Object.keys(S.used).filter((k) => DRUGS[k] && DRUGS[k].cat !== 'tabac');

    if ((D.opioid && benz) || (D.benzo && opi)) combo = 3;
    else if ((D.opioid && stim) || (D.stim && opi)) combo = 2;
    const times = used.reduce((a, k) => a + S.used[k], 0);
    const r = D.od * mult * (0.5 + q / 100) * combo * (1 + times * 0.4) * (S.health < 30 ? 1.6 : 1) * (1 - S.addiction / 300) * (1 + cut * 3);
    return Math.round(U.clamp(r, 0, 95) * 10) / 10;
  },
  consumeMenu(d, after = null, onCancel = null) {

      choices: DOSES.map((ds, i) => ({ label: this.doseLabel(d, i), sub: D.od ? `Risque d'overdose ~${this.odRisk(d, ds.mult, q, cut)} %` : 'Aucun risque d\'overdose', dis: !this.hasDose(d, i), cls: i === 2 && D.od ? 'danger' : '', fn: () => Ritual.start(d, i, false, after) }))
