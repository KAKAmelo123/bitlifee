// Mini-jeux de consommation : chaque étape est un bouton suivi d'une animation CSS.
const Ritual = {
  start(d, di, free = false, after = null) {
    const D = DRUGS[d], R = RITUALS[D.form] || RITUALS.powder, ds = DOSES[di];
    const brand = free ? U.pick(D.brands) : Inventory.brand(d);
    const st = { d, di, free, after, step: 0, R, brand, busy: false, el: null };
    UI.modal({ title: `${D.icon} ${D.name}`, cls: 'drug', text: `${U.esc(brand)} · ${ds.label.toLowerCase()} (${ds.units} ${U.u(D, ds.units)})`, html: '<div class="ritw"></div>', choices: [], onShow: (root) => {
      st.el = root.querySelector('.ritw');
      st.el.innerHTML = `<div class="stage ${R.cls}">${this.stage(D.form, brand)}</div><div class="r-cap">Prépare-toi…</div>
        <div class="r-steps">${R.steps.map(() => '<i></i>').join('')}</div><div class="m-choices"></div>`;
      st.el.addEventListener('click', (e) => { const b = e.target.closest('[data-ra]'); if (b && !b.disabled) this.act(st, b.dataset.ra); });
      this.buttons(st);
    } });
  },
  stage(form, brand) {
    const b = U.esc(brand);
    if (form === 'pill') return `<div class="mouth">👄</div><div class="lid"></div><div class="blister">${'<i></i>'.repeat(8)}</div><div class="box"><span>${b}</span></div><div class="pill"></div>`;
    if (form === 'syrup') return `<div class="cap"></div><div class="bottle"><div class="liq"></div><div class="lbl">${b}</div></div><div class="stream"></div><div class="cup"><div class="liq"></div></div>`;
    if (form === 'joint') return `<div class="bud">🌿</div>${[...Array(9)].map((_, i) => `<i class="crumb" style="--x:${U.ri(-60, 60)}px;--y:${U.ri(-22, 30)}px;--px:${-56 + i * 14}px"></i>`).join('')}<div class="paper"></div><div class="tip"></div><i class="smoke"></i><i class="smoke"></i><i class="smoke"></i>`;
    return '<div class="mirror"></div><div class="pile"></div><div class="line"></div><div class="card"></div>';
  },
  buttons(st, retry = false) {
    const s = st.R.steps[st.step];
    st.el.querySelectorAll('.r-steps i').forEach((x, i) => x.classList.toggle('on', i < st.step));
    st.el.querySelector('.m-choices').innerHTML = s ? `<button class="mbtn primary" data-ra="next" ${st.busy ? 'disabled' : ''}>${retry ? '🔁 ' : ''}${s.btn}</button><button class="mbtn ghost" data-ra="cancel" ${st.busy ? 'disabled' : ''}>Renoncer</button>` : '';
  },
  act(st, a) {
    if (st.busy) return;
    const D = DRUGS[st.d], cap = st.el.querySelector('.r-cap');
    if (a === 'cancel') { log('🙅', `Tu renonces finalement : ${D.name}, ce sera pour une autre fois.`, ''); return UI.dismiss(st.after); }
    const s = st.R.steps[st.step], last = st.step === st.R.steps.length - 1;
    if (!last && U.chance(12)) { cap.textContent = U.pick(st.R.fails); this.buttons(st, true); return; } // étape ratée : on recommence
    st.busy = true;
    st.el.querySelector('.stage').classList.add('s' + (st.step + 1));
    cap.textContent = s.cap(st.brand, D.name.toLowerCase());
    st.step++;
    this.buttons(st);
    setTimeout(() => {
      if (!st.el.isConnected) return;
      st.busy = false;
      if (st.step >= st.R.steps.length) UI.dismiss(() => Actions.consume(st.d, st.di, st.free, st.after));
      else this.buttons(st);
    }, s.dur * CONFIG.anim);
  },
};

/* ============================ VIE NOCTURNE ============================ */
const Night = {
  st: null,
  enter() {
    if (S.jail) return;
    const C = CITIES[S.city];
    UI.modal({ icon: '🪩', title: C.club, text: 'Basses qui font trembler les murs, file d\'attente, videurs à l\'entrée… La nuit t\'appartient.', choices: [
      { label: '🎟️ Entrée classique', sub: `${U.money(40)} · 1 ⚡`, dis: S.cash < 40, fn: () => this.start(false) },
      { label: '🍾 Carré VIP', sub: `${U.money(1500)} · 1 ⚡ · +3 👑 · clientèle fortunée (prix ×2)`, dis: S.cash < 1500, fn: () => this.start(true) },
      { label: 'Annuler', cls: 'ghost' },
    ] });
  },
  start(vip, invited = false) {
    if (!invited) { if (!PlayerData.useAP(1)) return; S.cash -= vip ? 1500 : 40; }
    if (vip) PlayerData.mod('respect', 3);
    this.st = { vip, acts: 0 };
    log('🪩', `Soirée ${vip ? 'en carré VIP ' : ''}au club « ${CITIES[S.city].club} ».`, 'info');
    this.menu();
  },
  menu() {
    UI.modal(() => {
      const st = this.st;
      if (!st) return null;
      if (!S.alive || S.jail) { this.st = null; return null; }
      if (st.acts >= 3) { this.end('6 h du matin : les lumières se rallument, la soirée est finie.'); return null; }
      return { icon: st.vip ? '🍾' : '🪩', title: CITIES[S.city].club, text: `${st.vip ? 'Carré VIP' : 'Sur la piste'} · activité ${st.acts + 1}/3<br><small class="m">Liquide : ${U.money(S.cash)} · ❤️ ${Math.round(S.health)}</small>`, choices: [
        { label: '💃 Danser & faire des rencontres', fn: () => this.dance() },
        { label: '🍸 Consommer', sub: 'Ton stock ou le dealer de la boîte', fn: () => this.drink() },
        { label: '💊 Vendre aux fêtards', sub: `Prix ×${st.vip ? 2 : 1.6} · sécurité et police aux aguets`, dis: !Inventory.list().length, fn: () => this.sellMenu() },
        { label: '😈 Chercher la bagarre', fn: () => this.fight(U.chance(65) ? 'fetard' : 'videur', 'Tu cherches le regard du premier venu… et tu le trouves.') },
        { label: '🚪 Rentrer', cls: 'ghost', fn: () => this.end() },
      ] };
    });
  },
  next() { if (!this.st) return; this.st.acts++; this.menu(); },
  end(txt) { if (!this.st) return; this.st = null; log('🚪', txt || 'Tu quittes la boîte au petit matin.', ''); },
  dance() {
    const r = Math.random();
    if (r < 0.25) { PlayerData.heal(4); PlayerData.mod('respect', 1); log('💞', 'Tu rencontres quelqu\'un de captivant : vous dansez et discutez jusqu\'à la fermeture (+4 ❤️).', 'good'); UI.result('💞', 'Belle rencontre', 'Une vraie connexion au milieu du bruit. +4 ❤️ · +1 👑', 'good'); }
    else if (r < 0.4) { PlayerData.mod('respect', 3); PlayerData.mod('heat', 1); log('🎤', 'Tu fais la fête avec un rappeur connu : les stories tournent toute la nuit (+3 👑).', 'good'); UI.result('🎤', 'Soirée avec une star', 'Photos, bouteilles, stories… Ton nom circule. +3 👑', 'good'); }
    else if (r < 0.6) return this.deal();
    else if (r < 0.75) { const loss = Math.min(S.cash, U.ri(50, 400)); S.cash -= loss; log('👛', `Pickpocket sur la piste : on t'a délesté de ${U.money(loss)}.`, 'bad'); UI.result('👛', 'Pickpocket !', `Quelqu'un t'a fait les poches pendant que tu dansais. −${U.money(loss)}`, 'bad'); }
    else if (r < 0.9) return this.fight('fetard', 'Un type jaloux te bouscule et te pousse contre le bar.');
    else { PlayerData.heal(2); log('🎶', 'Tu danses toute la nuit sans penser à rien (+2 ❤️).', ''); UI.toast('🎶 +2 santé'); }
    this.next();
  },
  deal() { // un client fortuné cherche de la marchandise
    const d = U.pick(['coke', 'mdma', 'keta', 'weed', 'lean']), D = DRUGS[d], have = Inventory.qty(d);
    const want = Math.max(2, Math.round(D.demand * U.rand(0.15, 0.4)));
    const unit = MarketData.retail(S.city, d, Inventory.q(d) || 50) * (this.st.vip ? 2.6 : 2.2);
    if (!have) { log('🤑', `Un fils de bonne famille cherchait ${want} ${U.u(D, want)} ${U.de(D.name)}… tu n'avais rien sur toi.`, ''); UI.result('🤑', 'Occasion manquée', `Un client fortuné voulait ${want} ${U.u(D, want)} ${U.de(D.name)} à ${U.unitPrice(unit)} l'unité. Tu n'as rien sur toi.`); return this.next(); }
    const n = Math.min(want, have);
    UI.modal({ icon: '🤑', title: 'Client fortuné', text: `Un fils de bonne famille veut <b>${n} ${U.u(D, n)}</b> ${U.de(D.name)} à <b>${U.unitPrice(unit)}</b> l'unité. Total : <b class="g">${U.money(n * unit)}</b>.`, choices: [
      { label: '🤝 Conclure l\'affaire', sub: 'Risque ~8 % (flic infiltré)', fn: () => {
        if (U.chance(8)) { log('🕵️', 'Le client fortuné était un policier infiltré !', 'bad'); this.st = null; return Actions.retailBust(d, n); }
        const rev = Math.round(n * unit);
        Inventory.remove(d, n); PlayerData.earn(rev); S.stats.sold += rev; PlayerData.mod('respect', 1); PlayerData.mod('heat', 2);
        log('🤑', `Deal en boîte : ${n} ${U.u(D, n)} ${U.de(D.name)} → <b>+${U.money(rev)}</b>.`, 'money'); this.next();
      } },
      { label: '🙅 Refuser', fn: () => this.next() },
    ] });
  },
  drink() {
    UI.modal({ icon: '🍸', title: 'Consommer', text: 'Au bar, aux toilettes ou dans le carré…', choices: [
      ...Inventory.list().map((d) => ({ label: `${DRUGS[d].icon} ${DRUGS[d].name}`, sub: `Ton stock : ${U.num(Inventory.qty(d))} ${U.u(DRUGS[d], U.num(Inventory.qty(d)))}`, fn: () => Actions.consumeMenu(d, () => this.next(), () => this.menu()) })),
      { label: '💊 Acheter un cachet au dealer de la boîte', sub: `${U.money(30)} · ecstasy de qualité inconnue`, dis: S.cash < 30, fn: () => { S.cash -= 30; Ritual.start('mdma', 1, true, () => this.next()); } },
      { label: '🍹 Juste un cocktail', sub: '15 €', fn: () => { S.cash = Math.max(0, S.cash - 15); log('🍹', 'Un cocktail au bar, tranquille.', ''); this.next(); } },
      { label: 'Retour', cls: 'ghost', fn: () => this.menu() },
    ] });
  },
  clubLeft(d) { return Math.max(0, Math.floor(DRUGS[d].demand * (CLUB_MULT[d] || 0.2) * (this.st.vip ? 0.6 : 1) * (1 + PlayerData.respect() / 150) - (S.market.sold['club:' + S.city + ':' + d] || 0))); },
  clubPrice(d) { return MarketData.retail(S.city, d, Inventory.q(d)) * (this.st.vip ? 2 : 1.6); },
  clubRisk(d, n) { return Math.round(U.clamp(Actions.retailRisk(d, n) * 1.5 + 5, 3, 75) * 10) / 10; },
  sellMenu() {
    UI.modal({ icon: '💊', title: 'Vendre aux fêtards', text: 'Qu\'est-ce que tu proposes ce soir ?', choices: Inventory.list().map((d) => {
      const left = this.clubLeft(d), D = DRUGS[d];
      return { label: `${D.icon} ${D.name}`, sub: left ? `${U.unitPrice(this.clubPrice(d))}/${D.unit} · ${left} ${U.u(D, left)} demandés` : 'Aucun client pour ça ici', dis: !left, fn: () => this.sellQty(d) };
    }).concat([{ label: 'Retour', cls: 'ghost', fn: () => this.menu() }]) });
  },
  sellQty(d) {
    const D = DRUGS[d], max = Math.min(Inventory.qty(d), this.clubLeft(d)), unit = this.clubPrice(d);
    UI.qty({ icon: D.icon, title: `Vendre en boîte — ${D.name}`, text: `Prix fêtards : <b>${U.unitPrice(unit)}</b> / ${D.unit}`, max, init: max, unit: D.unit,
      info: (n) => `Recette : <b class="g">${U.money(n * unit)}</b><br>Risque (videurs, police) : ${U.risk(this.clubRisk(d, n))}`,
      confirm: '💊 Vendre', onConfirm: (n) => this.doSell(d, n), onCancel: () => this.menu() });
  },
  doSell(d, n) {
    n = Math.min(n, Inventory.qty(d)); if (n < 1) return this.menu();
    if (U.chance(this.clubRisk(d, n))) {
      if (U.chance(45)) { log('🕵️', 'Un de tes clients était un policier en civil !', 'bad'); this.st = null; return Actions.retailBust(d, n); }
      return this.bouncer(d, n);
    }
    this.complete(d, n);
  },
  complete(d, n) {
    const D = DRUGS[d], rev = Math.round(n * this.clubPrice(d));
    Inventory.remove(d, n); PlayerData.earn(rev); S.stats.sold += rev;
    const k = 'club:' + S.city + ':' + d; S.market.sold[k] = (S.market.sold[k] || 0) + n;
    PlayerData.mod('heat', Math.min(6, n * D.bulk / 40 + 1)); PlayerData.mod('respect', 0.5);
    log('💊', `Vente aux fêtards : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} → <b>+${U.money(rev)}</b>.`, 'money');
    UI.toast(`💊 +${U.money(rev)}`);
    this.next();
  },
  bouncer(d, n) {
    const D = DRUGS[d];
    UI.modal({ icon: '🦍', title: 'Repéré par la sécurité !', cls: 'bad', text: `Un videur t'a vu dealer près des toilettes (${D.name}). Il te barre la route.`, choices: [
      { label: '👊 Lui tenir tête', sub: `Victoire ~${Combat.estimate('videur', { arms: 'melee' })} %`, fn: () => Combat.start({ foe: 'videur', ctx: { arms: 'melee', flee: 45, place: CITIES[S.city].club, intro: 'Le videur fait craquer ses phalanges : « Dehors. Tout de suite. »' },
        onEnd: (res) => {
          if (res === 'win') { PlayerData.mod('respect', 3); log('🦍', 'Tu mets le videur au tapis et files par l\'issue de secours avec ta marchandise (+3 👑).', 'good'); UI.result('🦍', 'Videur au tapis', 'Tu gardes ta marchandise et disparais dans la nuit. +3 👑', 'good'); }
          else if (res === 'lose') { const lost = Inventory.remove(d, n); log('🦍', `Le videur te jette dehors et confisque ${lost} ${U.u(D, lost)} ${U.de(D.name)}.`, 'bad'); UI.result('🦍', 'Jeté dehors', `Marchandise confisquée : ${lost} ${U.u(D, lost)}.`, 'bad'); }
          else log('🏃', 'Tu fausses compagnie au videur par la sortie de secours.', '');
          this.end('La soirée est finie pour toi.');
        } }) },
      { label: `💶 Lui glisser un billet (${U.money(200)})`, sub: 'Chance ~70 %', dis: S.cash < 200, fn: () => {
        S.cash -= 200;
        if (U.chance(70)) { log('💶', 'Le videur empoche le billet et détourne le regard.', ''); this.complete(d, n); }
        else { const lost = Inventory.remove(d, n); log('🦍', `Le videur prend l'argent… et ta marchandise (${lost} ${U.u(D, lost)}). Dehors !`, 'bad'); UI.result('🦍', 'Arnaqué', 'Billet empoché, marchandise confisquée, et direction le trottoir.', 'bad'); this.end('Tu es jeté dehors.'); }
      } },
      { label: '🚪 Lâcher la marchandise et partir', fn: () => { const lost = Inventory.remove(d, n); log('🚪', `Tu abandonnes ${lost} ${U.u(D, lost)} ${U.de(D.name)} et quittes la boîte.`, 'bad'); this.end('Soirée gâchée.'); } },
    ] });
  },
  fight(foe, intro) {
    Combat.start({ foe, ctx: { arms: 'melee', flee: 55, place: CITIES[S.city].club, intro }, onEnd: (res) => {
      if (res === 'win') {
        PlayerData.mod('respect', 2); PlayerData.mod('heat', 2);
        log('👊', `Bagarre en boîte : ${U.the(FOES[foe].name).toLowerCase()} finit au tapis (+2 👑).`, 'good');
        if (foe === 'videur' || U.chance(40)) return this.end('La sécurité te met dehors après la bagarre.');
        this.next();
      } else if (res === 'lose') { PlayerData.mod('respect', -2); log('🤕', 'Bagarre en boîte : tu finis K.O. sur le trottoir (−2 👑).', 'bad'); this.end('Fin de soirée sur le trottoir.'); }
      else { log('🏃', 'Tu t\'éclipses avant que ça dégénère.', ''); this.next(); }
    } });
  },
};

/* ============================ CRIME DE RUE ============================ */
const Street = {
  pickChance() { return Math.round(U.clamp(68 + PlayerData.crimeBuff() - S.heat * 0.15 - S.addiction * 0.1, 10, 92)); },
  intimidate(base) { return Math.round(U.clamp(base + S.force * 0.4 + PlayerData.respect() * 0.25 + PlayerData.firepower() * 0.3 + S.territories * 4 + PlayerData.crimeBuff() * 0.5, 5, 95)); },
  pickpocket() {
    if (!PlayerData.useAP(1)) return;
    S.stats.crimes++;
    if (U.chance(this.pickChance())) {
      const g = Math.round(U.ri(30, 320) * (S.city === 'miami' || S.city === 'paris' ? 1.25 : 1));
      PlayerData.earn(g); PlayerData.mod('heat', 1.5);
      log('🤏', `Vol à la tire : tu subtilises un portefeuille dans la foule (+${U.money(g)}).`, 'money'); UI.toast(`🤏 +${U.money(g)}`); return;
    }
    const r = Math.random();
    if (r < 0.4) { PlayerData.mod('heat', 3); log('🏃', 'Vol à la tire raté : la victime crie au voleur, tu te fonds dans la foule.', 'bad'); UI.result('🏃', 'Repéré !', 'La victime a senti ta main. Tu disparais dans la foule.', 'bad'); }
    else if (r < 0.75) {
      log('😠', 'Vol à la tire raté : la victime t\'attrape par le bras !', 'bad');
      Combat.start({ foe: 'passant', over: { name: 'Ta victime', role: 'Passant en colère' }, ctx: { arms: 'melee', flee: 60, place: 'Vol à la tire', intro: 'La victime t\'a saisi le poignet et refuse de lâcher prise.' }, onEnd: (res) => {
        if (res === 'win') { const g = U.ri(20, 200); PlayerData.earn(g); PlayerData.mod('heat', 4); log('👊', `Tu te dégages et repars avec le portefeuille (+${U.money(g)}).`, 'money'); }
        else if (res === 'lose') { log('🤕', 'La victime te maîtrise en attendant la police…', 'bad'); Actions.arrest({ charge: 'Vol à la tire', months: U.ri(1, 4) }); }
        else log('🏃', 'Tu te dégages et t\'enfuis les mains vides.', '');
      } });
    } else { log('🚓', 'Vol à la tire : un policier en civil t\'a vu faire.', 'bad'); Actions.arrest({ charge: 'Vol à la tire', months: U.ri(1, 4) }); }
  },
  racketPassant() {
    if (!PlayerData.useAP(1)) return;
    S.stats.crimes++;
    if (U.chance(this.intimidate(35))) {
      const g = U.ri(40, 450); PlayerData.earn(g); PlayerData.mod('respect', 1); PlayerData.mod('heat', 3);
      log('😈', `Racket : un passant terrorisé te tend son argent (+${U.money(g)}).`, 'money');
      UI.result('😈', 'Racket réussi', `Ta carrure et ta réputation ont suffi. <b class="g">+${U.money(g)}</b>`, 'good'); return;
    }
    log('💪', 'Racket : le passant refuse de payer et se met en garde.', 'bad');
    Combat.start({ foe: 'costaud', ctx: { arms: 'all', flee: 55, place: 'Racket de rue', intro: '« Tu crois que je vais te donner mon fric ? Viens le chercher. »' }, onEnd: (res) => {
      if (res === 'win') { const g = U.ri(60, 500); PlayerData.earn(g); PlayerData.mod('respect', 2); PlayerData.mod('heat', 5); log('👊', `Racket : tu mets le récalcitrant au sol et prends son argent (+${U.money(g)}).`, 'money'); UI.result('👊', 'Il a payé', `<b class="g">+${U.money(g)}</b> · +2 👑`, 'good'); }
      else if (res === 'lose') { PlayerData.mod('respect', -3); log('🤕', 'Racket raté : le passant t\'a humilié devant tout le monde (−3 👑).', 'bad'); }
      else log('🏃', 'Racket raté : tu préfères décamper.', '');
      if (S.alive && U.chance(10 * CITIES[S.city].police)) Actions.arrest({ charge: 'Extorsion avec violence', months: U.ri(4, 12) });
    } });
  },
  racketShop() {
    if (!PlayerData.useAP(1)) return;
    S.stats.crimes++;
    const free = SHOPS_RACKET.filter((n) => !S.rackets.some((r) => r.name === n));
    const shop = U.pick(free.length ? free : SHOPS_RACKET);
    const win = () => {
      const g = U.ri(300, 2500); PlayerData.earn(g); PlayerData.mod('respect', 2); PlayerData.mod('heat', 5);
      let extra = '';
      if (free.includes(shop) && U.chance(35)) {
        const m = Math.round(U.ri(150, 450) * (1 + S.rank * 0.3));
        S.rackets.push({ name: shop, amount: m }); extra = ` Le gérant accepte de te verser ${U.money(m)}/mois de « protection ».`;
      }
      log('🏪', `Racket (${shop}) : ${U.money(g)} empochés.${extra}`, 'money');
      UI.result('🏪', 'Le commerçant a payé', `<b class="g">+${U.money(g)}</b> · +2 👑${extra ? '<br>' + extra : ''}`, 'good');
    };
    if (U.chance(this.intimidate(25))) return win();
    UI.modal({ icon: '🧑‍🍳', title: 'Le commerçant résiste', text: `Le gérant (${shop}) sort une batte de derrière le comptoir et menace d'appeler la police.`, choices: [
      { label: '👊 L\'affronter', sub: `Victoire ~${Combat.estimate('commercant', { arms: 'all' })} %`, fn: () => Combat.start({ foe: 'commercant', ctx: { arms: 'all', flee: 55, place: shop },
        onEnd: (res) => { if (res === 'win') win(); else if (res === 'lose') { PlayerData.mod('respect', -3); log('🤕', 'Le commerçant t\'a chassé à coups de batte (−3 👑).', 'bad'); } else log('🏃', 'Tu quittes la boutique en courant.', ''); } }) },
      { label: '🏃 Partir avant la police', fn: () => { PlayerData.mod('respect', -1); log('🏃', `Racket raté (${shop}) : tu repars bredouille.`, ''); if (U.chance(30)) { PlayerData.mod('heat', 6); log('📞', 'Le commerçant a porté plainte (+6 🚨).', 'bad'); } } },
    ] });
  },
};

/* ============================== MUSCULATION ============================== */
const Gym = {
  open() {
    UI.modal({ icon: '🏋️', title: 'Salle de sport', text: `💪 Force : <b>${Math.round(S.force)} %</b>${S.roids > 0 ? ' · 🧬 sous stéroïdes (gains ×1,8)' : ''}<br><small class="m">La force augmente tes dégâts au combat et ta résistance aux coups. Sans entraînement, la musculature fond chaque mois.</small>`,
      choices: GYM.map((p) => ({ label: `${p.icon} ${p.name}`, sub: `${U.money(p.cost)} · 1 ⚡ · ${p.desc}`, dis: !PlayerData.can(p.cost), fn: () => this.train(p.id) })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  gain(range) { return U.rand(range[0], range[1]) * (1 - S.force / 115) * (S.roids > 0 ? 1.8 : 1); },
  train(id) {
    const p = GYM.find((x) => x.id === id);
    if (!PlayerData.can(p.cost)) return UI.toast('Pas assez d\'argent.');
    if (!PlayerData.useAP(1)) return;
    PlayerData.pay(p.cost); S.trained = true;
    if (p.injury && U.chance(p.injury)) {
      log('🤕', `${p.name} : blessure à l'entraînement (−5 ❤️).`, 'bad');
      PlayerData.hurt(5, 'Blessure à l\'entraînement');
      if (S.alive) UI.result('🤕', 'Blessure', 'Un mauvais coup à l\'entraînement. −5 ❤️', 'bad');
      return;
    }
    const f = this.gain(p.force), h = U.ri(p.hp[0], p.hp[1]);
    PlayerData.mod('force', f); if (h) PlayerData.heal(h); if (p.respect) PlayerData.mod('respect', p.respect);
    const ft = f.toFixed(1).replace('.', ',');
    log(p.icon, `${p.name} : +${ft} 💪 force${h ? `, +${h} ❤️` : ''}.`, 'good');
    UI.toast(`${p.icon} +${ft} force${h ? ` · +${h} santé` : ''}`);
  },
};

/* ============================== PRISON ============================== */
const Prison = {
  enter() { S.prison = { served: 0, protection: 0, ally: null, hunted: false, shank: false }; },
  ensure() { if (!S.prison) this.enter(); return S.prison; },
  // Menace des cartels : dépend de ton historique (territoires, guerres, victimes, grade)
  threat() {
    const p = this.ensure();
    let t = S.territories * 2 + S.stats.wars * 0.4 + S.stats.kills * 0.5 + S.rank * 1.5 + (p.hunted ? 15 : 0);
    if (p.protection > 0) t *= 0.25;
    return t;
  },
  threatLabel() { const t = this.threat(); return t >= 12 ? '<b class="r">Élevée</b>' : t >= 5 ? '<b class="y">Moyenne</b>' : '<b class="g">Faible</b>'; },
  rival() { return S.rivals.length ? U.pick(S.rivals).name : U.pick(RIVAL_NAMES); },
  monthly() {
    const p = this.ensure(); p.served++;
    if (p.protection > 0) p.protection--;
    log('⛓️', `Détention — mois ${p.served} · encore ${U.dur(S.jail)}${p.protection > 0 ? ' · 🛡️ sous protection' : ''}`, 'jail');
  },
  event() {
    const p = this.ensure(), th = this.threat();
    const pool = [
      { w: 4, run: () => this.corvee() }, { w: 4, run: () => this.traffic() }, { w: p.ally ? 0 : 3, run: () => this.alliance() },
      { w: 3, run: () => this.yard() }, { w: 2, run: () => this.visit() },
      { w: th * 0.6, run: () => this.intimidation() }, { w: th * 0.4 + (p.hunted ? 25 : 0), run: () => this.attack() },
    ].filter((e) => e.w > 0);
    let r = Math.random() * pool.reduce((a, e) => a + e.w, 0);
    for (const e of pool) { r -= e.w; if (r <= 0) return e.run(); }
  },
  corvee() {
    const job = U.pick(['aux cuisines', 'à la buanderie', 'au nettoyage des coursives', 'à l\'atelier de menuiserie']);
    UI.modal({ icon: '🧹', title: 'Corvée', text: `L'administration t'affecte ${job}. Payé une misère, mais bien vu par le juge d'application des peines.`, choices: [
      { label: '🧹 Accepter la corvée', sub: '+120 € · chance de remise de peine', fn: () => { S.cash += 120; let t = 'Tu fais ta corvée sans broncher (+120 €).'; if (U.chance(25) && S.jail > 1) { S.jail--; t += ' <b>Remise de peine : −1 mois</b> pour bonne conduite.'; } log('🧹', t, 'jail'); } },
      { label: '🙅 Refuser', sub: '+1 👑 · risque de mitard', fn: () => { PlayerData.mod('respect', 1); if (U.chance(40)) { S.jail += 1; log('🔒', 'Refus de corvée : mitard et +1 mois au compteur. Mais les détenus respectent ça (+1 👑).', 'bad'); } else log('🙅', 'Tu refuses la corvée. Les surveillants notent, les détenus apprécient (+1 👑).', 'jail'); } },
    ] });
  },
  traffic() {
    const what = U.pick(['des téléphones', 'du shit', 'des cartes SIM', 'des cachets']);
    UI.modal({ icon: '📦', title: 'Trafic interne', text: `Un codétenu te propose de faire entrer ${what} par le parloir. Un bon business… si personne ne balance.`, choices: [
      { label: '🤝 Participer', sub: 'Gain 500–3 000 € · 25 % de risque', fn: () => {
        if (U.chance(25)) { const m = U.ri(3, 8); S.jail += m; log('🚨', `Fouille générale : le trafic est découvert. +${m} mois et passage au mitard.`, 'bad'); UI.result('🚨', 'Découvert !', `+${m} mois de détention.`, 'bad'); }
        else { const g = U.ri(500, 3000); PlayerData.earn(g); PlayerData.mod('respect', 1); log('📦', `Trafic interne : l'opération passe sans accroc (+${U.money(g)}).`, 'money'); }
      } },
      { label: '💶 Financer sans se mouiller (1 000 €)', sub: '60 % de chance de doubler la mise', dis: !PlayerData.can(1000), fn: () => { PlayerData.pay(1000); if (U.chance(60)) { PlayerData.earn(2200); log('💶', 'Ton investissement en détention rapporte 2 200 €.', 'money'); } else log('💸', 'Le colis a été intercepté : ta mise est perdue.', 'bad'); } },
      { label: '🙅 Refuser', fn: () => log('🙅', 'Tu refuses de te mêler du trafic interne.', 'jail') },
    ] });
  },
  alliance() {
    const p = this.ensure(), g = U.pick(PRISON_GANGS), tribute = 1500 * (1 + S.rank);
    UI.modal({ icon: '🤝', title: 'Proposition d\'alliance', text: `Les ${g} te proposent de rejoindre leur clan. En échange de leur protection, ils attendent un « geste ».`, choices: [
      { label: `💶 Payer le tribut (${U.money(tribute)})`, sub: 'Protection jusqu\'à ta sortie', dis: !PlayerData.can(tribute), fn: () => { PlayerData.pay(tribute); p.ally = g; p.protection = S.jail + 1; p.hunted = false; log('🤝', `Alliance scellée avec les ${g} : tu es sous leur protection.`, 'good'); } },
      { label: '🤐 Rendre un service', sub: 'Faire le guet pendant un règlement de comptes · 30 % de risque', fn: () => {
        if (U.chance(30)) { const m = U.ri(4, 10); S.jail += m; log('🚨', `Le « service » tourne mal : complicité d'agression, +${m} mois.`, 'bad'); UI.result('🚨', 'Ça a mal tourné', `+${m} mois de détention.`, 'bad'); }
        else { p.ally = g; p.protection = S.jail + 1; PlayerData.mod('respect', 2); log('🤝', `Service rendu : les ${g} te protègent désormais (+2 👑).`, 'good'); }
      } },
      { label: '🙅 Refuser poliment', fn: () => log('🙅', `Tu déclines l'offre des ${g}. Ils n'insistent pas… pour l'instant.`, 'jail') },
      { label: '😤 Les envoyer balader', sub: '+3 👑 · ils s\'en souviendront', fn: () => { PlayerData.mod('respect', 3); if (U.chance(50)) p.hunted = true; log('😤', `Tu envoies balader les ${g} devant tout le monde (+3 👑). Ça risque de se payer.`, 'bad'); } },
    ] });
  },
  yard() {
    UI.modal({ icon: '😠', title: 'Provocation en promenade', text: 'Un gros bras du bâtiment te bouscule exprès devant tout le monde. Tous les regards sont sur toi.', choices: [
      { label: '👊 Accepter le combat', sub: `${this.ensure().shank ? '🗡️ Surin' : '👊 Mains nues'} · victoire ~${Combat.estimate('detenu', { arms: 'prison' })} %`, fn: () => Combat.start({ foe: 'detenu', ctx: { arms: 'prison', flee: 35, place: 'Cour de promenade' },
        onEnd: (res) => {
          if (res === 'win') { PlayerData.mod('respect', 4); log('👊', 'Promenade : tu mets le gros bras à terre. Le bâtiment te respecte (+4 👑).', 'good'); }
          else if (res === 'lose') { PlayerData.mod('respect', -3); log('🤕', 'Promenade : tu t\'es fait humilier (−3 👑).', 'bad'); }
          else { PlayerData.mod('respect', -2); log('🏃', 'Les surveillants interviennent pendant que tu recules (−2 👑).', 'jail'); }
        } }) },
      { label: '👀 Baisser les yeux', sub: '−2 👑', fn: () => { PlayerData.mod('respect', -2); log('👀', 'Tu baisses les yeux. En prison, ça se paie (−2 👑).', 'bad'); } },
    ] });
  },
  visit() {
    if (S.crew.length && U.chance(60)) { S.crew.forEach((c) => { c.loyalty = Math.min(100, c.loyalty + 5); }); log('📞', 'Parloir : tes lieutenants viennent prendre les ordres. Loyauté de l\'équipe +5.', 'jail'); }
    else { PlayerData.heal(4); log('👩', 'Parloir : ta mère est venue te voir avec du linge propre et des larmes (+4 ❤️).', 'jail'); }
  },
  intimidation() {
    const rv = this.rival(), p = this.ensure(), bribe = 2500 * (1 + S.rank), prot = 4000 * (1 + S.rank);
    const sign = U.pick(['un rat mort dans ton lit', 'une photo de ta famille glissée sous ta porte', 'une lame posée sur ton oreiller', 'un mot griffonné : « On sait qui tu es. »']);
    UI.modal({ icon: '💀', title: 'Menace du cartel', cls: 'bad', text: `En rentrant en cellule, tu trouves ${sign}. Le message vient <b>${U.deN(rv)}</b> : un contrat court peut-être sur ta tête.`, choices: [
      { label: '🔪 Se défendre : fabriquer un surin', sub: p.shank ? 'Tu as déjà une lame planquée' : 'Arme de fortune pour les combats en détention · +1 👑', fn: () => { p.shank = true; PlayerData.mod('respect', 1); p.hunted = true; log('🔪', 'Tu affûtes une brosse à dents en surin. Qu\'ils viennent.', 'jail'); } },
      { label: `💶 Soudoyer des gardes (${U.money(bribe)})`, sub: 'Transfert des suspects · protection 6 mois', dis: !PlayerData.can(bribe), fn: () => { PlayerData.pay(bribe); p.protection = Math.max(p.protection, 6); p.hunted = false; log('💶', 'Des surveillants font transférer les détenus suspects. Tu respires… pour 6 mois.', 'good'); } },
      { label: `🤝 Négocier sa protection (${U.money(prot)})`, sub: 'Auprès d\'un clan de détenus · jusqu\'à ta sortie', dis: !PlayerData.can(prot), fn: () => { PlayerData.pay(prot); const g = U.pick(PRISON_GANGS); p.ally = g; p.protection = S.jail + 1; p.hunted = false; log('🤝', `Les ${g} acceptent de te protéger contre ${rv}.`, 'good'); } },
      { label: '🤷 Ignorer la menace', sub: 'Dangereux', fn: () => { p.hunted = true; log('🤷', 'Tu fais comme si de rien n\'était. Mauvaise idée ?', 'bad'); } },
    ] });
  },
  attack() {
    const rv = this.rival(), p = this.ensure(), bribe = 3000 * (1 + S.rank), price = 8000 * (1 + S.rank);
    const where = U.pick(['Dans les douches', 'À la bibliothèque', 'Dans la file de la cantine', 'Dans un angle mort de la cour']);
    UI.modal({ icon: '🔪', title: 'Tentative d\'assassinat !', cls: 'bad', text: `${where}, un détenu affilié <b>${U.aN(rv)}</b> surgit, un surin à la main. Il est là pour toi.`, choices: [
      { label: '🛡️ Se défendre', sub: `${p.shank ? '🗡️ Surin' : '👊 Mains nues'} · victoire ~${Combat.estimate('sicaire', { arms: 'prison' })} %`, fn: () => this.fightAssassin(rv) },
      { label: `💶 Soudoyer un garde (${U.money(bribe)})`, sub: 'Un surveillant intervient ~70 %', dis: !PlayerData.can(bribe), fn: () => {
        PlayerData.pay(bribe);
        if (U.chance(70)) { p.protection = Math.max(p.protection, 4); p.hunted = false; log('👮', 'Un surveillant payé intervient au dernier moment et plaque l\'agresseur au sol.', 'good'); UI.result('👮', 'Sauvé', 'Le garde a tenu parole. L\'agresseur part au mitard.', 'good'); }
        else { log('😨', 'Le garde a empoché l\'argent… et regardé ailleurs.', 'bad'); this.fightAssassin(rv, true); }
      } },
      { label: `🤝 Négocier (${U.money(price)})`, sub: `Racheter le contrat · succès ~${Math.round(U.clamp(40 + PlayerData.respect() * 0.5, 0, 95))} %`, dis: !PlayerData.can(price), fn: () => {
        PlayerData.pay(price);
        if (U.chance(40 + PlayerData.respect() * 0.5)) { p.hunted = false; p.protection = Math.max(p.protection, 8); log('🤝', `Tu fais passer un message ${U.aN(rv)} : le contrat est racheté.`, 'good'); UI.result('🤝', 'Contrat racheté', 'Le tueur range sa lame. « Pour cette fois. »', 'good'); }
        else { log('💸', 'Il prend l\'argent… et attaque quand même !', 'bad'); this.fightAssassin(rv); }
      } },
    ] });
  },
  fightAssassin(rv, surprise = false) {
    const p = this.ensure();
    Combat.start({ foe: 'sicaire', over: { role: `Envoyé ${U.deN(rv)}` }, ctx: { arms: 'prison', lethal: true, flee: 30, place: 'Détention', cause: `Assassiné en prison par un envoyé ${U.deN(rv)}`, intro: surprise ? 'Pris par surprise, dos au mur…' : 'Il fonce sur toi, lame en avant.' },
      onEnd: (res) => {
        if (res === 'win') { const m = U.ri(6, 18); S.jail += m; p.hunted = false; PlayerData.mod('respect', 8); log('☠️', `Tu as tué l'envoyé ${U.deN(rv)}. Légitime défense contestée : +${m} mois. Toute la prison te craint (+8 👑).`, 'bad'); UI.result('☠️', 'Survivant', `L'assassin ne se relèvera pas. +${m} mois de peine, mais plus personne n'osera t'approcher.`, 'bad'); }
        else if (res === 'fled') { p.hunted = U.chance(50); log('🏃', 'Tu parviens à rejoindre les surveillants. L\'agresseur part au mitard.', 'jail'); }
      } });
  },
};

const Profile = {

  open() {
    const b = PlayerData.styleBreakdown(), E = (s) => PlayerData.equipped(s), r = RANKS[S.rank];
    const ic = (s) => (E(s) ? E(s).icon : `<span class="empty">${SLOTS[s].icon}</span>`);
    const extra = (...sl) => sl.map((s) => (E(s) ? E(s).icon : '')).join('');
    const doll = `<div class="doll">
      <div class="d head">${S.avatar}<small>${E('dents') ? '😁 grillz' : 'visage'}</small></div>
      <div class="d">${ic('cou')}${extra('pendentif')}<small>cou</small></div>
      <div class="d">${ic('haut')}${extra('veste')}<small>torse</small></div>
      <div class="d">${ic('montre')}${extra('poignet', 'doigts')}<small>poignets</small></div>
      <div class="d">${ic('bas')}<small>jambes</small></div>

      💪 Force ${Math.round(S.force)} %<br>👑 Respect ${PlayerData.respect()} %<br>❤️ Santé ${Math.round(S.health)} %<br><span class="tier">${this.tier(b.total)}</span></div>`;
    const slot = (s) => {
      const it = E(s), n = PlayerData.items(SLOTS[s].cat).filter((i) => i.slot === s).length;
      return `<button class="slot ${it ? '' : 'none'}" data-slot="${s}"><span class="si">${it ? it.icon : SLOTS[s].icon}</span><span class="sl"><small>${SLOTS[s].label}${n > 1 ? ` · ${n} en stock` : ''}</small><b>${it ? it.name : 'Rien d\'équipé'}</b></span><span class="sr">${it ? '+' + it.respect : ''}</span></button>`;
    };
    const list = (cat) => Object.keys(SLOTS).filter((s) => SLOTS[s].cat === cat).map(slot).join('');
    const bonus = `<div class="bonus"><span>👕 Tenue</span><b>+${b.tenue}</b><span>💍 Accessoires</span><b>+${b.acc}</b><span>🚗 Meilleur véhicule</span><b>+${b.veh}</b>
      <span>🏠 Logement</span><b>+${b.home}</b><span>🏢 Commerces</span><b>+${b.biz}</b>
      <span class="tot">Bonus de respect${b.raw > 40 ? ' (plafonné)' : ''}</span><b class="tot y">+${b.total} / 40</b></div>`;
    UI.modal({ title: '🪞 Profil & Style', cls: 'profile', html: `<div class="prof">${doll}${info}</div><div class="ptitle">Tenue équipée</div>${list('clothes')}<div class="ptitle">Accessoires</div>${list('jewelry')}<div class="ptitle">Statut social</div>${bonus}`,
      choices: [{ label: '🛍️ Boutique de vêtements', fn: () => { if (!S.jail) { UI.tab = 'assets'; UI.stack = [{ view: 'assets' }, { view: 'shop', arg: 'clothes' }]; } else UI.toast('⛓️ Pas de shopping en cellule.'); } }, { label: 'Fermer', cls: 'ghost' }],
      onShow: (root) => root.querySelectorAll('[data-slot]').forEach((bt) => bt.addEventListener('click', () => { const s = bt.dataset.slot; UI.dismiss(() => this.pick(s)); })) });
  },
  pick(slot) {
    const sl = SLOTS[slot], cur = S.equip[slot];
    const own = PlayerData.items(sl.cat).filter((i) => i.slot === slot).sort((a, b) => b.respect - a.respect);
    UI.modal({ icon: sl.icon, title: sl.label, text: own.length ? 'Que portes-tu ?' : 'Tu ne possèdes rien pour cet emplacement. Passe par la boutique !', choices: [
      ...own.map((it) => ({ label: `${it.icon} ${it.name}${it.id === cur ? ' ✔' : ''}`, sub: `+${it.respect} respect`, cls: it.id === cur ? 'primary' : '', fn: () => { Shop.equip(it); this.open(); } })),
      ...(cur ? [{ label: '🚫 Ne rien porter', fn: () => { delete S.equip[slot]; this.open(); } }] : []),
      { label: '↩️ Retour au profil', cls: 'ghost', fn: () => this.open() },
    ] });
  },
};

/* ================================ UI ================================ */
const CB = { h: [], p: [], m: [] };
function cb(fn, scope = 'p') { CB[scope].push(fn); return scope + (CB[scope].length - 1); }

const H = {
  sec: (t) => `<div class="sec">${t}</div>`,
  note: (t) => `<div class="note">${t}</div>`,
  card: (html, cls = '') => `<div class="card ${cls}">${html}</div>`,
  mini: (v, max, cls = '') => `<div class="mini ${cls}"><i style="width:${U.clamp(v / Math.max(1, max) * 100, 0, 100)}%"></i></div>`,
  kv: (pairs) => `<div class="kv">${pairs.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`,
  row({ icon, title, sub = '', right = '', fn, dis = false, cls = '' }) {
    const inner = `<span class="r-ic">${icon}</span><span class="r-tx"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>${right ? `<span class="r-rt">${right}</span>` : ''}`;
    if (!fn) return `<div class="row static ${cls}">${inner}</div>`;
    return `<button class="row ${cls}" data-cb="${cb(fn)}" ${dis ? 'disabled' : ''}>${inner}</button>`;
  },
};

const UI = {
  stack: [], tab: null, cur: null, queue: [], _seq: -1, _toastT: null,
  toast(msg) {
    const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
    clearTimeout(this._toastT); this._toastT = setTimeout(() => t.classList.remove('show'), 2200);
  },
  /* ----- Modales (file d'attente) ----- */
  // m peut être une fonction : la modale est alors construite au moment de son affichage (file d'attente)
  modal(m) {
    if (S && !S.alive && !m.force) return;
    if (this.cur) { this.queue.push(m); return; }
    this.showModal(m);
  },
  showModal(m) {
    if (typeof m === 'function') m = m();
    if (!m || (S && !S.alive && !m.force)) { if (this.queue.length) this.showModal(this.queue.shift()); return; }
    this.cur = m; CB.m = [];
    const choices = (m.choices || [{ label: 'OK', cls: 'primary' }]).map((c) =>
      `<button class="mbtn ${c.cls || ''}" ${c.dis ? 'disabled' : ''} data-cb="${cb(() => this.choose(c), 'm')}">${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}</button>`).join('');
    const root = $('#modal-root');
    root.innerHTML = `<div class="overlay"><div class="modal ${m.cls || ''}" role="dialog">${m.icon ? `<div class="m-icon">${m.icon}</div>` : ''}${m.title ? `<h3>${m.title}</h3>` : ''}<div class="m-text">${m.text || ''}</div>${m.html || ''}<div class="m-choices">${choices}</div></div></div>`;
    root.classList.add('show');
    if (m.onShow) m.onShow(root);
    this.renderNav();
  },
  choose(c) {
    this.cur = null;
    const root = $('#modal-root'); root.innerHTML = ''; root.classList.remove('show');
    if (c.fn) c.fn();
    if (!this.cur && this.queue.length) this.showModal(this.queue.shift());
    this.renderNav();
  },
  // fermeture d'une modale interactive (combat, rituel, profil) hors du gestionnaire de clics
  dismiss(fn) {
    this.cur = null;
    const root = $('#modal-root'); root.innerHTML = ''; root.classList.remove('show');
    if (fn) fn();
    if (!this.cur && this.queue.length) this.showModal(this.queue.shift());
    this.renderNav();
    if (S) Game.commit();
  },
  result(icon, title, text, cls = '') { this.modal({ icon, title, text, cls }); },
  confirm(icon, title, text, label, fn, cls = 'primary') { this.modal({ icon, title, text, choices: [{ label, cls, fn }, { label: 'Annuler', cls: 'ghost' }] }); },
  pay({ icon, title, text = '', price, cashOnly = false, onPay }) {
    const heat = cashOnly ? 0 : Actions.cashHeat(price);
    const ch = [{ label: '💵 Payer en liquide', sub: heat ? `Gros paiement cash suspect : +${heat} 🚨` : `Liquide : ${U.money(S.cash)}`, dis: S.cash < price,
      fn: () => { S.cash -= price; PlayerData.mod('heat', heat); onPay('cash'); } }];
    if (!cashOnly) ch.push({ label: '🏦 Payer par virement', sub: `Banque : ${U.money(S.bank)} · aucune trace suspecte`, dis: S.bank < price, fn: () => { S.bank -= price; onPay('bank'); } });
    ch.push({ label: 'Annuler', cls: 'ghost' });
    this.modal({ icon, title, text: `${text}${text ? '<br>' : ''}Prix : <b class="y">${U.money(price)}</b>${cashOnly ? '<br><small class="m">Marché noir : liquide uniquement</small>' : ''}`, choices: ch });
  },
  qty({ icon, title, text = '', max, init = 1, unit = '', info, confirm = 'Valider', onConfirm, onCancel }) {
    max = Math.floor(max); if (max < 1) return;
    let cur = U.clamp(Math.floor(init), 1, max);
    const html = `<div class="qty">
      <div class="qty-row"><button type="button" class="qb" data-d="-1">−</button><input id="q-num" type="number" inputmode="numeric" min="1" max="${max}" value="${cur}"><button type="button" class="qb" data-d="1">+</button></div>
      <div class="qty-unit">${unit} · max ${U.num(max)}</div>
      <input id="q-rng" type="range" min="1" max="${max}" value="${cur}">
      <div class="qty-pre"><button type="button" data-p="0.1">10 %</button><button type="button" data-p="0.25">25 %</button><button type="button" data-p="0.5">50 %</button><button type="button" data-p="1">MAX</button></div>
      <div id="q-info" class="qty-info"></div></div>`;
    this.modal({ icon, title, text, html, choices: [{ label: confirm, cls: 'primary', fn: () => onConfirm(cur) }, { label: 'Annuler', cls: 'ghost', fn: onCancel }],
      onShow: (root) => {
        const num = root.querySelector('#q-num'), rng = root.querySelector('#q-rng'), inf = root.querySelector('#q-info');
        const upd = () => { inf.innerHTML = info ? info(cur) : ''; };
        const set = (v) => { cur = U.clamp(Math.round(+v || 1), 1, max); num.value = cur; rng.value = cur; upd(); };
        num.addEventListener('input', () => { const v = +num.value; if (v >= 1) { cur = U.clamp(Math.round(v), 1, max); rng.value = cur; upd(); } });
        num.addEventListener('change', () => set(num.value));
        rng.addEventListener('input', () => set(rng.value));
        root.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => set(Math.max(1, Math.floor(max * +b.dataset.p)))));
        root.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => set(cur + +b.dataset.d)));
        set(cur);
      } });
  },
  gameOver() {
    this.queue = []; this.cur = null; this.stack = []; this.tab = null;
    const d = S.death || { cause: 'Inconnue' };
    this.showModal({ force: true, icon: '⚰️', title: 'Fin de partie', cls: 'bad',
      text: `La vie de <b>${U.esc(S.name)}</b> s'arrête à <b>${U.age(S.ageMonths)}</b>.<br>Cause : ${d.cause}.`,
      html: `<div class="sumgrid">
        <div>Grade<b>${RANKS[S.rank].icon} ${RANKS[S.rank].name}</b></div>
        <div>Fortune max.<b>${U.money(S.stats.maxWorth)}</b></div>
        <div>Gains criminels<b>${U.money(S.earned)}</b></div>
        <div>Territoires<b>${S.territories}</b></div>
        <div>Arrestations<b>${S.stats.arrests}</b></div>
        <div>Temps en prison<b>${U.dur(S.stats.jailMonths)}</b></div>
        <div>Victimes<b>${S.stats.kills}</b></div>
        <div>Overdoses<b>${S.stats.ods}</b></div></div>`,
      choices: [{ label: '🔄 Nouvelle vie', cls: 'primary', fn: () => Game.newLifeScreen() }] });
  },
  /* ----- Panneau ----- */
  open(view, arg) { this.stack.push({ view, arg }); this.renderPanel(); $('#p-body').scrollTop = 0; },
  back() { this.stack.pop(); if (!this.stack.length) this.tab = null; this.renderPanel(); this.renderNav(); },
  closePanel() { this.stack = []; this.tab = null; this.renderPanel(); this.renderNav(); },
  openTab(tab) {
    if (!S || !S.alive) return;
    if (this.tab === tab && this.stack.length) return this.closePanel();
    this.tab = tab; this.stack = [{ view: tab }];
    this.renderPanel(); this.renderNav(); $('#p-body').scrollTop = 0;
  },
  render() {
    if (!S) { $('#hud').innerHTML = ''; $('#log').innerHTML = ''; this.renderPanel(); this.renderNav(); return; }
    this.renderHud(); this.renderLog(); this.renderPanel(); this.renderNav();
  },
  renderNav() {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === this.tab && this.stack.length > 0));
    $('#age-btn').disabled = !S || !S.alive || !!this.cur;
    // mode détention : thème, libellé du bouton central, onglet trafic verrouillé
    const jail = !!(S && S.alive && S.jail), ab = $('#age-btn'), lbl = jail ? 'Purger' : 'Vieillir';
    document.body.classList.toggle('jail', jail);
    if (ab.dataset.l !== lbl) { ab.innerHTML = `<small>${lbl}</small><b>+1 mois</b>`; ab.dataset.l = lbl; }
    $('.tab[data-tab="trafic"] .ti').textContent = jail ? '🔒' : '💊';
  },
  bar(icon, label, v, cls, txt) { return `<div class="bar ${cls}"><div class="bl"><span>${icon} <span class="t">${label}</span></span><b>${txt || Math.round(v) + '%'}</b></div><div class="bt"><div class="bf" style="width:${U.clamp(v, 0, 100)}%"></div></div></div>`; },
  renderHud() {
    CB.h = [];
    const r = RANKS[S.rank], c = CITIES[S.city];
    $('#hud').innerHTML = `
      <div class="hud-top">
        <button class="avatar" aria-label="Profil & Style" data-cb="${cb(() => Profile.open(), 'h')}">${S.avatar}</button>
        <div class="who"><div class="name">${U.esc(S.name)}</div><div class="sub">${r.icon} ${r.name} · ${U.age(S.ageMonths)}</div></div>
        <div class="loc">${c.flag} ${c.name}<small>${c.country}</small></div>
        <button class="gear" aria-label="Paramètres" data-cb="${cb(() => { this.tab = null; this.stack = [{ view: 'settings' }]; }, 'h')}">⚙️</button>
      </div>
      <div class="hud-money">
        <div class="chip cash"><small>💵 Liquide (sale)</small><b>${U.money(S.cash)}</b></div>
        <div class="chip bank"><small>🏦 Banque (blanchi)</small><b>${U.money(S.bank)}</b></div>
      </div>
      <div class="bars">
        ${this.bar('❤️', 'Santé', S.health, 'hp')}
        ${this.bar('💪', 'Force', S.force, 'fo')}
        ${this.bar('👑', 'Respect', PlayerData.respect(), 'rs')}
        ${this.bar('💉', 'Addiction', S.addiction, 'ad')}
        ${this.bar('🚨', 'Police', S.heat, 'ht')}
        ${this.bar('⚡', 'Énergie', S.ap / PlayerData.apMax() * 100, 'en', `${S.ap}/${PlayerData.apMax()}`)}
      </div>
      ${S.jail ? `<div class="jailband">⛓️ DÉTENTION — encore ${U.dur(S.jail)}${S.prison && S.prison.protection > 0 ? ' · 🛡️ sous protection' : ''}</div>` : ''}`;
  },
  renderLog() {
    const el = $('#log');
    if (this._seq === S.logSeq && el.childElementCount) return;
    let h = '', last = -1;
    for (const e of S.log) {
      if (e.m !== last) { h += `<div class="log-age">📅 ${U.age(e.m)}</div>`; last = e.m; }
      h += `<div class="log-e ${e.c || ''}"><span class="le-i">${e.e}</span><span>${e.t}</span></div>`;
    }
    el.innerHTML = h || '<div class="empty-log">Ta vie commence…</div>';
    el.scrollTop = el.scrollHeight;
    this._seq = S.logSeq;
  },
  renderPanel() {
    const p = $('#panel');
    if (!this.stack.length || !S) { p.classList.remove('open'); return; }
    const top = this.stack[this.stack.length - 1];
    CB.p = [];
    const r = V[top.view](top.arg);
    $('#p-title').textContent = r.title;
    $('#p-back').classList.toggle('hide', this.stack.length < 2);
    $('#p-body').innerHTML = r.html;
    p.classList.add('open');
  },
};

/* =============================== VUES =============================== */
const V = {
  /* ---------- Onglet 1 : Activités ---------- */
  activities() {
    if (S.jail) return V.prison();
    const n = Inventory.list().length;
    let h = H.sec('Crimes');
    h += H.row({ icon: '🥷', title: 'Voler', sub: 'Vol à l\'arraché, cambriolages, braquages', fn: () => UI.open('steal') });
    h += H.row({ icon: '👊', title: 'Agression', sub: 'Combats au tour par tour : racket, caïds, balances', fn: () => UI.open('assault') });

  stock() {
    const list = Inventory.list(), b = Inventory.bulk(), cap = PlayerData.capacity();
    let h = H.card(`${PlayerData.home().icon} Planque : <b>${U.num(b)} / ${U.num(cap)}</b> ${b > cap ? '<b class="r">— DÉBORDE !</b>' : ''}${H.mini(b, cap)}<small class="m">Agrandis ta planque via l'immobilier (onglet Patrimoine).</small>`);

  wholesale() {

      for (const d in DRUGS) {

        h += H.row({ icon: D.icon, title: D.name, sub: `${MarketData.brand(c, d)} · ${U.q(S.market.qual[c][d])} ${MarketData.trendIcon(c, d)}`, right: `${U.unitPrice(MarketData.buyUnit(c, d))}<br><small class="m">/${D.unit}</small>`, fn: () => Actions.buy(d) });
      }
    }
    return { title: '🛒 Acheter en gros', html: h };

  retail() {
    const list = Inventory.list();
    let h = H.note(`Vente directe dans la rue à ${CITIES[S.city].name}. Le nombre de clients par mois dépend de ton respect et de tes territoires. Plus tu vends, plus le risque d'interpellation grimpe.`);

      const D = DRUGS[d], q = Inventory.q(d);
      h += H.row({ icon: D.icon, title: D.name, sub: `Stock ${U.num(Inventory.qty(d))} ${U.u(D, U.num(Inventory.qty(d)))} · ${U.q(q)} ${MarketData.trendIcon(S.city, d)}`, right: `${U.unitPrice(MarketData.sellUnit(S.city, d, q))}<br><small class="m">/${D.unit}</small>`, fn: () => Actions.sellBulk(d) });

  compare() {

      const C = CITIES[c];
      h += H.row({ icon: C.flag, title: `${C.name}${c === S.city ? ' (ici)' : ''} ${MarketData.trendIcon(c, d)}`, cls: c === S.city ? 'hl' : '',

      if (c === S.city) continue;

    return { title: '🚢 Origine', html: h };

      const D = DRUGS[d], there = MarketData.buyUnit(c, d), here = MarketData.sellUnit(S.city, d, S.market.qual[c][d]);

    }
    return { title: `${CITIES[c].flag} ${CITIES[c].name}`, html: h };

    for (const t in LABS) {
      const L = LABS[t], lock = S.rank < L.rank;
      h += H.row({ icon: L.icon, title: L.name, sub: `${lock ? `🔒 ${RANKS[L.rank].name} · ` : ''}${U.num(L.out)} ${U.u(DRUGS[L.drug], U.num(L.out))}/mois ${U.de(DRUGS[L.drug].name)} (Q${L.q[0]}–${L.q[1]}) · frais ${U.money(L.upkeep)}/mois${L.input ? ` · nécessite ${L.input.qty} g de cocaïne/mois` : ''}${L.boom ? ' · 💥 explosif' : ''}`,
        right: U.money(L.price), dis: lock, fn: () => Actions.buyLab(t) });
    }
    return { title: '🧪 Laboratoires', html: h };
  },

  /* ---------- Onglet 3 : Mafia & Business ---------- */
  mafia() {
    const r = RANKS[S.rank], cap = S.businesses.reduce((a, b) => a + BUSINESSES[b.type].cap, 0);
    let h = H.card(`<div class="big">${r.icon} ${r.name}</div>${H.kv([['👥 Équipe', `${S.crew.length} / ${r.crew}`], ['🏴 Territoires', S.territories], ['🧼 Blanchiment', `${U.money(cap)}/mois`], ['💸 Dettes', U.money(PlayerData.debt())]])}`, 'accent');
    h += H.sec('Organisation');
    h += H.row({ icon: '🎖️', title: 'Hiérarchie', sub: RANKS[S.rank + 1] ? `Prochain grade : ${RANKS[S.rank + 1].icon} ${RANKS[S.rank + 1].name}` : 'Sommet atteint', fn: () => UI.open('hierarchy') });
    h += H.row({ icon: '🧑‍🤝‍🧑', title: 'Mon équipe', sub: S.crew.length ? `${PlayerData.dealers().length} dealeur(s), ${PlayerData.soldiers().length} soldat(s)` : 'Personne pour l\'instant', fn: () => UI.open('crew') });
    h += H.row({ icon: '➕', title: 'Recruter des sous-fifres', sub: r.crew ? `${S.candidates.length} profil(s) disponible(s)` : '🔒 Grade Dealeur requis', fn: () => UI.open('recruit') });
    h += H.row({ icon: '⚔️', title: 'Guerre de territoire', sub: S.rank < 2 ? '🔒 Grade Lieutenant requis' : `${S.rivals.length} gang(s) rival(aux)`, fn: () => UI.open('war') });
    h += H.sec('Business & finances');
    h += H.row({ icon: '🏢', title: 'Clubs & Entreprises', sub: `${S.businesses.length} commerce(s) · façades légales`, fn: () => UI.open('biz') });
    h += H.row({ icon: '🧼', title: 'Blanchiment', sub: `Objectif : ${S.launderTarget == null ? 'max' : U.money(S.launderTarget)}/mois · capacité ${U.money(cap)}`, fn: () => UI.open('launder') });
    h += H.row({ icon: '🏦', title: 'Banque & Usurier', sub: 'Retraits, dépôts, prêts, dettes', fn: () => UI.open('finance') });
    return { title: '🕴️ Mafia & Business', html: h };
  },
  hierarchy() {
    let h = '';
    RANKS.forEach((rk, i) => {
      const st = i < S.rank ? '✅' : i === S.rank ? '📍' : '🔒';
      h += H.row({ icon: rk.icon, title: `${st} ${rk.name}`, cls: i === S.rank ? 'hl' : '', sub: `${i ? `Respect ${rk.respect} · gains ${U.money(rk.earned)}${rk.terr ? ` · ${rk.terr} territoire(s)` : ''}<br>` : ''}${rk.perks.join(' · ')}` });
    });
    const nx = S.rank + 1;
    if (RANKS[nx]) {
      const req = Actions.reqs(nx), ok = req.every((x) => x.ok);
      h += H.sec(`Pour devenir ${RANKS[nx].name}`);
      h += H.card(req.map((x) => `${x.ok ? '✅' : '❌'} ${x.label}`).join('<br>') + `<br><small class="m">Tes gains criminels : ${U.money(S.earned)} · Respect : ${PlayerData.respect()}</small>`);
      h += H.row({ icon: '🎖️', title: 'Demander une promotion', sub: ok ? 'Toutes les conditions sont réunies !' : 'Conditions non remplies', dis: !ok, cls: ok ? 'hl' : '', fn: () => Actions.promote() });
    }
    return { title: '🎖️ Hiérarchie', html: h };
  },
  crew() {
    let h = H.note(`Les dealeurs écoulent ton stock chaque mois (ils gardent 35 %). Les soldats te protègent et combattent (${U.money(SOLDIER_PAY)}/mois).`);
    if (!S.crew.length) h += H.note('Aucun membre. Recrute des sous-fifres !');
    for (const m of S.crew) {
      const job = m.role === 'soldier' ? '🛡️ Soldat' : m.drug ? `${DRUGS[m.drug].icon} ${DRUGS[m.drug].name}` : '💤 Sans affectation';
      h += H.row({ icon: TRAITS[m.trait].icon, title: m.name, sub: `${job} · talent ${Math.round(m.skill)} · loyauté <span class="${m.loyalty < 35 ? 'r' : m.loyalty < 60 ? 'y' : 'g'}">${Math.round(m.loyalty)}</span>`, fn: () => UI.open('member', m.id) });
    }
    return { title: '🧑‍🤝‍🧑 Mon équipe', html: h };
  },
  member(id) {
    const m = Crew.get(id); if (!m) return V.crew();
    const T = TRAITS[m.trait];
    let h = H.card(`<div class="big">${T.icon} ${m.name}</div><small class="m">${T.name} — ${T.desc} · depuis ${U.dur(m.months)}</small>
      ${H.kv([['Talent', Math.round(m.skill)], ['Loyauté', Math.round(m.loyalty)]])}`);
    h += H.sec('Affectation');
    h += H.row({ icon: m.role === 'soldier' ? '🛡️' : '💊', title: m.role === 'soldier' ? 'Soldat (protection)' : m.drug ? `Vend : ${DRUGS[m.drug].name}` : 'Sans affectation', sub: 'Changer d\'affectation', fn: () => UI.open('assign', id) });
    h += H.sec('Gestion');
    h += H.row({ icon: '🤝', title: 'Féliciter (prime)', sub: `+15 loyauté · ${U.money(500 + S.rank * 1000)}`, fn: () => Crew.praise(id) });
    h += H.row({ icon: '👊', title: 'Sanctionner', sub: 'Recadrage physique : loyauté par la peur (risque de départ)', fn: () => Crew.punish(id) });
    h += H.row({ icon: '🚪', title: 'Virer', sub: 'Risque qu\'il ou elle parle à la police', fn: () => Crew.fire(id) });
    h += H.row({ icon: '☠️', title: 'Éliminer', sub: '+5 respect · +20 police · terrorise l\'équipe', fn: () => Crew.kill(id) });
    return { title: m.name, html: h };
  },
  assign(id) {
    const m = Crew.get(id); if (!m) return V.crew();
    let h = H.row({ icon: '🛡️', title: 'Soldat', sub: `Protection, guerres de territoire · ${U.money(SOLDIER_PAY)}/mois`, cls: m.role === 'soldier' ? 'hl' : '', fn: () => Crew.assign(id, 'soldier') });
    h += H.sec('Dealeur — produit à écouler');
    for (const d in DRUGS) {
      const D = DRUGS[d];
      h += H.row({ icon: D.icon, title: D.name, sub: `En stock : ${U.num(Inventory.qty(d))} ${U.u(D, U.num(Inventory.qty(d)))}`, cls: m.role === 'dealer' && m.drug === d ? 'hl' : '', fn: () => Crew.assign(id, 'dealer', d) });
    }
    return { title: 'Affectation', html: h };
  },
  recruit() {
    const max = Crew.max();
    if (!max) return { title: '➕ Recrutement', html: H.card('🔒 Grade <b>Dealeur</b> requis pour avoir des sous-fifres.', 'accent') };
    let h = H.note(`Équipe : ${S.crew.length} / ${max}. Coût d'embauche payé en liquide. Nouveaux profils tous les 2 mois.`);
    for (const c of S.candidates) {
      const T = TRAITS[c.trait];
      h += H.row({ icon: T.icon, title: c.name, sub: `${T.name} (${T.desc}) · talent ${c.skill} · loyauté ${c.loyalty}`, right: U.money(c.cost), dis: S.crew.length >= max || S.cash < c.cost, fn: () => Crew.recruit(c.id) });
    }
    h += H.row({ icon: '🔄', title: 'Faire tourner le mot', sub: 'Trouver d\'autres profils', right: '200 €', fn: () => Crew.refresh() });
    return { title: '➕ Recrutement', html: h };
  },
  war() {
    if (S.rank < 2) return { title: '⚔️ Guerre', html: H.card('🔒 Grade <b>Lieutenant</b> requis pour lancer une guerre de territoire.', 'accent') };
    let h = H.card(`⚔️ Ta puissance de feu : <b>~${PlayerData.warPower()}</b><br><small class="m">Armes, gilet, soldats (talent), dealeurs, respect. Chaque territoire rapporte un racket mensuel et augmente la demande de ton réseau.</small>`, 'accent');
    if (!S.rivals.length) h += H.note('Plus aucun gang rival. Tu règnes sans partage… pour l\'instant.');
    for (const r of S.rivals) h += H.row({ icon: '🏴', title: r.name, sub: `Puissance ~${Math.round(r.strength)} · ${r.terr} territoire(s) · 2 ⚡`, right: U.pct(Actions.warChance(r)), fn: () => Actions.attack(r.id) });
    return { title: '⚔️ Guerre de territoire', html: h };
  },
  biz() {
    let h = '';
    if (S.businesses.length) {
      h += H.sec('Mes commerces');
      for (const b of S.businesses) { const B = BUSINESSES[b.type]; h += H.row({ icon: B.icon, title: B.name, sub: `Blanchit ${U.money(B.cap)}/mois · +${U.money(B.income)}/mois légal`, right: '<span class="g">✔</span>', cls: 'owned', fn: () => Actions.sellBusiness(b.id) }); }
    }
    h += H.sec('Racheter une façade');
    h += H.note('Chaque commerce blanchit un montant d\'argent sale par mois (commission 15 %) et verse un petit bénéfice légal en banque.');
    for (const t in BUSINESSES) { const B = BUSINESSES[t]; h += H.row({ icon: B.icon, title: B.name, sub: `Blanchit ${U.money(B.cap)}/mois · +${U.money(B.income)}/mois${B.respect ? ` · +${B.respect} 👑` : ''}`, right: U.money(B.price), fn: () => Actions.buyBusiness(t) }); }
    return { title: '🏢 Clubs & Entreprises', html: h };
  },
  launder() {
    const cap = S.businesses.reduce((a, b) => a + BUSINESSES[b.type].cap, 0);
    let h = H.card(`🧼 Capacité totale : <b>${U.money(cap)}/mois</b><br>Objectif actuel : <b>${S.launderTarget == null ? 'maximum' : U.money(S.launderTarget)}</b><br><small class="m">Chaque mois, ce montant est prélevé sur ton liquide et crédité en banque (−15 % de commission). L'argent en banque est à l'abri des descentes et sert à acheter l'immobilier et le luxe sans éveiller les soupçons.</small>`, 'accent');
    if (!cap) return { title: '🧼 Blanchiment', html: h + H.note('Aucun commerce : rachète une façade dans « Clubs & Entreprises ».') };
    h += H.sec('Objectif mensuel');
    [[null, 'Maximum'], [0, 'Suspendre'], [Math.round(cap * 0.25), '25 %'], [Math.round(cap * 0.5), '50 %'], [Math.round(cap * 0.75), '75 %']].forEach(([v, l]) => {
      h += H.row({ icon: v === 0 ? '⏸️' : '🧼', title: l, sub: v == null ? U.money(cap) + '/mois' : U.money(v) + '/mois', cls: S.launderTarget === v ? 'hl' : '', fn: () => Actions.setLaunder(v) });
    });
    h += H.row({ icon: '✏️', title: 'Montant personnalisé', fn: () => UI.qty({ icon: '🧼', title: 'Objectif de blanchiment', max: cap, init: S.launderTarget || cap, unit: '€/mois', confirm: 'Valider', onConfirm: (n) => Actions.setLaunder(n) }) });
    return { title: '🧼 Blanchiment', html: h };
  },
  finance() {
    let h = H.card(H.kv([['💵 Liquide', U.money(S.cash)], ['🏦 Banque', U.money(S.bank)], ['💸 Dettes', U.money(PlayerData.debt())], ['📈 Valeur nette', U.money(PlayerData.netWorth())]]));
    h += H.sec('Banque');
    h += H.row({ icon: '🏧', title: 'Retirer du liquide', sub: 'Banque → liquide', fn: () => Actions.withdraw() });
    h += H.row({ icon: '🏦', title: 'Dépôt discret', sub: `Liquide → banque, max 1 500 €/mois (reste ${U.money(Math.max(0, 1500 - S.deposit))})`, fn: () => Actions.deposit() });
    if (S.debts.length) {
      h += H.sec('Mes dettes');
      for (const d of S.debts) {
        const left = d.due - S.ageMonths;
        h += H.row({ icon: '💸', title: d.lender, sub: `${d.rate ? Math.round(d.rate * 100) + ' %/mois · ' : ''}${left >= 0 ? `échéance dans ${left} mois` : `<span class="r">EN RETARD (${d.overdue} mois)</span>`}`, right: `<span class="r">${U.money(d.amount)}</span>`, fn: () => Actions.repay(d.id) });
      }
    }
    h += H.sec('Usuriers & prêteurs');
    for (const L of LOANS) {
      const has = S.debts.some((d) => d.lender === L.lender), lock = PlayerData.respect() < L.respect;
      h += H.row({ icon: '🤝', title: L.lender, sub: `${Math.round(L.rate * 100)} %/mois · ${L.months} mois${lock ? ` · 🔒 respect ${L.respect}` : ''}${has ? ' · déjà endetté' : ''}`, right: U.money(L.amount), dis: lock || has, fn: () => Actions.borrow(L.id) });
    }
    return { title: '🏦 Banque & Usurier', html: h };
  },

  /* ---------- Onglet 4 : Achats & Patrimoine ---------- */
  assets() {
    let h = H.card(`${H.kv([['📈 Valeur nette', U.money(PlayerData.netWorth())], ['👑 Respect (biens)', `+${PlayerData.possessionRespect()}`], ['📦 Planque', U.num(PlayerData.capacity())], ['🛡️ Sécurité', PlayerData.security()], ['💥 Puissance de feu', PlayerData.firepower()], ['🦺 Protection', PlayerData.armor()]])}<small class="m">Logement : ${PlayerData.home().icon} ${PlayerData.home().name}</small>`, 'accent');
    h += H.sec('Boutiques');
    for (const cat in SHOP) {
      const C = SHOP[cat], own = S.owned[cat].length;
      h += H.row({ icon: C.icon, title: C.label, sub: own ? `${own} possédé(s)` : 'Rien pour l\'instant', fn: () => UI.open('shop', cat) });
    }
    h += H.sec('Ma vie');
    h += H.row({ icon: '🪞', title: 'Profil & Style', sub: `${Profile.tier(PlayerData.possessionRespect())} · tenue portée, accessoires, statut social`, fn: () => Profile.open() });
    h += H.row({ icon: '📊', title: 'Statistiques', sub: 'Bilan de ta carrière criminelle', fn: () => UI.open('stats') });
    h += H.row({ icon: '⚙️', title: 'Paramètres', sub: 'Sauvegarde, nouvelle vie', fn: () => UI.open('settings') });
    return { title: '💎 Achats & Patrimoine', html: h };
  },
  shop(cat) {
    const C = SHOP[cat];
    let h = '';
    if (cat === 'clothes' || cat === 'jewelry') {
      const b = PlayerData.styleBreakdown();
      h += H.note(`Un objet porté par emplacement. Seule la tenue portée compte : tenue +${b.tenue}, accessoires +${b.acc} (bonus total plafonné à +40). Touche un objet possédé pour le porter ou le revendre.`);
      h += H.row({ icon: '🪞', title: 'Profil & Style', sub: `${Profile.tier(b.total)} · bonus de respect +${b.total}`, cls: 'hl', fn: () => Profile.open() });
      for (const sl in SLOTS) {
        if (SLOTS[sl].cat !== cat) continue;
        h += H.sec(`${SLOTS[sl].icon} ${SLOTS[sl].label}`);
        for (const it of C.items.filter((i) => i.slot === sl)) {
          const own = S.owned[cat].includes(it.id), eq = Shop.isEquipped(it);
          h += H.row({ icon: it.icon, title: it.name, sub: `+${it.respect} respect${own ? ` · revente ${U.money(it.price * RESALE[cat])}` : ''}`,
            right: own ? (eq ? '<span class="g">✔ Porté</span>' : '<span class="m">Possédé</span>') : U.money(it.price), cls: own ? 'owned' : '',
            fn: () => (own ? Shop.ownedMenu(cat, it) : Shop.buy(cat, it)) });
        }
      }
      return { title: `${C.icon} ${C.label}`, html: h };
    }
    if (cat === 'properties') h += H.note(`Ta planque de base : chambre chez ta mère (50). Capacité actuelle : <b>${U.num(PlayerData.capacity())}</b> · sécurité <b>${PlayerData.security()}</b>. La sécurité réduit les descentes et les cambriolages.`);
    else if (cat === 'weapons') h += H.note(`Marché noir, liquide uniquement. Puissance de feu : <b>${PlayerData.firepower()}</b> · protection : <b>${PlayerData.armor()}</b>. En combat, ta meilleure arme est utilisée (dégâts, précision) et le gilet réduit les dégâts des balles. Les armes alourdissent les peines.`);
    else if (cat === 'vehicles') h += H.note('La vitesse aide à fuir (go fast, contrôles), la discrétion à passer inaperçu. Seul ton meilleur véhicule compte pour le respect. Entretien mensuel : 0,4 % du prix.');
    for (const it of C.items) {
      const own = S.owned[cat].includes(it.id);
      h += H.row({ icon: it.icon, title: it.name, sub: Shop.statLine(cat, it) + (own ? ` · revente ${U.money(it.price * RESALE[cat])}` : ''), right: own ? '<span class="g">✔ Possédé</span>' : U.money(it.price), cls: own ? 'owned' : '',
        fn: () => (own ? Shop.sell(cat, it) : Shop.buy(cat, it)) });
    }
    return { title: `${C.icon} ${C.label}`, html: h };
  },
  stats() {
    const s = S.stats;
    const h = H.card(H.kv([
      ['Âge', U.age(S.ageMonths)], ['Grade', `${RANKS[S.rank].icon} ${RANKS[S.rank].name}`],
      ['Valeur nette', U.money(PlayerData.netWorth())], ['Fortune max.', U.money(s.maxWorth)],
      ['Gains criminels', U.money(S.earned)], ['Ventes de drogue', U.money(s.sold)],
      ['Achats de drogue', U.money(s.bought)], ['Crimes commis', s.crimes],
      ['Arrestations', s.arrests], ['Temps en prison', U.dur(s.jailMonths)],
      ['Casier', `${S.record} condamnation(s)`], ['Victimes', s.kills],
      ['Guerres menées', s.wars], ['Territoires', S.territories],
      ['Doses consommées', s.doses], ['Overdoses', s.ods],
      ['Force', `${Math.round(S.force)} %`], ['Combats gagnés', `${s.fightsWon} / ${s.fights}`],
    ]));
    return { title: '📊 Statistiques', html: h };
  },
  settings() {
    let h = H.card('💾 La partie est <b>sauvegardée automatiquement</b> dans ton navigateur (localStorage) après chaque action et chaque mois.');
    h += H.row({ icon: '🔄', title: 'Nouvelle vie', sub: 'Efface la partie en cours et recommence à 18 ans', cls: 'hl', fn: () => UI.confirm('⚠️', 'Nouvelle vie ?', 'Ta partie actuelle sera définitivement effacée.', '🔄 Recommencer', () => { Game.wipe(); Game.newLifeScreen(); }, 'danger') });
    h += H.note('Crime Life est une œuvre de fiction. Aucune incitation à la consommation de drogues ni à la commission de crimes. Besoin d\'aide face à une addiction ? En France : Drogues Info Service, 0 800 23 13 13 (gratuit, anonyme).');
    return { title: '⚙️ Paramètres', html: h };
  },
};

/* ================================ GAME ================================ */
const Game = {
  rival(strength, terr) { return { id: U.uid(), name: U.pick(RIVAL_NAMES), strength, terr }; },
  genRivals() {
    const names = U.shuffle(RIVAL_NAMES).slice(0, 5);
    return [[50, 1], [85, 2], [130, 3], [200, 4], [320, 6]].map(([s, t], i) => ({ id: U.uid(), name: names[i], strength: s, terr: t }));
  },
  create(name, avatar, city) {
    S = PlayerData.blank(name, avatar, city);
    S.market = MarketData.init();
    S.rivals = this.genRivals();
    S.candidates = Crew.genList(3);
    S.gofasts = GoFast.gen();
    S.owned.clothes = ['zara_tee', 'zara_jog', 'zara_shoes'];
    S.equip = { haut: 'zara_tee', bas: 'zara_jog', chaussures: 'zara_shoes' };
    log('👶', CITIES[city].intro, 'info');
    log('🎂', `Tu as <b>18 ans</b>. Poche : ${U.money(S.cash)}. La rue t'appelle.`, 'info');
    log('💡', 'Astuce : achète un peu de marchandise en gros (onglet Trafic), revends-la au détail, et appuie sur <b>+1 mois</b> pour avancer. Touche ton avatar pour voir ton profil et ta garde-robe.', '');
    UI.stack = []; UI.tab = null; UI._seq = -1;
    this.commit();
  },
  newLifeScreen() {
    const reg = NAMES.fr;
    let name = `${U.pick(reg.first)} ${U.pick(reg.last)}`, avatar = U.pick(AVATARS), city = 'marseille';
    UI.queue = []; UI.cur = null;
    const html = `<div class="form">
      <label>Nom</label><input type="text" id="ng-name" maxlength="28" value="${U.esc(name)}">
      <label>Apparence</label><div class="picks" id="ng-av">${AVATARS.map((a) => `<button type="button" class="pick av ${a === avatar ? 'sel' : ''}" data-v="${a}">${a}</button>`).join('')}</div>
      <label>Ville de départ</label><div class="picks" id="ng-city">${Object.keys(CITIES).map((c) => `<button type="button" class="pick ${c === city ? 'sel' : ''}" data-v="${c}">${CITIES[c].flag} ${CITIES[c].name}</button>`).join('')}</div>
      <div class="disclaimer">Œuvre de fiction. Aucune incitation à la consommation ni au crime.</div></div>`;
    UI.showModal({ force: true, title: '<span class="logo">CRIME LIFE</span>', text: 'De guetteur à parrain. Chaque mois compte. Chaque choix se paie.', html,
      choices: [{ label: '▶ Commencer ma vie', cls: 'primary', fn: () => this.create((name || '').trim() || 'Anonyme', avatar, city) }],
      onShow: (root) => {
        root.querySelector('#ng-name').addEventListener('input', (e) => { name = e.target.value.slice(0, 28); });
        const group = (sel, set) => root.querySelectorAll(`${sel} .pick`).forEach((b) => b.addEventListener('click', () => {
          root.querySelectorAll(`${sel} .pick`).forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); set(b.dataset.v);
        }));
        group('#ng-av', (v) => { avatar = v; });
        group('#ng-city', (v) => { city = v; });
      } });
    UI.render();
  },
  ageUp() {
    if (!S || !S.alive || UI.cur) return;
    UI.closePanel();
    S.ageMonths++;
    if (S.ageMonths % 12 === 0) log('🎂', `Joyeux anniversaire ! Tu as maintenant <b>${S.ageMonths / 12} ans</b>.`, 'info');
    const consumed = Object.keys(S.used).length > 0;
    S.used = {}; S.deposit = 0;
    S.buffs = S.buffs.filter((b) => --b.months > 0);
    const steps = [Monthly.jail, () => Monthly.addiction(consumed), Monthly.health, Monthly.fitness, Monthly.income, () => Monthly.crew(), Monthly.labs,
      Monthly.business, Monthly.upkeep, Monthly.imports, Monthly.debts, Monthly.heat, Monthly.refresh];
    for (const st of steps) { st.call(Monthly); if (!S.alive) break; }
    S.ap = PlayerData.apMax();
    if (S.alive) Events.monthly();
    if (S.alive) Monthly.naturalDeath();
    S.stats.maxWorth = Math.max(S.stats.maxWorth, PlayerData.netWorth());
    this.commit();
  },
  die(cause) {
    if (!S || !S.alive) return;
    log('⚰️', `<b>Fin de partie à ${U.age(S.ageMonths)}.</b> Cause du décès : ${cause}.`, 'death');
    S.alive = false; S.death = { cause, m: S.ageMonths };
    S.stats.maxWorth = Math.max(S.stats.maxWorth, PlayerData.netWorth());
    this.save();
    UI.gameOver();
  },
  save() { try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ } },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || !data.name) return false;
      S = data; this.migrate(); return true;
    } catch (e) { return false; }
  },
  migrate() {
    const b = PlayerData.blank(S.name, S.avatar, S.city);
    for (const k in b) if (!(k in S)) S[k] = b[k];
    for (const k in b.owned) if (!S.owned[k]) S.owned[k] = [];
    for (const k in b.stats) if (!(k in S.stats)) S.stats[k] = 0;
    if (!S.market) S.market = MarketData.init();
    if (!S.rivals || !S.rivals.length) S.rivals = this.genRivals();
    if (!CITIES[S.city]) S.city = 'marseille';
    // v1 → v2 : tenues complètes remplacées par des pièces portées par emplacement
    if ((S.v || 1) < 2) {
      const clothes = [];
      for (const id of S.owned.clothes) {
        for (const nid of OLD_CLOTHES[id] || [id]) {
          if (SHOP.clothes.items.some((i) => i.id === nid)) { if (!clothes.includes(nid)) clothes.push(nid); }
          else if (SHOP.jewelry.items.some((i) => i.id === nid) && !S.owned.jewelry.includes(nid)) S.owned.jewelry.push(nid);
        }
      }
      S.owned.clothes = clothes; S.v = 2;
    }
    for (const sl in SLOTS) if (!PlayerData.equipped(sl)) { const best = Shop.bestFor(sl); if (best) S.equip[sl] = best.id; }
    for (const c in CITIES) for (const d in DRUGS) if (S.market.trend[c][d] == null) { S.market.trend[c][d] = 1; S.market.qual[c][d] = MarketData.rollQ(c, d); S.market.brand[c][d] = 0; }
    if (S.jail && !S.prison) Prison.enter();
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } S = null; UI.stack = []; UI.tab = null; UI.render(); },
  commit() { this.save(); UI.render(); },
};
const SAVE_KEY = 'crimelife_save_v1';

/* ============================ INITIALISATION ============================ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-cb]');
  if (!el || el.disabled) return;
  const id = el.dataset.cb, fn = CB[id[0]] && CB[id[0]][+id.slice(1)];
  if (!fn) return;
  e.preventDefault();
  fn();
  if (S) Game.commit();
});
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => UI.openTab(t.dataset.tab)));
$('#age-btn').addEventListener('click', () => Game.ageUp());
$('#p-back').addEventListener('click', () => UI.back());
$('#p-close').addEventListener('click', () => UI.closePanel());

if (Game.load()) {
  UI.render();
  if (!S.alive) UI.gameOver(); else UI.toast('💾 Partie chargée');
} else Game.newLifeScreen();
</script>
</body>
