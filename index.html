  // les cigarettes se fument à l'unité (paquets de 20 entamés au besoin)
  doseLabel(d, di) {
    const D = DRUGS[d], ds = DOSES[di];
    if (D.form === 'cig') { const n = CIG_DOSES[di]; return `${n === 1 ? 'Une cigarette' : n === 3 ? 'Quelques cigarettes' : 'Un demi-paquet'} (${n})`; }
    return `${ds.label} (${ds.units} ${U.u(D, ds.units)})`;
  },
  hasDose(d, di) { return DRUGS[d].form === 'cig' ? Inventory.qty(d) * 20 + (S.cigLoose || 0) >= CIG_DOSES[di] : Inventory.qty(d) >= DOSES[di].units; },
  takeDose(d, di) {
    if (DRUGS[d].form !== 'cig') { Inventory.remove(d, DOSES[di].units); return; }
    const n = CIG_DOSES[di], packs = Math.ceil(Math.max(0, n - S.cigLoose) / 20);
    if (packs) Inventory.remove(d, packs);
    S.cigLoose = S.cigLoose + packs * 20 - n;
  },
  consume(d, di, free = false, after = null, mode = null) {
    const D = DRUGS[d], ds = DOSES[di], cig = D.form === 'cig', sn = mode === 'snort' ? SNORT : null, em = ds.mult * (sn ? sn.fx : 1);
    const done = () => { if (after && S.alive && !S.jail) after(); };
    if (!free && !this.hasDose(d, di)) { UI.toast('Pas assez de produit.'); return done(); }
    const q = free ? U.ri(40, 80) : Inventory.q(d) || 50;
    const risk = this.odRisk(d, ds.mult * (sn ? sn.od : 1), q, free ? 0 : Inventory.cut(d));
    if (!free) this.takeDose(d, di);
    const first = !S.used[d];
    S.used[d] = (S.used[d] || 0) + 1;
    S.stats.doses++;
    const addGain = D.add * ds.mult * (0.7 + q / 150) * (D.subst ? 0.4 : 1) * (sn ? sn.add : 1);
    PlayerData.mod('addiction', addGain);
    if (D.roids) S.roids = Math.min(100, (S.roids || 0) + D.roids * ds.mult);
    if (cig) S.tobacco = Math.min(3000, (S.tobacco || 0) + CIG_DOSES[di]);
    if (U.chance(risk)) { PlayerData.mod('stress', 10); this.overdose(d, ds.mult * (sn ? sn.od : 1)); if (Night.st) Night.end('Tu finis la nuit aux urgences.'); return; }
    const tol = U.clamp(1 - S.addiction / 200, 0.4, 1);
    const fx = [], E = D.fx;
    if (E.health > 0) { const h = E.health * em * tol; PlayerData.heal(h); fx.push(`+${Math.round(h)} ❤️`); }
    if (E.health < 0) {
      const h = -E.health * em;
      fx.push(`−${h < 1 ? String(Math.round(h * 10) / 10).replace('.', ',') : Math.round(h)} ❤️`);
      PlayerData.hurt(h, cig ? 'Cancer du poumon' : `Arrêt cardiaque (${D.name})`); if (!S.alive) return;
    }
    if (E.stress) { const v = Math.round(E.stress * em * (cig ? 1 : tol)); if (v) { PlayerData.mod('stress', v); fx.push(`−${-v} 😰`); } }
    if (E.force) { const f = E.force * em * (1 - S.force / 130); PlayerData.mod('force', f); fx.push(`+${f.toFixed(1).replace('.', ',')} 💪`); }
    if (E.ap && first) { S.ap += E.ap; fx.push(`+${E.ap} ⚡`); }
    if (E.crime) { const v = Math.round(E.crime * tol * (em >= 1 ? 1.3 : 1)); PlayerData.buff('crime', v, 1); fx.push(`+${v} % réussite crimes`); }
    if (E.respect && first) { PlayerData.mod('respect', E.respect); fx.push(`+${E.respect} 👑`); }
    if (sn) { PlayerData.hurt(1, 'Hémorragie nasale'); if (!S.alive) return; fx.push('−1 ❤️ (cloison nasale)'); }
    fx.push(`+${Math.round(addGain)} 💉 addiction`);
    const n = CIG_DOSES[di];
    log(D.icon, `${cig ? `Tu fumes ${n === 1 ? 'une cigarette' : n + ' cigarettes'}` : `Tu ${sn ? 'écrases et sniffes' : 'consommes'} ${ds.units} ${U.u(D, ds.units)} ${U.de(D.name)} (Q${q})`}. ${D.txt}`, 'drug');
    UI.result(D.icon, D.name, `${D.txt}<br><br><b>${fx.join(' · ')}</b>`, 'drug');
    done();
  },
  // lots coupés au fentanyl : des clients font des overdoses, la police remonte la filière
  cutFallout(d, n, c = Inventory.cut(d)) {
    if (!c || n < 1 || !S.alive) return;
    if (!U.chance(Math.min(60, n * c * 0.6))) return;
    const dead = U.chance(30), D = DRUGS[d];
    PlayerData.mod('heat', dead ? 15 : 8); PlayerData.mod('respect', -2);
    log('🚑', dead ? `Un client meurt d'une overdose après avoir consommé ton produit coupé au fentanyl (${D.name}). Les enquêteurs remontent la filière (+15 🚨, −2 👑).`
      : `Un client fait une overdose avec ton produit coupé au fentanyl (${D.name}) : il s'en sort de justesse (+8 🚨, −2 👑).`, 'bad');
    if (dead && !S.jail && U.chance(10 * Police.level())) Actions.arrest({ charge: 'Trafic de stupéfiants ayant entraîné la mort', months: 60 });
  },
  overdose(d, mult) {
    S.stats.ods++;
    const D = DRUGS[d];
    const deathP = 15 + (100 - S.health) / 3 + (mult >= 2.5 ? 15 : 0) + (S.addiction > 70 ? 10 : 0);
    if (U.chance(deathP)) return Game.die(`Overdose (${D.name})`);
    const dmg = U.ri(25, 45);
    const bill = Math.min(S.cash, 2500); S.cash -= bill;
    PlayerData.mod('heat', 5); PlayerData.mod('addiction', 4);
    log('🚑', `<b>OVERDOSE</b> ${U.de(D.name)} ! Réveil aux urgences après un massage cardiaque (−${dmg} ❤️, −${U.money(bill)}).`, 'bad');
    PlayerData.hurt(dmg, `Overdose (${D.name})`);
    if (S.alive) UI.result('🚑', 'Overdose !', `Ton cœur s'est arrêté quelques secondes. Les urgentistes t'ont ramené à la vie.<br><b>−${dmg} ❤️ · −${U.money(bill)}</b>`, 'bad');
  },

  /* ----- Santé ----- */
  rehab(id) {
    const r = REHABS.find((x) => x.id === id);
    if (S.addiction <= 0) return UI.toast('Tu n\'as aucune addiction.');
    if (!PlayerData.can(r.cost)) return UI.toast('Pas assez d\'argent.');
    if (!PlayerData.useAP(r.ap)) return;
    PlayerData.pay(r.cost);
    if (U.chance(r.success)) {
      const red = U.ri(r.red[0], r.red[1]);
      PlayerData.mod('addiction', -red); if (r.hp) PlayerData.heal(r.hp);
      log(r.icon, `${r.name} : réussite ! Addiction −${red}.`, 'good');
      UI.result(r.icon, 'Sevrage réussi', `Tu tiens bon. <b>Addiction −${red}</b>.`, 'good');
    } else {
      PlayerData.mod('addiction', -5);
      log(r.icon, `${r.name} : rechute… (addiction −5${r.failHp ? `, −${r.failHp} ❤️` : ''})`, 'bad');
      if (r.failHp) PlayerData.hurt(r.failHp, 'Sevrage brutal');
      if (S.alive) UI.result('🌀', 'Rechute', 'Le manque a été plus fort que toi. Tu as replongé.', 'bad');
    }
  },
  heal(id) {
    const h = HEALS.find((x) => x.id === id);
    if (!PlayerData.can(h.cost)) return UI.toast('Pas assez d\'argent.');
    if (!PlayerData.useAP(h.ap)) return;
    PlayerData.pay(h.cost);
    if (h.fail && U.chance(h.fail)) {
      PlayerData.hurt(5, 'Infection après des soins clandestins');
      log('🦠', `${h.name} : infection après les soins (−5 ❤️).`, 'bad');
      if (S.alive) UI.result('🦠', 'Complications', 'Le matériel n\'était pas très stérile… Infection.', 'bad');
      return;
    }
    const n = U.ri(h.hp[0], h.hp[1]);
    PlayerData.heal(n); if (h.respect) PlayerData.mod('respect', h.respect);
    let extra = '';
    if (h.report && S.wounded && U.chance(50)) { PlayerData.mod('heat', 18); extra = ' Le médecin a signalé ta blessure par balle à la police (+18 🚨).'; }
    if (h.id !== 'sport' && h.id !== 'pharma') S.wounded = false;
    log(h.icon, `${h.name} : +${n} ❤️.${extra}`, extra ? 'bad' : 'good');
    UI.toast(`${h.icon} +${n} santé`);
    if (extra) UI.result('👮', 'Signalement', extra, 'bad');
  },
  surgery(id) {
    const s = SURGERIES.find((x) => x.id === id);
    if (s.once && S.surgeries.includes(id)) return UI.toast('Déjà fait.');
    if (!PlayerData.can(s.cost)) return UI.toast('Pas assez d\'argent.');
    UI.confirm(s.icon, s.name, `Coût : <b>${U.money(s.cost)}</b> · 1 ⚡<br>Risque de complications : ${U.risk(s.fail)}`, '🔪 Passer sur le billard', () => {
      if (!PlayerData.useAP(1)) return;
      PlayerData.pay(s.cost);
      if (U.chance(s.fail)) {
        const dmg = U.ri(10, 30);
        log('🩸', `${s.name} : opération ratée ! (−${dmg} ❤️)`, 'bad');
        PlayerData.hurt(dmg, `Complications chirurgicales (${s.name})`);
        if (s.respect) PlayerData.mod('respect', -2);
        if (S.alive) UI.result('🩸', 'Opération ratée', `Le chirurgien a raté son coup. −${dmg} ❤️.`, 'bad');
        return;
      }
      if (s.once) S.surgeries.push(id);
      const fx = [];
      if (s.respect) { PlayerData.mod('respect', s.respect); fx.push(`+${s.respect} 👑`); }
      if (s.heat) { PlayerData.mod('heat', s.heat); fx.push(`${s.heat} 🚨`); }
      if (s.record) { S.record = Math.max(0, S.record - s.record); fx.push('casier « oublié »'); }
      if (s.hp) { PlayerData.hurt(s.hp, 'Complications chirurgicales'); fx.push(`−${s.hp} ❤️ (convalescence)`); }
      if (!S.alive) return;
      log(s.icon, `${s.name} : réussie. ${fx.join(', ')}.`, 'good');
      UI.result(s.icon, 'Opération réussie', fx.join(' · '), 'good');
    });
  },

  /* ----- Prison ----- */
  prison(id) {
    if (id === 'muscu') {
      if (!PlayerData.useAP(1)) return;
      const f = Gym.gain([1.5, 3]); S.trained = true;
      PlayerData.mod('force', f); PlayerData.heal(2); PlayerData.mod('respect', 1);
      log('💪', `Pompes, tractions, dips en cellule : +${f.toFixed(1).replace('.', ',')} 💪, +2 ❤️, +1 👑.`, 'jail'); UI.toast('💪 Force en hausse');
    } else if (id === 'bagarre') {
      if (!PlayerData.useAP(1)) return;
      Combat.start({ foe: 'detenu', ctx: { arms: 'prison', flee: 40, place: 'Cour de promenade', intro: 'Tu provoques le caïd du bâtiment devant tout le monde.' }, onEnd: (res) => {
        if (res === 'win') { PlayerData.mod('respect', 4); log('👊', 'Bagarre dans la cour : tu imposes ta loi. +4 👑', 'good'); UI.result('👊', 'Respect gagné', 'Tout le bâtiment a vu ce que tu vaux. +4 👑', 'good'); }
        else if (res === 'lose') { PlayerData.mod('respect', -2); log('🤕', 'Bagarre dans la cour : tu finis à l\'infirmerie (−2 👑).', 'bad'); }
        else log('🏃', 'Tu recules avant que les surveillants n\'interviennent.', 'jail');
      } });
    } else if (id === 'surin') {
      const p = Prison.ensure();
      if (p.shank) return UI.toast('🔪 Tu as déjà un surin planqué.');
      if (!PlayerData.useAP(1)) return;
      if (U.chance(80)) { p.shank = true; log('🔪', 'Tu affûtes une brosse à dents contre le béton : te voilà avec un surin artisanal.', 'jail'); UI.toast('🔪 Surin fabriqué'); }
      else { S.jail += 2; log('🚨', 'Fouille de cellule : ton surin en cours de fabrication est découvert (+2 mois).', 'bad'); UI.result('🚨', 'Fouille !', 'Arme artisanale confisquée. +2 mois.', 'bad'); }
    } else if (id === 'protection') {
      const p = Prison.ensure(), cost = 2500 * (1 + S.rank);
      if (!PlayerData.can(cost)) return UI.toast(`Il te faut ${U.money(cost)}.`);
      if (!PlayerData.useAP(1)) return;
      PlayerData.pay(cost); p.ally = U.pick(PRISON_GANGS); p.protection = Math.max(p.protection, 12); p.hunted = false;
      log('🛡️', `Les ${p.ally} te prennent sous leur aile contre ${U.money(cost)} : protection pendant 12 mois.`, 'good');
      UI.result('🛡️', 'Protection achetée', `Les ${p.ally} veillent sur toi pendant 12 mois.`, 'good');
    } else if (id === 'trafic') {
      if (!PlayerData.useAP(1)) return;
      if (U.chance(75)) { const g = U.ri(200, 1500); PlayerData.earn(g); log('📦', `Trafic en détention (téléphones, shit) : +${U.money(g)}.`, 'money'); UI.toast(`📦 +${U.money(g)}`); }
      else { const m = U.ri(2, 6); S.jail += m; log('🚨', `Fouille de cellule : ton trafic est découvert, +${m} mois de peine.`, 'bad'); UI.result('🚨', 'Fouille !', `Les surveillants ont trouvé ta marchandise. +${m} mois.`, 'bad'); }
    } else if (id === 'maton') {
      const cost = 3000 * (S.rank + 1);
      if (!PlayerData.can(cost)) return UI.toast(`Il te faut ${U.money(cost)}.`);
      if (!PlayerData.useAP(1)) return;
      PlayerData.pay(cost);
      if (U.chance(70)) { const r = Math.max(1, Math.round(S.jail * 0.25)); S.jail = Math.max(0, S.jail - r); log('💶', `Un surveillant corrompu « égare » des rapports : −${r} mois de peine.`, 'good'); UI.result('💶', 'Remise de peine', `−${U.dur(r)} de prison.`, 'good'); if (S.jail === 0) this.release(); }
      else { S.jail += 6; log('🚨', 'Tentative de corruption signalée : +6 mois.', 'bad'); UI.result('🚨', 'Balancé', 'Le surveillant était intègre. +6 mois.', 'bad'); }
    } else if (id === 'evasion') {
      if (!PlayerData.useAP(2)) return;
      const p = U.clamp(10 + PlayerData.respect() / 8 + PlayerData.soldiers().length * 2, 5, 40);
      if (U.chance(p)) {
        S.jail = 0; S.prison = null; PlayerData.mod('heat', 60); PlayerData.mod('respect', 10);
        log('🪢', '<b>ÉVASION RÉUSSIE !</b> Tu fais la une des journaux. (+60 🚨, +10 👑)', 'good');
        UI.result('🪢', 'Évasion !', 'Draps noués, complice à l\'extérieur… Tu es dehors. Toutes les polices te cherchent.', 'good');
      } else {
        S.jail += 12; const d = U.ri(5, 20);
        log('🚨', `Évasion ratée : +12 mois et un passage à tabac (−${d} ❤️).`, 'bad');
        PlayerData.hurt(d, 'Abattu lors d\'une tentative d\'évasion');
        if (S.alive) UI.result('🚨', 'Évasion ratée', '+12 mois de peine, direction le mitard.', 'bad');
      }
    }
  },
  release() { S.prison = null; log('🔓', '<b>Libération !</b> Tu retrouves l\'air libre.', 'good'); },

  /* ----- Marché ----- */
  buy(d) {
    if (S.jail) return;
    const D = DRUGS[d], c = S.city, q = S.market.qual[c][d];
    const room = Math.floor((PlayerData.capacity() - Inventory.bulk()) / D.bulk);
    if (room < 1) return UI.toast('📦 Planque pleine ! Achète un logement plus grand (Patrimoine).');
    const max = U.maxQty((n) => MarketData.buyCost(c, d, n), S.cash, room);
    if (max < 1) return UI.toast('💵 Pas assez de liquide. Retire de l\'argent à la banque.');
    UI.qty({ icon: D.icon, title: `Acheter — ${D.name}`, text: `${MarketData.brand(c, d)} · ${U.q(q)}<br>Prix de gros : <b>${U.unitPrice(MarketData.buyUnit(c, d))}</b> / ${D.unit}`,
      max, init: Math.max(1, Math.floor(max / 2)), unit: D.unit,
      info: (n) => `Total : <b class="y">${U.money(MarketData.buyCost(c, d, n))}</b><br><small class="m">Encombrement : ${U.num(n * D.bulk)} / ${U.num(PlayerData.capacity() - Inventory.bulk())} dispo</small>`,
      confirm: '🛒 Acheter', onConfirm: (n) => {
        const cost = Math.round(MarketData.buyCost(c, d, n));
        if (cost > S.cash) return UI.toast('Pas assez de liquide.');
        S.cash -= cost; S.stats.bought += cost;
        Inventory.add(d, n, q, MarketData.brand(c, d)); MarketData.impact(c, d, n, 1);
        PlayerData.mod('heat', Math.min(5, n * D.bulk / 800));
        log('🛒', `Achat en gros : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} (${MarketData.brand(c, d)}, Q${q}) → −${U.money(cost)}.`, 'money');
      } });
  },
  retailRisk(d, n) {
    return Math.round(U.clamp(((n / DRUGS[d].demand) * 4 + S.heat * 0.1 + 0.5) * Police.level() * (1 - PlayerData.respect() / 300), 0.5, 60) * 10) / 10;
  },
  sellRetail(d) {
    if (S.jail) return;
    const D = DRUGS[d], have = Inventory.qty(d), left = MarketData.demandLeft(d);
    if (!have) return UI.toast('Tu n\'as pas ce produit.');
    if (left < 1) return UI.toast(`Plus de clients pour ${D.name} ce mois-ci.`);
    const q = Inventory.q(d), unit = MarketData.retail(S.city, d, q), max = Math.min(have, left);
    UI.qty({ icon: D.icon, title: `Vente de rue — ${D.name}`, text: `Prix de rue : <b>${U.unitPrice(unit)}</b> / ${D.unit} (${U.q(q)})<br>Clients restants ce mois : ${U.num(left)} ${U.u(D, U.num(left))}`,
      max, init: max, unit: D.unit,
      info: (n) => `Recette : <b class="g">${U.money(n * unit)}</b><br>Risque d'interpellation : ${U.risk(this.retailRisk(d, n))}`,
      confirm: '🏪 Vendre', onConfirm: (n) => this.doRetail(d, n) });
  },
  doRetail(d, n) {
    const D = DRUGS[d]; n = Math.min(n, Inventory.qty(d)); if (n < 1) return;
    if (U.chance(this.retailRisk(d, n))) return this.retailBust(d, n);
    const q = Inventory.q(d), rev = Math.round(n * MarketData.retail(S.city, d, q)), cut = Inventory.cut(d);
    Inventory.remove(d, n); PlayerData.earn(rev);
    const k = S.city + ':' + d; S.market.sold[k] = (S.market.sold[k] || 0) + n;
    S.stats.sold += rev;
    PlayerData.mod('heat', Math.min(6, n * D.bulk / 60 + 0.5));
    let extra = '';
    if (q < 25) { PlayerData.mod('respect', -1); extra = ' Les clients se plaignent de ta came coupée (−1 👑).'; }
    else if (q >= 80) { PlayerData.mod('respect', 0.6); extra = ' Ta came de qualité fait parler d\'elle.'; }
    else PlayerData.mod('respect', 0.25);
    log('🏪', `Vente de rue : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} → <b>+${U.money(rev)}</b>.${extra}`, 'money');
    this.cutFallout(d, n, cut);
  },
  retailBust(d, n) {
    const D = DRUGS[d], value = Inventory.streetValue(d, n), cops = CITIES[S.city].cops;
    const bribe = Math.round(500 + value * 0.6);
    const pFlee = Math.round(U.clamp(40 + (S.owned.vehicles.includes('tmax') ? 15 : 0) + S.health * 0.2 - S.addiction * 0.15, 10, 85));
    UI.modal({ icon: '🚓', title: 'Flagrant délit !', cls: 'bad', text: `Une patrouille de police (${cops}) déboule pendant que tu vends ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)}.`,
      choices: [
        { label: '🏃 Prendre la fuite', sub: `Chance ~${pFlee} % · tu lâches la marchandise`, fn: () => {
          Inventory.remove(d, n);
          if (U.chance(pFlee)) { PlayerData.mod('heat', 8); log('🏃', `Tu sèmes les policiers mais tu perds ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)}.`, 'bad'); UI.result('🏃', 'Semés !', 'Tu as pris la fuite par les toits. La marchandise est perdue.', 'bad'); }
          else { log('🚔', `Les policiers (${cops}) te rattrapent au bout de la rue.`, 'bad'); this.arrest({ charge: 'Trafic de stupéfiants (flagrant délit) et rébellion', months: this.drugMonths(value) + 3 }); }
        } },
        { label: `💶 Glisser un billet (${U.money(bribe)})`, sub: 'Chance ~50 %', dis: S.cash < bribe, fn: () => {
          S.cash -= bribe;
          if (U.chance(50)) { log('💶', 'Les policiers empochent le billet et repartent comme si de rien n\'était.', ''); UI.result('💶', 'Arrangement', 'Les policiers ont empoché le billet.', 'good'); }
          else { Inventory.remove(d, n); this.arrest({ charge: 'Trafic de stupéfiants et tentative de corruption', months: this.drugMonths(value) + 6 }); }
        } },
        { label: '🙌 Se rendre', fn: () => { Inventory.remove(d, n); this.arrest({ charge: 'Trafic de stupéfiants (flagrant délit)', months: this.drugMonths(value) }); } },
      ] });
  },
  bulkRisk(d, n) { return Math.round(U.clamp((1 + n * DRUGS[d].bulk / 400 + S.heat * 0.05) * Police.level(), 0.5, 25) * 10) / 10; },
  sellBulk(d) {
    if (S.jail) return;
    const D = DRUGS[d], have = Inventory.qty(d); if (!have) return;
    const q = Inventory.q(d), c = S.city;
    UI.qty({ icon: D.icon, title: `Vente en gros — ${D.name}`, text: `Prix grossiste : ~<b>${U.unitPrice(MarketData.sellUnit(c, d, q))}</b> / ${D.unit} (${U.q(q)})<br><small class="m">Les gros volumes font baisser le prix.</small>`,
      max: have, init: have, unit: D.unit,
      info: (n) => `Recette : <b class="g">${U.money(MarketData.sellValue(c, d, q, n))}</b><br>Risque d'acheteur infiltré : ${U.risk(this.bulkRisk(d, n))}`,
      confirm: '🏭 Vendre', onConfirm: (n) => {
        n = Math.min(n, Inventory.qty(d)); if (n < 1) return;
        if (U.chance(this.bulkRisk(d, n))) {
          const value = Inventory.streetValue(d, n); Inventory.remove(d, n);
          log('🕵️', `L'acheteur était un agent infiltré (${CITIES[c].cops}) !`, 'bad');
          return this.arrest({ charge: 'Trafic de stupéfiants en bande organisée', months: this.drugMonths(value) });
        }
        const rev = Math.round(MarketData.sellValue(c, d, q, n)), cut = Inventory.cut(d);
        Inventory.remove(d, n); PlayerData.earn(rev); MarketData.impact(c, d, n, -1);
        this.cutFallout(d, Math.round(n / 2), cut);
        S.stats.sold += rev; PlayerData.mod('heat', Math.min(8, n * D.bulk / 500)); PlayerData.mod('respect', Math.min(3, rev / 50000));
        log('🏭', `Vente en gros : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} → <b>+${U.money(rev)}</b>.`, 'money');
      } });
  },
  stockMenu(d) {
    const D = DRUGS[d];
    UI.modal({ icon: D.icon, title: D.name, text: `${U.num(Inventory.qty(d))} ${U.u(D, U.num(Inventory.qty(d)))} · ${U.q(Inventory.q(d))}<br>Valeur de rue ~${U.money(Inventory.streetValue(d, Inventory.qty(d)))}`,
      choices: [
        { label: '🏪 Vendre au détail', fn: () => this.sellRetail(d) },
        { label: '🏭 Vendre en gros', fn: () => this.sellBulk(d) },
        { label: '💉 Consommer', fn: () => this.consumeMenu(d) },
        { label: '✂️ Couper la marchandise', sub: '+30 % de quantité · −28 % de qualité', fn: () => this.cut(d) },
        { label: '🚽 Tout jeter', sub: 'Se débarrasser des preuves (−3 🚨)', cls: 'danger', fn: () => { const n = Inventory.remove(d, Inventory.qty(d)); PlayerData.mod('heat', -3); log('🚽', `Tu te débarrasses de ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)}.`, ''); } },
        { label: 'Fermer', cls: 'ghost' },
      ] });
  },
  cut(d) {
    const D = DRUGS[d], s = S.stock[d]; if (!s) return;
    UI.confirm('✂️', 'Couper la marchandise', `Mélanger ton stock ${U.de(D.name)} avec des produits de coupe : <b>+30 % de quantité</b> mais <b>−28 % de qualité</b>.<br>Qualité actuelle : ${U.q(s.q)}`, '✂️ Couper', () => {
      const add = Math.floor(s.qty * 0.3); s.qty += add; s.q = Math.max(1, Math.round(s.q * 0.72));
      log('✂️', `Tu coupes ton stock ${U.de(D.name)} : +${U.num(add)} ${U.u(D, U.num(add))}, qualité ${s.q} %.`, 'drug');
    });
  },

  /* ----- Voyages & importations ----- */
  travelCost(to) {
    const a = CITIES[S.city], b = CITIES[to];
    if (a.country === b.country) return 120;
    if (a.region === b.region) return a.region === 'eu' ? 280 : 450;
    return 1300;
  },
  customsRisk(to) {
    const b = Inventory.bulk(); if (!b) return 0;
    const same = CITIES[S.city].country === CITIES[to].country;
    return Math.round(U.clamp((b / 12) * Police.customs(to) * (1 + S.heat / 100) * (same ? 0.35 : 1), 2, 90));
  },
  travel(to) {
    if (S.jail) return;
    const cost = this.travelCost(to), risk = this.customsRisk(to), C = CITIES[to];
    const same = CITIES[S.city].country === C.country;
    UI.modal({ icon: C.flag, title: `Partir pour ${C.name} ?`,
      text: `${same ? '🚄 Train' : '✈️ Avion'} : <b>${U.money(cost)}</b> · 1 ⚡<br>${Inventory.bulk() > 0 ? `Tu transportes ton stock (${U.num(Inventory.bulk())} u.) : risque de contrôle ${U.risk(risk)}` : 'Tu voyages léger : aucun risque.'}`,
      choices: [
        { label: `${same ? '🚄' : '✈️'} Partir`, cls: 'primary', dis: !PlayerData.can(cost), fn: () => {
          if (!PlayerData.useAP(1)) return;
          PlayerData.pay(cost);
          const from = S.city; S.city = to; S.gofasts = GoFast.gen();
          if (Inventory.bulk() > 0 && U.chance(risk)) {
            const value = Inventory.seize(1);
            log('🛃', `Contrôle ${same ? 'en gare' : 'douanier'} à l'arrivée à ${C.name} : tout ton stock est saisi (~${U.money(value)}) !`, 'bad');
            this.arrest({ charge: 'Transport et importation de stupéfiants', months: Math.round(this.drugMonths(value) * 1.3) + 3 });
          } else log('✈️', `Tu quittes ${CITIES[from].name} et t'installes à <b>${C.flag} ${C.name}</b>.`, 'info');
        } },
        { label: 'Annuler', cls: 'ghost' },
      ] });
  },
  importRisk(from, m) { return Math.round(U.clamp(m.risk * (Police.customs(from) + Police.customs()) / 2 * (1 + S.heat / 150), 1, 90)); },
  importMethod(from, d) {
    const D = DRUGS[d];
    UI.modal({ icon: '🚢', title: `Importer ${D.name}`, text: `Depuis ${CITIES[from].flag} ${CITIES[from].name} vers ${CITIES[S.city].flag} ${CITIES[S.city].name}.<br>Choisis ta filière :`,
      choices: IMPORT_METHODS.map((m) => {
        const regionOk = !m.sameRegion || CITIES[from].region === CITIES[S.city].region;
        const lock = S.rank < m.rank ? `🔒 ${RANKS[m.rank].name}` : !regionOk ? '🔒 même continent uniquement' : '';
        return { label: `${m.icon} ${m.name}`, sub: lock || `Max ${U.num(m.max)} u. · ${U.money(m.fixed)} + ${Math.round(m.pct * 100)} % · saisie ~${this.importRisk(from, m)} % · ${m.months} mois`,
          dis: !!lock, fn: () => this.importQty(from, d, m) };
      }).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  importQty(from, d, m) {
    const D = DRUGS[d];
    const cost = (n) => MarketData.buyCost(from, d, n) * (1 + m.pct) + m.fixed;
    const max = U.maxQty(cost, S.cash, Math.floor(m.max / D.bulk));
    if (max < 1) return UI.toast(`💵 Pas assez de liquide (frais fixes : ${U.money(m.fixed)}).`);
    const q = S.market.qual[from][d], risk = this.importRisk(from, m);
    UI.qty({ icon: m.icon, title: `${m.name} — ${D.name}`, text: `${MarketData.brand(from, d)} · ${U.q(q)} · ${U.unitPrice(MarketData.buyUnit(from, d))} / ${D.unit} sur place`,
      max, init: max, unit: D.unit,
      info: (n) => `Marchandise : ${U.money(MarketData.buyCost(from, d, n))}<br>Transport : ${U.money(MarketData.buyCost(from, d, n) * m.pct + m.fixed)}<br>Total : <b class="y">${U.money(cost(n))}</b> · Saisie : ${U.risk(risk)}`,
      confirm: '📦 Commander', onConfirm: (n) => {
        const total = Math.round(cost(n)); if (total > S.cash) return UI.toast('Pas assez de liquide.');
        S.cash -= total; S.stats.bought += total;
        MarketData.impact(from, d, n, 1);
        S.imports.push({ id: U.uid(), d, qty: n, q, b: MarketData.brand(from, d), from, method: m.id, arrive: S.ageMonths + m.months, risk });
        log(m.icon, `Importation lancée : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} depuis ${CITIES[from].name} (${m.name}, arrivée dans ${m.months} mois) → −${U.money(total)}.`, 'money');
      } });
  },

  /* ----- Labos ----- */
  buyLab(type) {
    const L = LABS[type];
    if (S.jail) return;
    if (S.rank < L.rank) return UI.toast(`🔒 Grade requis : ${RANKS[L.rank].name}`);
    UI.pay({ icon: L.icon, title: L.name, text: `Production : ${U.num(L.out)} ${U.u(DRUGS[L.drug], U.num(L.out))}/mois ${U.de(DRUGS[L.drug].name)}${L.input ? `<br>Matière première : ${U.num(L.input.qty)} ${U.u(DRUGS[L.input.drug], L.input.qty)} ${U.de(DRUGS[L.input.drug].name)}/mois` : ''}<br>Frais mensuels : ${U.money(L.upkeep)}${Labs.configurable(type) ? '<br><small class="m">Après l\'achat, tu choisis ce que tu produis.</small>' : ''}`, price: L.price,
      onPay: () => {
        const l = { id: U.uid(), type, level: 1, cfg: Labs.defaults(type) };
        S.labs.push(l); log(L.icon, `Tu montes un nouveau laboratoire : <b>${L.name}</b>.`, 'good');
        if (Labs.configurable(type)) Labs.setup(l.id, true);
      } });
  },
  labMenu(id) {
    const l = S.labs.find((x) => x.id === id); if (!l) return;
    const L = LABS[l.type], up = Math.round(L.price * 0.7 * l.level), sp = Labs.spec(l), D = DRUGS[sp.drug], n = Math.round(L.out * LAB_MULT[l.level - 1] * sp.y);
    const need = L.input ? Math.ceil(n * L.input.qty / L.out) : 0, I = L.input ? DRUGS[L.input.drug] : null;
    const fneed = sp.fentaPer ? Math.ceil(n / sp.fentaPer) : 0;
    UI.modal({ icon: L.icon, title: `${L.name} (niv. ${l.level})`,
      text: `${sp.label ? sp.label + '<br>' : ''}Production : ~${U.num(n)} ${U.u(D, U.num(n))}/mois ${U.de(D.name)}<br>Frais : ${U.money(L.upkeep * (1 + (l.level - 1) * 0.5))}/mois${I ? `<br>Matière première : ${U.num(need)} ${U.u(I, need)} ${U.de(I.name)}/mois (stock : ${U.num(Inventory.qty(L.input.drug))})` : ''}${fneed ? `<br>Fentanyl : ${fneed} cp/mois (stock : ${U.num(Inventory.qty('fenta'))})` : ''}`,
      choices: [
        ...(Labs.configurable(l.type) ? [{ label: '⚙️ Changer la production', sub: 'Variété, modèle, forme, couleur, étiquette…', fn: () => Labs.setup(l.id) }] : []),
        ...(I ? [{ label: `🛒 Acheter ${U.de(I.name.toLowerCase())}`, sub: 'Au prix de gros de la ville', dis: !!S.jail, fn: () => this.buy(L.input.drug) }] : []),
        ...(fneed ? [{ label: '☠️ Acheter du fentanyl', sub: 'Pour couper le sirop', dis: !!S.jail, fn: () => this.buy('fenta') }] : []),
        { label: `⬆️ Améliorer (${U.money(up)})`, sub: l.level >= 3 ? 'Niveau maximum' : '+60 % de production, +8 qualité', dis: l.level >= 3 || !PlayerData.can(up),
          fn: () => { PlayerData.pay(up); l.level++; log('⬆️', `Amélioration terminée : ${L.name} (niveau ${l.level}).`, 'good'); } },
        { label: `💰 Revendre (${U.money(L.price * 0.5)})`, cls: 'danger', fn: () => { S.labs = S.labs.filter((x) => x !== l); S.cash += Math.round(L.price * 0.5); log('💰', `Tu revends ton laboratoire (${L.name}).`, 'money'); } },
        { label: 'Fermer', cls: 'ghost' },
      ] });
  },

  /* ----- Hiérarchie / guerre ----- */
  reqs(i) {
    const r = RANKS[i];
    return [
      { label: `Respect ≥ ${r.respect}`, ok: PlayerData.respect() >= r.respect },
      { label: `Gains criminels ≥ ${U.money(r.earned)}`, ok: S.earned >= r.earned },
      ...(r.terr ? [{ label: `${r.terr} territoire(s) contrôlé(s)`, ok: S.territories >= r.terr }] : []),
    ];
  },
  promote() {
    const i = S.rank + 1; if (!RANKS[i]) return;
    if (!this.reqs(i).every((x) => x.ok)) return UI.toast('Conditions non remplies.');
    S.rank = i; PlayerData.mod('respect', 5);
    const r = RANKS[i];
    log(r.icon, `<b>PROMOTION !</b> Tu deviens <b>${r.name}</b>.`, 'good');
    UI.result(r.icon, `Promotion : ${r.name}`, `Le milieu reconnaît ton ascension.<br><br>${r.perks.map((p) => '✅ ' + p).join('<br>')}`, 'good');
  },
  warChance(r) {
    let w = 0; const my = PlayerData.warPower();
    for (let i = 0; i < 300; i++) if (my + U.rand(-15, 35) > r.strength * U.rand(0.7, 1.3)) w++;
    return Math.round(w / 3);
  },
  attack(id) {
    const r = S.rivals.find((x) => x.id === id); if (!r) return;
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    if (S.rank < 2) return UI.toast('🔒 Grade requis : Lieutenant');
    UI.confirm('⚔️', `Attaquer ${r.name} ?`, `Ta puissance : ~${PlayerData.warPower()} · Eux : ~${Math.round(r.strength)}<br>Chances estimées : ${U.pct(this.warChance(r))} · 2 ⚡`, '⚔️ Lancer l\'assaut', () => {
      if (!PlayerData.useAP(2)) return;
      S.stats.wars++;
      const win = PlayerData.warPower() + U.rand(-15, 35) > r.strength * U.rand(0.7, 1.3);
      if (win) {
        const loot = Math.round(U.rand(5000, 20000) * (1 + S.rank));
        S.territories++; r.terr--; PlayerData.earn(loot); PlayerData.mod('respect', 6); PlayerData.mod('heat', 15);
        S.stats.kills += U.ri(1, 4);
        PlayerData.soldiers().forEach((c) => { c.skill = Math.min(99, c.skill + 2); c.loyalty = Math.min(100, c.loyalty + 5); });
        let txt = `Tu prends un territoire ${U.aN(r.name)} et récupères ${U.money(loot)}.`;
        if (r.terr <= 0) { S.rivals = S.rivals.filter((x) => x !== r); txt += ` <b>${r.name}</b> : gang anéanti !`; PlayerData.mod('respect', 5); }
        log('⚔️', `Guerre de territoire : ${txt}`, 'good');
        UI.result('🏴', 'Victoire !', txt, 'good');
      } else {
        const dmg = Math.round(U.ri(15, 45) * (1 - PlayerData.armor() / 150));
        const dead = PlayerData.soldiers().filter(() => U.chance(30));
        S.crew = S.crew.filter((c) => !dead.includes(c));
        PlayerData.mod('respect', -4); PlayerData.mod('heat', 10); r.strength *= 1.05; S.wounded = true;
        log('💀', `Guerre de territoire perdue contre ${r.name} : −${dmg} ❤️${dead.length ? `, ${dead.length} soldat(s) tué(s)` : ''}.`, 'bad');
        PlayerData.hurt(dmg, `Tué dans une guerre de territoire contre ${r.name}`);
        if (!S.alive) return;
        UI.result('💀', 'Défaite', `Repli en catastrophe. −${dmg} ❤️${dead.length ? `<br>${dead.map((c) => c.name).join(', ')} n'en sont pas revenus.` : ''}`, 'bad');
      }
      if (S.alive && U.chance(15 * Police.level())) this.arrest({ charge: 'Association de malfaiteurs et tentative de meurtre', months: 60 });
    }, 'danger');
  },

  /* ----- Finances ----- */
  withdraw() {
    if (S.bank < 1) return UI.toast('Compte en banque vide.');
    UI.qty({ icon: '🏧', title: 'Retirer du liquide', text: 'Transférer de l\'argent blanchi vers ton liquide.', max: S.bank, init: Math.min(S.bank, 1000), unit: '€',
      info: (n) => `Liquide après retrait : <b class="g">${U.money(S.cash + n)}</b>`, confirm: '🏧 Retirer',
      onConfirm: (n) => { n = Math.min(n, S.bank); S.bank -= n; S.cash += n; UI.toast(`🏧 +${U.money(n)} en liquide`); } });
  },
  deposit() {
    const max = Math.min(S.cash, 1500 - S.deposit);
    if (max < 1) return UI.toast('Plafond de dépôt discret atteint ce mois-ci.');
    UI.qty({ icon: '🏦', title: 'Dépôt en espèces', text: 'Sous le seuil de déclaration : 1 500 €/mois max, sans éveiller les soupçons.', max, init: max, unit: '€',
      confirm: '🏦 Déposer', onConfirm: (n) => { n = Math.min(n, S.cash); S.cash -= n; S.bank += n; S.deposit += n; UI.toast(`🏦 ${U.money(n)} déposés`); } });
  },
  borrow(id) {
    const L = LOANS.find((x) => x.id === id);
    if (S.debts.some((d) => d.lender === L.lender)) return UI.toast('Tu as déjà une dette envers ce prêteur.');
    UI.confirm('🤝', L.lender, `Prêt de <b>${U.money(L.amount)}</b> en liquide.<br>Intérêts : <b>${Math.round(L.rate * 100)} % par mois</b>.<br>À rembourser sous ${L.months} mois… sinon ses hommes viendront.`, '💵 Accepter', () => {
      S.cash += L.amount; PlayerData.addDebt(L.lender, L.amount, L.rate, L.months);
      log('🤝', `Tu empruntes ${U.money(L.amount)} à ${L.lender} (${Math.round(L.rate * 100)} %/mois).`, 'money');
    });
  },
  repay(id) {
    const d = S.debts.find((x) => x.id === id); if (!d) return;
    const max = Math.min(d.amount, S.cash + S.bank);
    if (max < 1) return UI.toast('Pas d\'argent pour rembourser.');
    UI.qty({ icon: '💸', title: `Rembourser ${d.lender}`, text: `Dette : <b class="r">${U.money(d.amount)}</b>`, max, init: max, unit: '€', confirm: '💸 Rembourser',
      onConfirm: (n) => {
        n = Math.min(n, d.amount); if (!PlayerData.pay(n)) return;
        d.amount -= n;
        if (d.amount <= 0) { S.debts = S.debts.filter((x) => x !== d); log('✅', `Dette envers ${d.lender} entièrement remboursée.`, 'good'); }
        else log('💸', `Remboursement de ${U.money(n)} à ${d.lender} (reste ${U.money(d.amount)}).`, '');
      } });
  },
  setLaunder(v) { S.launderTarget = v; UI.toast(`🧼 Objectif : ${v == null ? 'capacité maximale' : U.money(v) + '/mois'}`); },
  buyBusiness(type) {
    const B = BUSINESSES[type];
    if (S.jail) return UI.toast('Impossible depuis ta cellule.');
    UI.pay({ icon: B.icon, title: B.name, text: `Blanchit jusqu'à <b>${U.money(B.cap)}/mois</b><br>Bénéfice légal : +${U.money(B.income)}/mois`, price: B.price,
      onPay: () => { const b = { id: U.uid(), type }; if (B.strip) Strip.ensure(b); S.businesses.push(b); log(B.icon, `Tu rachètes un commerce : <b>${B.name}</b>. Une belle façade.`, 'good'); } });
  },
  sellBusiness(id) {
    const b = S.businesses.find((x) => x.id === id); if (!b) return;
    const B = BUSINESSES[b.type], v = Math.round(B.price * 0.6);
    UI.confirm(B.icon, `Revendre ${B.name} ?`, `Prix de revente : <b>${U.money(v)}</b> (versé en banque)`, '💰 Revendre', () => {
      S.businesses = S.businesses.filter((x) => x !== b); S.bank += v; log('💰', `Tu revends ${B.name} pour ${U.money(v)}.`, 'money');
      Vault.cleanup(); // le coffre du club est vidé avant la vente
      if (UI.stack.length && UI.stack[UI.stack.length - 1].view === 'strip') UI.stack.pop();
    }, 'danger');
  },
};

/* ============================== GO FAST ============================== */
const GoFast = {
  run: null,
  gen() {
    const c = CITIES[S.city];
    return Array.from({ length: U.ri(1, 3) }, () => {
      const danger = U.ri(1, 3), d = U.pick(c.gfCargo);
      const kg = d === 'hash' || d === 'weed' ? U.ri(150, 600) : U.ri(20, 150);
      const pay = Math.round((4000 + danger * danger * 5000) * U.rand(0.8, 1.3) * (1 + S.rank * 0.25) * (c.region === 'am' ? 1.2 : 1) / 100) * 100;
      return { id: U.uid(), route: U.pick(c.routes), drug: d, kg, pay, danger };
    });
  },
  start(id) {
    const g = S.gofasts.find((x) => x.id === id); if (!g || S.jail) return;
    if (!PlayerData.useAP(2)) return;
    S.gofasts = S.gofasts.filter((x) => x !== g);
    this.run = { g, car: null };
    const cars = PlayerData.items('vehicles').filter((v) => v.speed).sort((a, b) => b.speed - a.speed);
    const ch = cars.map((v) => ({ label: `${v.icon} ${v.name}`, sub: `Vitesse ${v.speed} · Discrétion ${v.disc} · risque de saisie du véhicule`, fn: () => this.pickCar(v) }));
    // véhicules volés du garage : sacrifiables, plaques maquillées, intraçables
    for (const c of S.garage) ch.push({ label: `${c.icon} ${c.name} · véhicule volé`, sub: `Vitesse ${c.speed} · Discrétion ${c.disc + 10} · plaques maquillées, brûlé après la course`, fn: () => this.pickCar({ ...c, id: null, stolen: c.uid, disc: c.disc + 10 }) });
    ch.push({ label: '🚙 Voiture fournie (volée)', sub: 'Vitesse 60 · Discrétion 50', fn: () => this.pickCar({ id: null, name: 'voiture volée', speed: 60, disc: 50 }) });
    UI.modal({ icon: '🏎️', title: 'Go Fast', text: `<b>${g.route}</b><br>Cargaison : ${g.kg} kg ${U.de(DRUGS[g.drug].name)}<br>Paie : <b class="g">${U.money(g.pay)}</b> · Danger ${'🔥'.repeat(g.danger)}<br><br>Quel véhicule prends-tu ?`, choices: ch });
  },
  pSpeed() { return Math.round(U.clamp(this.run.car.speed * 0.85 - this.run.g.danger * 6 + PlayerData.crimeBuff() * 0.5, 5, 95)); },
  pDisc() { return Math.round(U.clamp(this.run.car.disc * 0.75 + 12 + (Police.bought() ? 12 : 0) - S.heat * 0.2 - this.run.g.danger * 5, 5, 95)); },
  pDrive() { return Math.round(U.clamp(45 + this.run.car.speed * 0.35 - S.addiction * 0.2, 10, 95)); },
  pickCar(v) {
    this.run.car = v;
    UI.modal({ icon: '🗺️', title: 'Itinéraire', text: `Au volant : ${v.name}. Par où passes-tu ?${Police.bought() ? '<br><small class="g">👮 Police locale achetée : contrôles divisés par deux.</small>' : ''}`, choices: [
      { label: '🛣️ Autoroute', sub: 'Rapide, mais péages et contrôles fréquents', fn: () => this.leg({ ctrl: 40, crash: 6, name: 'l\'autoroute' }) },
      { label: '🛤️ Nationales', sub: 'Équilibré', fn: () => this.leg({ ctrl: 25, crash: 12, name: 'les nationales' }) },
      { label: '🌲 Petites routes de campagne', sub: 'Peu de flics, route dangereuse', fn: () => this.leg({ ctrl: 12, crash: 25, name: 'les petites routes' }) },
    ] });
  },
  leg(r) {
    const roll = U.rand(0, 100), dz = this.run.g.danger * 5, ctrl = r.ctrl * (Police.bought() ? 0.5 : 1);
    if (roll < ctrl + dz) {
      UI.modal({ icon: '🚓', title: 'Voiture banalisée !', text: `Sur ${r.name}, une voiture banalisée te colle au train depuis 10 km…`, choices: [
        { label: '💨 Accélérer à fond', sub: `Chance ~${this.pSpeed()} %`, fn: () => (U.chance(this.pSpeed())
          ? this.say('💨', 'Semés !', 'Tu pousses le moteur dans ses retranchements. Les gyrophares disparaissent dans le rétro.', () => this.checkpoint(5))
          : this.end(U.chance(50) ? 'crash' : 'arrest')) },
        { label: '😐 Rester calme, respecter les limitations', sub: `Chance ~${this.pDisc()} %`, fn: () => (U.chance(this.pDisc())
          ? this.say('😮‍💨', 'Fausse alerte', 'La voiture finit par te doubler et disparaît dans la nuit.', () => this.checkpoint())
          : this.end('arrest')) },
        { label: '📦 Sortir et larguer la marchandise', sub: 'Tu t\'en sors, mais le cartel voudra être remboursé', fn: () => this.end('dump') },
      ] });
    } else if (roll < ctrl + dz + r.crash) {
      UI.modal({ icon: '💥', title: 'Danger sur la route !', text: 'Un camion déboîte sans prévenir alors que tu roules à 220 km/h !', choices: [
        { label: '🛞 Braquer sèchement', sub: `Chance ~${this.pDrive()} %`, fn: () => (U.chance(this.pDrive())
          ? this.say('😱', 'Ouf !', 'Tu évites le camion de quelques centimètres.', () => this.checkpoint()) : this.end('crash')) },
        { label: '🛑 Piler', sub: 'Plus sûr, mais tu perds du temps', fn: () => (U.chance(80)
          ? this.say('🛑', 'Évité', 'Tu t\'arrêtes net. Le cœur à 200. Tu as perdu de précieuses minutes.', () => this.checkpoint(12)) : this.end('crash')) },
      ] });
    } else {
      this.say('🌙', 'Route calme', 'La nuit est calme. Seul le ronronnement du moteur te tient compagnie.', () => this.checkpoint());
    }
  },
  checkpoint(extra = 0) {
    const g = this.run.g;
    if (!U.chance(30 + g.danger * 8 + extra)) return this.end('ok');
    const pForce = Math.round(U.clamp(this.run.car.speed * 0.6 + PlayerData.firepower() * 0.3 - g.danger * 5, 5, 90));
    const pTurn = Math.round(U.clamp(this.run.car.speed * 0.5 + 15, 5, 90));
    const pBluff = Math.round(U.clamp(this.run.car.disc * 0.6 + PlayerData.respect() * 0.15 - S.heat * 0.2, 5, 90));
    UI.modal({ icon: '🚧', title: 'Barrage de douane !', text: 'Au loin, des gyrophares bleus et une herse en travers de la route. Un barrage des douanes !', choices: [
      { label: '🏎️ Forcer le barrage', sub: `Chance ~${pForce} %`, fn: () => (U.chance(pForce) ? this.end('ok', 15) : this.end(U.chance(50) ? 'crash' : 'arrest')) },
      { label: '↩️ Faire demi-tour', sub: `Chance ~${pTurn} %`, fn: () => (U.chance(pTurn) ? this.end('ok', 5) : this.end('arrest')) },
      { label: '😎 Passer au culot', sub: `Chance ~${pBluff} %`, fn: () => (U.chance(pBluff) ? this.end('ok') : this.end('arrest')) },
    ] });
  },
  say(icon, title, text, next) { UI.modal({ icon, title, text, choices: [{ label: 'Continuer ▶', cls: 'primary', fn: next }] }); },
  loseCar() {
    const car = this.run.car;
    if (car.stolen) return ' Le véhicule volé est abandonné : rien ne remonte jusqu\'à toi.';
    if (car.id) { S.owned.vehicles = S.owned.vehicles.filter((x) => x !== car.id); return ` Véhicule perdu : ${car.name}.`; }
    return '';
  },
  end(outcome, heat = 0) {
    const g = this.run.g, D = DRUGS[g.drug], car = this.run.car || {};
    if (car.stolen) {
      S.garage = S.garage.filter((x) => x.uid !== car.stolen);
      if (outcome === 'arrest' && U.chance(55)) { log('🏃', 'Véhicule volé intraçable : tu l\'abandonnes avec la cargaison et disparais à pied.', 'bad'); outcome = 'dump'; }
    }
    if (outcome === 'ok') {
      PlayerData.earn(g.pay); PlayerData.mod('respect', 2 + g.danger); PlayerData.mod('heat', (car.stolen ? 1 : 3) + heat);
      log('🏁', `Go Fast réussi (${g.route}) : <b>+${U.money(g.pay)}</b>.${car.stolen ? ' Le véhicule volé est brûlé dans un terrain vague.' : ''}`, 'money');
      UI.result('🏁', 'Livraison effectuée !', `La marchandise est arrivée à bon port.<br><b class="g">+${U.money(g.pay)}</b> · +${2 + g.danger} respect`, 'good');
    } else if (outcome === 'dump') {
      const debt = g.pay * 2;
      PlayerData.addDebt('El Patrón (cartel)', debt, 0, 3); PlayerData.mod('respect', -3);
      log('📦', `Go Fast avorté : cargaison larguée. Le cartel exige ${U.money(debt)} sous 3 mois.`, 'bad');
      UI.result('📦', 'Cargaison perdue', `Tu t'en sors, mais ${g.kg} kg ${U.de(D.name)} sont perdus.<br>Le cartel te réclame <b class="r">${U.money(debt)}</b> sous 3 mois.`, 'bad');
    } else if (outcome === 'crash') {
      const dmg = Math.round(U.ri(25, 60) * (1 - PlayerData.armor() / 250));
      const carTxt = this.loseCar();
      PlayerData.addDebt('El Patrón (cartel)', g.pay * 1.5, 0, 4);
      log('💥', `Go Fast : accident à pleine vitesse ! −${dmg} ❤️.${carTxt} Le cartel réclame la marchandise.`, 'bad');
      PlayerData.hurt(dmg, 'Crash mortel lors d\'un go fast');
      if (S.alive) UI.result('💥', 'Accident !', `La voiture part en tonneaux. −${dmg} ❤️.${carTxt}<br>Tu fuis à pied avant l'arrivée des secours. Le cartel veut ${U.money(g.pay * 1.5)}.`, 'bad');
    } else if (outcome === 'arrest') {
      const carTxt = this.loseCar();
      log('🚔', `Go Fast : interpellation avec ${g.kg} kg ${U.de(D.name)} dans le coffre.${carTxt}`, 'bad');
      Actions.arrest({ charge: `Transport de ${g.kg} kg de stupéfiants (go fast)`, months: 18 + g.danger * 12 });
    }
    this.run = null;
  },
};

/* =============================== CREW =============================== */
const Crew = {
  gen() {
    const reg = NAMES[CITIES[S.city].names];
    const skill = U.clamp(U.ri(12, 50 + S.rank * 10), 5, 95);
    return { id: U.uid(), name: `${U.pick(reg.first)} « ${U.pick(NICKS)} »`, skill, loyalty: U.ri(35, 85), trait: U.pick(Object.keys(TRAITS)),
      cost: Math.round((300 + skill * skill * 1.5) / 50) * 50, role: 'dealer', drug: 'auto', post: 'street', quota: 100, months: 0 };
  },
  genList(n) { return Array.from({ length: n }, () => this.gen()); },
  max() { return RANKS[S.rank].crew; },
  get(id) { return S.crew.find((c) => c.id === id); },
  remove(m) { S.crew = S.crew.filter((x) => x !== m); },
  // choix du poste à l'embauche : dealeur de rue, dealeur posté en boîte ou soldat
  recruitMenu(id) {
    const c = S.candidates.find((x) => x.id === id); if (!c) return;
    if (S.crew.length >= this.max()) return UI.toast(`Équipe au complet pour ton grade (${this.max()}).`);
    if (S.cash < c.cost) return UI.toast('Pas assez de liquide.');
    const clubs = PlayerData.clubs().length;
    UI.modal({ icon: TRAITS[c.trait].icon, title: `Recruter ${c.name}`, text: `Embauche : <b>${U.money(c.cost)}</b> en liquide · talent ${c.skill} · loyauté ${c.loyalty}<br>Quel poste lui confies-tu ?`, choices: [
      { label: '💊 Dealeur de rue', sub: 'Écoule automatiquement ton stock (le produit le plus rentable)', fn: () => this.recruit(id, 'dealer', 'street') },
      { label: '🪩 Dealeur posté dans ton club', sub: clubs ? 'MDMA, cocaïne, kétamine à forte marge · aucun risque si la police est achetée' : '🔒 Il te faut une boîte de nuit ou un strip club', dis: !clubs, fn: () => this.recruit(id, 'dealer', 'club') },
      { label: '🛡️ Soldat', sub: `Protection, guerres, escortes · ${U.money(SOLDIER_PAY)}/mois`, fn: () => this.recruit(id, 'soldier') },
      { label: 'Annuler', cls: 'ghost' },
    ] });
  },
  recruit(id, role = 'dealer', post = 'street') {
    const c = S.candidates.find((x) => x.id === id); if (!c) return;
    if (S.crew.length >= this.max()) return UI.toast(`Équipe au complet pour ton grade (${this.max()}).`);
    if (S.cash < c.cost) return UI.toast('Pas assez de liquide.');
    S.cash -= c.cost;
    S.candidates = S.candidates.filter((x) => x !== c);
    c.role = role; c.drug = 'auto'; c.post = post; c.quota = c.quota || 100;
    S.crew.push(c);
    log('🤝', `<b>${c.name}</b> rejoint ton organisation : ${this.roleName(c)} (${TRAITS[c.trait].name}, talent ${c.skill}).`, 'good');
    UI.toast(`🤝 Nouvelle recrue : ${c.name}`);
  },
  roleName(m) { return m.role === 'soldier' ? 'soldat' : m.post === 'club' ? 'dealeur posté en boîte' : 'dealeur de rue'; },
  // libellé d'affectation affiché dans l'équipe
  jobLabel(m) {
    if (m.role === 'soldier') return '🛡️ Soldat';
    const where = m.post === 'club' ? '🪩 En boîte' : '🏙️ Rue';
    const what = m.drug && m.drug !== 'auto' && DRUGS[m.drug] ? `${DRUGS[m.drug].icon} ${DRUGS[m.drug].name}` : '🔄 stock général';
    return `${where} · ${what}${(m.quota || 100) < 100 ? ` · quota ${m.quota} %` : ''}`;
  },
  // produit à écouler : celui dont le stock vaut le plus cher
  pickDrug(pool) {
    return pool.filter((d) => Inventory.qty(d) > 0).sort((a, b) => Inventory.streetValue(b, Inventory.qty(b)) - Inventory.streetValue(a, Inventory.qty(a)))[0] || null;
  },
  // produit réellement vendu ce mois-ci par un dealeur
  drugOf(m) {
    const club = m.post === 'club' && PlayerData.clubs().length > 0;
    if (m.drug && m.drug !== 'auto' && DRUGS[m.drug]) return Inventory.qty(m.drug) > 0 ? m.drug : null;
    return this.pickDrug(club ? CLUB_DRUGS : Object.keys(DRUGS));
  },
  refresh() {
    if (S.cash < 200) return UI.toast('Il faut 200 € pour faire tourner le mot.');
    S.cash -= 200; S.candidates = this.genList(3); UI.toast('🔄 Nouveaux profils');
  },
  assign(id, role, drug = 'auto', post = 'street') {
    const m = this.get(id); if (!m) return;
    m.role = role; m.drug = role === 'soldier' ? 'auto' : drug; m.post = post;
    UI.toast(role === 'soldier' ? `🛡️ ${m.name} devient soldat` : `💊 ${m.name} : ${this.jobLabel(m)}`);
    UI.back();
  },
  setQuota(id, q) { const m = this.get(id); if (!m) return; m.quota = q; UI.toast(`📊 Quota de ${m.name} : ${q} %`); },
  praise(id) {
    const m = this.get(id); if (!m) return;
    const cost = 500 + S.rank * 1000;
    if (S.cash < cost) return UI.toast(`Il faut ${U.money(cost)} de prime.`);
    S.cash -= cost; m.loyalty = Math.min(100, m.loyalty + 15);
    S.crew.forEach((c) => { if (c !== m) c.loyalty = Math.min(100, c.loyalty + 2); });
    log('🤝', `Tu félicites ${m.name} devant tout le monde et lui glisses une prime de ${U.money(cost)}.`, 'good');
    UI.toast('🤝 Loyauté +15');
  },
  punish(id) {
    const m = this.get(id); if (!m) return;
    PlayerData.mod('respect', 1);
    if ((m.trait === 'violent' || m.trait === 'ambitieux') && U.chance(35)) {
      this.remove(m); PlayerData.mod('heat', 5);
      log('🚪', `Tu recadres ${m.name} violemment… qui claque la porte de l'organisation.`, 'bad');
      UI.result('🚪', 'Départ', `${m.name} n'a pas supporté la sanction et part avec rancune.`, 'bad');
    } else {
      m.loyalty = Math.min(100, m.loyalty + 10); m.skill = Math.max(5, m.skill - 2);
      S.crew.forEach((c) => { if (c !== m) c.loyalty = Math.min(100, c.loyalty + 3); });
      log('👊', `Tu recadres ${m.name} à coups de poing. Le message est passé dans toute l'équipe.`, '');
      UI.toast('👊 Loyauté +10 (par la peur)');
    }
  },
  fire(id) {
    const m = this.get(id); if (!m) return;
    UI.confirm('🚪', `Virer ${m.name} ?`, 'Un ex-membre mécontent peut parler…', '🚪 Virer', () => {
      this.remove(m);
      if (U.chance(m.loyalty < 40 ? 30 : 5)) { PlayerData.mod('heat', 15); log('🐀', `Après son renvoi, ${m.name} va raconter tes affaires aux flics (+15 🚨).`, 'bad'); }
      else log('🚪', `Tu vires ${m.name} de l'organisation.`, '');
    }, 'danger');
  },
  kill(id) {
    const m = this.get(id); if (!m) return;
    UI.confirm('☠️', `Éliminer ${m.name} ?`, 'Un exemple pour les autres. Respect ↑, police ↑↑.', '☠️ Faire le nécessaire', () => {
      this.remove(m); S.stats.kills++;
      PlayerData.mod('respect', 5); PlayerData.mod('heat', 20);
      S.crew.forEach((c) => { c.loyalty = Math.min(100, c.loyalty + 5); });
      log('☠️', `${m.name} a disparu. Plus personne n'osera te trahir. (+5 👑, +20 🚨)`, 'bad');
      UI.back();
      if (U.chance(10 * Police.level())) this.investigation();
    }, 'danger');
  },
  investigation() { log('🔎', 'La brigade criminelle remonte jusqu\'à toi pour le meurtre…', 'bad'); Actions.arrest({ charge: 'Homicide volontaire', months: 180 }); },
};

/* =============================== SHOP =============================== */
const Shop = {
  statLine(cat, it) {
    if (cat === 'vehicles') return `⚡ Vitesse ${it.speed} · 🕶️ Discrétion ${it.disc} · +${it.respect} 👑 · ${U.money(it.price * 0.004)}/mois`;
    if (cat === 'properties') return `📦 Planque ${U.num(it.cap)} · 🗄️ Coffre ${U.short(it.vault || 0)}${it.garage ? ` · 🅿️ ${it.garage} place${it.garage > 1 ? 's' : ''} de garage` : ''} · 🛡️ Sécurité ${it.sec} · +${it.respect} 👑 · charges ${U.money(it.upkeep)}/mois`;
    if (cat === 'weapons') return it.power ? `💥 Puissance de feu ${it.power}${Armory.mods(it.id).length ? ` · ⚙️ ${Armory.mods(it.id).map((m) => WEAPON_MODS[m].icon).join('')}` : ''}` : `🛡️ Protection ${it.armor}`;
    if (it.slot) return `${SLOTS[it.slot].icon} ${SLOTS[it.slot].label} · +${it.respect} respect`;
    return `+${it.respect} respect`;
  },
  isEquipped: (it) => !!it.slot && S.equip[it.slot] === it.id,
  equip(it) { S.equip[it.slot] = it.id; },
  bestFor(slot) { return PlayerData.items(SLOTS[slot].cat).filter((i) => i.slot === slot).sort((a, b) => b.respect - a.respect)[0] || null; },
  autoEquip(it) { const cur = PlayerData.equipped(it.slot); if (!cur || cur.respect <= it.respect) this.equip(it); },
  ownedMenu(cat, it) {
    if (!it.slot) return cat === 'weapons' && Armory.isGun(it.id) ? Armory.menu(it) : this.sell(cat, it);
    const eq = this.isEquipped(it);
    UI.modal({ icon: it.icon, title: it.name, text: `${this.statLine(cat, it)}${eq ? '<br><b class="g">✔ Porté actuellement</b>' : ''}`, choices: [
      { label: eq ? '🚫 Retirer' : '🪞 Porter', cls: 'primary', fn: () => { if (eq) delete S.equip[it.slot]; else this.equip(it); UI.toast(eq ? 'Retiré' : `${it.icon} Tu portes : ${it.name}`); } },
      { label: `💰 Revendre (${U.money(it.price * RESALE[cat])})`, cls: 'danger', fn: () => this.sell(cat, it) },
      { label: 'Fermer', cls: 'ghost' },
    ] });
  },
  buy(cat, it) {
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    const C = SHOP[cat];
    UI.pay({ icon: it.icon, title: it.name, text: this.statLine(cat, it), price: it.price, cashOnly: !!C.cashOnly,
      onPay: () => { S.owned[cat].push(it.id); if (it.slot) this.autoEquip(it); log(it.icon, `Achat : <b>${it.name}</b> (${U.money(it.price)}).`, 'money'); UI.toast(`${it.icon} ${it.name}${this.isEquipped(it) ? ' — porté' : ''}`); } });
  },
  sell(cat, it) {
    const v = Math.round(it.price * RESALE[cat]), toBank = cat === 'vehicles' || cat === 'properties';
    UI.confirm(it.icon, `Revendre ${it.name} ?`, `Prix de revente : <b>${U.money(v)}</b>${toBank ? ' (versé en banque)' : ' (en liquide)'}`, '💰 Revendre', () => {
      S.owned[cat] = S.owned[cat].filter((x) => x !== it.id);
      if (cat === 'weapons') delete S.mods[it.id];
      if (cat === 'properties') Vault.cleanup(); // l'argent planqué est récupéré avant la vente
      if (this.isEquipped(it)) { delete S.equip[it.slot]; const nb = this.bestFor(it.slot); if (nb) this.equip(nb); }
      if (toBank) S.bank += v; else S.cash += v;
      log('💰', `Tu revends ${it.name} pour ${U.money(v)}.`, 'money');
    }, 'danger');
  },
};

/* ============================== MONTHLY ============================== */
const Monthly = {
  jail() {
    if (S.jail <= 0) return;
    S.jail--; S.stats.jailMonths++; PlayerData.mod('heat', -5);
    if (S.jail === 0) Actions.release(); else Prison.monthly();
  },
  fitness() {
    if (!S.trained && S.force > 5) PlayerData.mod('force', -(S.roids > 0 ? 0.3 : 0.8));
    S.trained = false;
    if (S.roids > 0) {
      const dmg = S.roids / 15;
      if (dmg >= 1 && U.chance(35)) log('💔', 'Les stéroïdes abîment ton cœur et ton foie…', 'drug');
      PlayerData.hurt(dmg, 'Crise cardiaque (abus de stéroïdes)');
      S.roids = Math.max(0, S.roids - 8);
    }
  },
  addiction(consumed) {
    const a = S.addiction;
    if (!consumed) {
      if (a >= 25) {
        const dmg = Math.round(a / 12);
        log('🥶', `Crise de manque : sueurs, tremblements, insomnies… (−${dmg} ❤️)`, 'drug');
        PlayerData.mod('addiction', -3); PlayerData.mod('stress', 4);
        PlayerData.hurt(dmg, 'Complications d\'un sevrage brutal');
      } else if (a > 0) PlayerData.mod('addiction', -2.5);
    }
    if (!S.alive) return;
    if (a >= 60) { PlayerData.hurt(2, 'Organes détruits par la drogue'); if (U.chance(30)) log('🫀', 'Ton corps encaisse de plus en plus mal tes excès…', 'drug'); }
    if (S.alive && a >= 70 && !S.jail && U.chance((a - 60) / 2.5)) {
      log('🌀', 'Tu as craqué : une nuit de défonce totale, seul dans un squat…', 'drug');
      PlayerData.mod('addiction', 3);
      if (U.chance(35)) Actions.overdose(U.pick(['heroB', 'heroW', 'oxy', 'crack']), 2.5);
    }
  },
  health() {
    const y = S.ageMonths / 12;
    if (y > 40) PlayerData.hurt(y > 60 ? 0.7 : 0.25, 'Mort de vieillesse');
    if (S.alive && S.health < 75 && S.addiction < 40 && y < 55 && !S.wounded) PlayerData.heal(1.5);
    if (S.wounded && U.chance(25)) S.wounded = false;
  },
  stress() {
    let d = -3;
    if (S.jail) d += 3;
    if (S.heat > 60) d += 2;
    if (S.debts.some((x) => S.ageMonths > x.due)) d += 4;
    PlayerData.mod('stress', d);
    if (S.stress >= 80) {
      if (U.chance(40)) log('😰', 'Stress extrême : insomnies, palpitations, crises d\'angoisse… (−1 ❤️)', 'bad');
      PlayerData.hurt(1, 'Crise cardiaque (stress extrême)'); if (!S.alive) return;
    }
    if (S.tobacco > 0) { // le tabac abîme lentement la santé
      const t = Math.min(1.2, S.tobacco / 600);
      if (t >= 0.05) PlayerData.hurt(t, 'Cancer du poumon');
      if (t >= 0.8 && U.chance(12)) log('🚬', 'Toux grasse le matin, souffle court : le tabac laisse des traces.', 'bad');
      S.tobacco = Math.max(0, S.tobacco * 0.97 - 1);
    }
  },
  income() {
    if (S.rank === 0 && !S.jail) { PlayerData.earn(350); PlayerData.mod('heat', 0.5); log('👀', 'Le réseau te verse <b>350 €</b> pour avoir tenu le guet.', 'money'); }
    if (S.territories > 0) {
      const t = Math.round(S.territories * 1500 * (1 + S.rank * 0.3));
      PlayerData.earn(t);
      log('🏴', `Tes ${S.territories} territoire(s) rapportent <b>${U.money(t)}</b> (racket & points de deal).`, 'money');
    }
    if (S.rackets.length) {
      let tot = 0;
      for (const r of [...S.rackets]) {
        if (U.chance(4)) { S.rackets = S.rackets.filter((x) => x !== r); PlayerData.mod('heat', 8); log('📞', `Le commerce « ${r.name} » porte plainte pour racket et cesse de payer (+8 🚨).`, 'bad'); continue; }
        tot += r.amount;
      }
      if (tot) { PlayerData.earn(tot); log('🏪', `« Protection » versée par ${S.rackets.length} commerçant(s) : <b>+${U.money(tot)}</b>.`, 'money'); }
    }
  },
  crew() {
    if (!S.crew.length) return;
    let rev = 0, clubRev = 0, sold = 0, salaries = 0; const notes = [];
    const clubs = PlayerData.clubs().length, remote = Prison.remote(), cops = Police.bought();
    for (const m of [...S.crew]) {
      m.months++;
      let drift = m.trait === 'fidele' ? 0 : -1;
      if (PlayerData.respect() >= 60) drift += 1;
      if (S.jail) drift -= 1;
      m.loyalty = U.clamp(m.loyalty + drift, 0, 100);
      if (m.role === 'soldier') {
        if (S.cash >= SOLDIER_PAY) { S.cash -= SOLDIER_PAY; salaries += SOLDIER_PAY; }
        else { m.loyalty = U.clamp(m.loyalty - 10, 0, 100); notes.push(`${m.name} : salaire impayé`); }
      } else if (m.role === 'dealer') {
        const d = Crew.drugOf(m);
        if (!d) notes.push(`${m.name} attend de la marchandise`);
        else {
          const D = DRUGS[d], q = Inventory.q(d), club = m.post === 'club' && clubs > 0, cut = Inventory.cut(d);
          // en boîte : clientèle festive (CLUB_MULT), prix ×1,8 ; quota réglable par le patron
          const demand = club ? D.demand * (CLUB_MULT[d] || 0.2) * Math.min(2, clubs) * 0.8 : D.demand;
          const cap = Math.max(1, Math.round(demand * (0.35 + m.skill / 100) * (1 + 0.2 * S.territories) * (m.trait === 'bosseur' ? 1.25 : 1) * (m.quota || 100) / 100));
          const n = Inventory.remove(d, cap);
          if (m.loyalty < 20 && U.chance(35)) {
            this.crewLeave(m); PlayerData.mod('respect', -3);
            log('💸', `<b>${m.name}</b> a disparu avec la marchandise et la recette (${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)}) !`, 'bad');
            continue;
          }
          const r = Math.round(n * MarketData.retail(S.city, d, q) * (club ? 1.8 : 1) * 0.65 * (remote ? 1 : 0.5));
          rev += r; if (club) clubRev += r; sold += n;
          Actions.cutFallout(d, n, cut);
          m.skill = Math.min(99, m.skill + (m.trait === 'ambitieux' ? 1 : 0.4));
          if (q < 25) PlayerData.mod('respect', -0.5);
          const risk = club && cops ? 0 : (2 + S.heat / 15 + n * D.bulk / 250) * Police.level() * (club ? 0.6 : 1) * (D.risk || 1) * (m.trait === 'discret' ? 0.55 : 1) * (1 - m.skill / 200);
          if (U.chance(risk)) {
            this.crewLeave(m); PlayerData.mod('heat', 6);
            log('🚔', `<b>${m.name}</b> s'est fait serrer par la police (${CITIES[S.city].cops}) en plein deal${club ? ' dans ton club' : ''}.`, 'bad');
            if (U.chance((m.loyalty < 40 ? 50 : 8) * (m.trait === 'bavard' ? 2 : 1))) { PlayerData.mod('heat', 20); log('🐀', `En garde à vue, ${m.name} a balancé ton nom aux enquêteurs ! (+20 🚨)`, 'bad'); }
            continue;
          }
        }
      }
      if (m.loyalty <= 0) { this.crewLeave(m); log('🚪', `${m.name} quitte ton organisation (loyauté à zéro).`, 'bad'); }
    }
    if (rev > 0) { PlayerData.earn(rev); S.stats.sold += rev; log('🧑‍🤝‍🧑', `Ton équipe a écoulé ${U.num(sold)} unités → <b>+${U.money(rev)}</b> pour toi (après leur part)${clubRev ? `, dont ${U.money(clubRev)} en boîte` : ''}${remote ? '' : ' — sans téléphone, tes hommes se servent largement'}.`, 'money'); }
    if (salaries) log('🛡️', `Paie des soldats : −${U.money(salaries)}.`, '');
    if (notes.length) log('📋', notes.join(' · ') + '.', '');
  },
  crewLeave(m) { S.crew = S.crew.filter((x) => x !== m); },
  labs() {
    if (!S.labs.length) return;
    const out = [];
    for (const l of [...S.labs]) {
      const L = LABS[l.type];
      if (!PlayerData.pay(Math.round(L.upkeep * (1 + (l.level - 1) * 0.5)))) { out.push(`${L.icon} à l'arrêt (frais impayés)`); continue; }
      Labs.produce(l, out);
      if (L.boom && U.chance(L.boom)) { S.labs = S.labs.filter((x) => x !== l); PlayerData.mod('heat', 10); log('💥', `EXPLOSION ! Ton laboratoire (${L.name}) est parti en fumée.`, 'bad'); continue; }
      if (U.chance(L.risk * (1 + S.heat / 40) * Police.level())) { S.labs = S.labs.filter((x) => x !== l); PlayerData.mod('heat', 12); log('🚨', `La police a démantelé ton laboratoire : ${L.name} !`, 'bad'); }
    }
    if (out.length) log('🧪', 'Production des labos : ' + out.join(' · '), 'drug');
  },
  business() {
    if (!S.businesses.length) return;
    const cap = S.businesses.reduce((a, b) => a + BUSINESSES[b.type].cap, 0);
    const target = S.launderTarget == null ? cap : Math.min(S.launderTarget, cap);
    const remote = Prison.remote(); // sans téléphone en cellule, personne ne fait tourner le blanchiment
    const amt = remote ? Math.floor(Math.min(target, S.cash)) : 0;
    const income = S.businesses.reduce((a, b) => a + (BUSINESSES[b.type].strip ? Strip.legalIncome(Strip.ensure(b)) : BUSINESSES[b.type].income), 0);
    S.bank += income;
    if (amt > 0) { S.cash -= amt; S.bank += Math.round(amt * (1 - LAUNDER_FEE)); }
    log('🧼', `Tes commerces : ${amt > 0 ? `<b>${U.money(amt)}</b> blanchis (−15 % de commission) · ` : remote ? '' : 'blanchiment suspendu (aucun contact depuis ta cellule) · '}bénéfices légaux +${U.money(income)}.`, 'money');
    if (amt > cap * 0.9 && U.chance(6)) { PlayerData.mod('heat', 6); log('🧾', 'La cellule anti-blanchiment s\'interroge sur le chiffre d\'affaires de tes commerces (+6 🚨).', 'bad'); }
  },
  upkeep() {
    const cost = PlayerData.items('properties').reduce((a, p) => a + p.upkeep, 0) + PlayerData.items('vehicles').reduce((a, v) => a + Math.round(v.price * 0.004), 0);
    if (!cost) return;
    const unpaid = PlayerData.charge(cost);
    if (unpaid > 0) {
      S.unpaid++;
      log('⚠️', `Charges impayées (${U.money(unpaid)}) : loyers, assurances, entretien… (${S.unpaid}/3 avant saisie)`, 'bad');
      if (S.unpaid >= 3) {
        const all = [...PlayerData.items('properties').map((i) => ['properties', i]), ...PlayerData.items('vehicles').map((i) => ['vehicles', i])].sort((a, b) => b[1].price - a[1].price);
        if (all.length) { const [cat, it] = all[0]; S.owned[cat] = S.owned[cat].filter((x) => x !== it.id); log('⚖️', `Les huissiers saisissent ton bien : <b>${it.name}</b>.`, 'bad'); Vault.cleanup(); }
        S.unpaid = 0;
      }
    } else { S.unpaid = 0; log('🧾', `Charges du mois (logements, véhicules) : −${U.money(cost)}.`, ''); }
  },
  imports() {
    for (const im of [...S.imports]) {
      if (im.arrive > S.ageMonths) continue;
      S.imports = S.imports.filter((x) => x !== im);
      const D = DRUGS[im.d], F = CITIES[im.from];
      if (U.chance(im.risk)) { PlayerData.mod('heat', 8); log('🛃', `Saisie douanière ! Ta cargaison de ${U.num(im.qty)} ${U.u(D, U.num(im.qty))} ${U.de(D.name)} en provenance de ${F.name} a été interceptée.`, 'bad'); }
      else { Inventory.add(im.d, im.qty, im.q, im.b); log('📦', `Livraison reçue : <b>${U.num(im.qty)} ${U.u(D, U.num(im.qty))}</b> ${U.de(D.name)} (Q${im.q}) depuis ${F.flag} ${F.name}.`, 'good'); }
    }
  },
  debts() {
    for (const d of [...S.debts]) {
      if (d.rate) d.amount = Math.round(d.amount * (1 + d.rate));
      if (S.ageMonths <= d.due) {
        if (d.due - S.ageMonths === 1) log('📞', `${d.lender} : « N'oublie pas, tu me dois ${U.money(d.amount)} le mois prochain. »`, 'bad');
        continue;
      }
      d.overdue++;
      const take = Math.min(S.cash, d.amount);
      S.cash -= take; d.amount -= take;
      const dmg = Math.round(U.ri(12, 28) * (1 - PlayerData.armor() / 200));
      log('🩸', `Les hommes de ${d.lender} te tombent dessus pour ta dette : ils prennent ${U.money(take)} et te passent à tabac (−${dmg} ❤️).`, 'bad');
      if (d.amount <= 0) { S.debts = S.debts.filter((x) => x !== d); log('✅', `Ta dette envers ${d.lender} est soldée… de force.`, ''); }
      PlayerData.hurt(dmg, `Battu à mort par les recouvreurs de ${d.lender}`);
      if (!S.alive) return;
      if (d.amount > 0 && d.overdue >= 4 && U.chance(Math.max(5, 30 - PlayerData.soldiers().length * 3))) return Game.die(`Exécuté pour une dette impayée envers ${d.lender}`);
    }
  },
  heat() {
    let d = -3 - PlayerData.security() / 30;
    const b = Inventory.bulk();
    if (b > 500) d += Math.min(5, b / 2000);
    d += S.crew.length * 0.25 + S.territories * 0.8;
    if (PlayerData.possessionRespect() > 20) d += 1;
    PlayerData.mod('heat', d);
    if (b > PlayerData.capacity()) log('📦', `Ta planque déborde (${U.num(b)}/${U.num(PlayerData.capacity())}) : risque de descente accru !`, 'bad');
    if (S.respect > 60) S.respect -= 0.3;
  },
  audit() {
    if (S.jail || S.exile) return;
    const lux = PlayerData.items('jewelry').reduce((a, i) => a + i.price, 0) + PlayerData.items('vehicles').reduce((a, i) => a + i.price, 0)
      + PlayerData.items('clothes').reduce((a, i) => a + i.price, 0) + PlayerData.items('properties').filter((x) => !x.stash).reduce((a, i) => a + i.price, 0);
    const declared = S.bank + S.businesses.reduce((a, b) => a + BUSINESSES[b.type].income, 0) * 12 + (S.job ? Jobs.salary(Jobs.cur()) * 12 : 0);
    const shield = (S.partner && S.partner.complicit) ? 0.5 : 1;
    if (lux < 120000 || lux < declared * 2.2) return;
    if (!U.chance((5 + (S.businesses.length ? 0 : 5)) * shield)) return;
    const fine = Math.round(Math.min(S.bank, lux * U.rand(0.08, 0.2)));
    S.bank -= fine;
    let seized = '';
    if (U.chance(40)) { const cat = U.chance(50) ? 'vehicles' : 'jewelry'; const it = PlayerData.items(cat).sort((a, b) => b.price - a.price)[0]; if (it) { S.owned[cat] = S.owned[cat].filter((x) => x !== it.id); seized = ` Saisie : ${it.name}.`; } }
    log('🧾', `Contrôle fiscal : train de vie disproportionné par rapport aux revenus déclarés. Redressement de <b>${U.money(fine)}</b>.${seized}`, 'bad');
    UI.modal({ icon: '🧾', title: 'Contrôle fiscal', cls: 'bad', text: `Ton train de vie (${U.money(lux)}) dépasse largement tes revenus officiels. Redressement : <b>${U.money(fine)}</b>.${seized}<br><small class="m">Astuce : des commerces écrans et une partenaire complice réduisent le risque.</small>`, choices: [{ label: 'Encaisser' }] });
  },
  refresh() {
    MarketData.monthly();
    if (S.ageMonths % 2 === 0 || !S.candidates.length) S.candidates = Crew.genList(3);
    S.gofasts = GoFast.gen();
    S.rivals.forEach((r) => { r.strength += 0.6; });
    if (S.rivals.length < 3 && U.chance(5)) S.rivals.push(Game.rival(U.ri(80, 260), U.ri(1, 3)));
  },
  naturalDeath() {
    const y = S.ageMonths / 12;
    if (y >= 60 && U.chance(Math.pow((y - 55) / 30, 3) * 2.5)) return Game.die('Mort de vieillesse');
    if (S.health < 10 && U.chance(8)) Game.die('Santé trop dégradée');
  },
};

/* =============================== EVENTS =============================== */
const Events = {
  monthly() {
    if (S.jail > 0) { if (U.chance(65)) Prison.event(); return; }
    if (this.raidCheck()) return;
    if (!U.chance(60)) return;
    const pool = this.pool.filter((e) => !e.cond || e.cond());
    const tot = pool.reduce((a, e) => a + (typeof e.w === 'function' ? e.w() : e.w), 0);
    let r = Math.random() * tot;
    for (const e of pool) { r -= typeof e.w === 'function' ? e.w() : e.w; if (r <= 0) { e.run(); return; } }
  },
  raidCheck() {
    const over = Inventory.bulk() > PlayerData.capacity() ? 10 : 0;
    const p = (Math.max(0, S.heat - 20) / 4 + over) * Police.level() * (1 - PlayerData.security() / 150);
    if (!U.chance(p)) return false;
    this.raid(); return true;
  },
  raid() {
    const sec = PlayerData.security();
    const value = Inventory.seize(U.clamp(U.rand(0.5, 1) * (1 - sec / 200), 0, 1));
    const cashLoss = Math.round(S.cash * U.clamp(U.rand(0.3, 0.9) * (1 - sec / 200), 0, 1));
    S.cash -= cashLoss;
    const stash = Vault.raid();
    // arsenal : saisie partielle, moitié moins si une partie dort dans l'arrière-salle d'un strip club
    const arms = Arsenal.seize(U.rand(0.3, 0.6) * (1 - sec / 100) * (Strip.list().length ? 0.5 : 1));
    let guns = '';
    if (PlayerData.firepower() > 0 && U.chance(60)) {
      S.owned.weapons = S.owned.weapons.filter((id) => SHOP.weapons.items.find((w) => w.id === id).armor);
      for (const id in S.mods) if (!S.owned.weapons.includes(id)) delete S.mods[id];
      guns = ' Tes armes sont confisquées.';
    }
    const extra = `${stash ? ` Une planque est découverte : ${U.money(stash)} saisis.` : ''}${arms ? ` ${arms} arme${arms > 1 ? 's' : ''} de l'arsenal saisie${arms > 1 ? 's' : ''}.` : ''}${guns}`;
    PlayerData.mod('heat', -15); PlayerData.mod('stress', 15);
    const arrestP = 30 + (value > 0 ? 25 : 0) + (arms > 20 ? 10 : 0) - sec / 3;
    log('🚨', `DESCENTE DE POLICE ! Saisie : marchandise (~${U.money(value)}) et ${U.money(cashLoss)} en liquide.${extra}`, 'bad');
    UI.modal({ icon: '🚨', title: 'Descente de police !', cls: 'bad',
      text: `6 h du matin. La porte vole en éclats. ${value > 0 ? `Les enquêteurs saisissent ta marchandise (~${U.money(value)})` : 'Ils retournent tout l\'appartement'} et ${U.money(cashLoss)} en liquide.${extra}`,
      choices: [{ label: 'Encaisser le coup', fn: () => { if (U.chance(arrestP)) Actions.arrest({ charge: arms > 20 ? 'Trafic de stupéfiants et détention d\'armes de guerre' : 'Détention et trafic de stupéfiants', months: Actions.drugMonths(value) + 2 + (arms > 20 ? 12 : 0) }); else log('😮‍💨', 'Garde à vue de 48 h… puis libération faute de preuves suffisantes.', ''); } }] });
  },
  pool: [
    { w: 10, run: () => Events.altercation() },
    { w: 8, run: () => Events.marketShock() },
    { w: () => (4 + S.territories * 3 + (PlayerData.respect() > 40 ? 3 : 0)) * (1 - Arsenal.deter()), cond: () => PlayerData.respect() > 25 || S.territories > 0, run: () => Events.hit() },
    { w: 6, cond: () => S.crew.some((c) => c.loyalty < 35), run: () => Events.snitch() },
    { w: 3, cond: () => PlayerData.respect() > 35, run: () => Events.rapper() },
    { w: 4, run: () => Events.wallet() },
    { w: 6, cond: () => S.cash > 200, run: () => Events.oldFriend() },
    { w: 5, cond: () => !PlayerData.items('properties').some((p) => !p.stash) && Inventory.bulk() > 0, run: () => Events.mom() },
    { w: 4, cond: () => S.heat > 40, run: () => Events.dirtyCop() },
    { w: 3, cond: () => S.bank > 50000 && S.heat > 25, run: () => Events.taxAudit() },
    { w: 4, cond: () => S.crew.length > 0, run: () => Events.raise() },
    { w: 3, cond: () => S.ageMonths > 12 * 35, run: () => Events.sick() },
    { w: 4, cond: () => S.cash > 1500, run: () => Events.party() },
    { w: 4, cond: () => (S.cash > 5000 || Vault.total() > 20000) && PlayerData.security() < 30, run: () => Events.burglary() },
    { w: 2, cond: () => S.rank >= 2, run: () => Events.journalist() },
    { w: 3, cond: () => S.rank >= 2, run: () => Events.cartelOffer() },
    { w: 4, cond: () => PlayerData.dealers().some((c) => Crew.drugOf(c)), run: () => Events.dealerRobbed() },
    { w: () => 5 * Police.level(), cond: () => PlayerData.items('vehicles').length > 0 && Inventory.bulk() > 30, run: () => Events.roadCheck() },
    { w: () => 3 + S.roids / 10, cond: () => S.roids > 25, run: () => Events.roidRage() },
  ],
  altercation() {
    const why = U.pick(['te bouscule devant le kebab', 'te traite de balance devant tout le quartier', 'te fixe avec un sourire provocateur', 'crache sur tes baskets neuves']);
    UI.modal({ icon: '😤', title: 'Altercation de rue', text: `Un type ${why} et te cherche ouvertement.`, choices: [
      { label: '👊 Lui mettre une droite', sub: `Combat à mains nues · victoire ~${Combat.estimate('provoc', { arms: 'fists' })} %`, fn: () => Combat.start({ foe: 'provoc', ctx: { arms: 'fists', flee: 55, place: 'Altercation de rue', intro: '« Vas-y, montre-moi ce que tu vaux ! »' },
        onEnd: (res) => {
          if (res === 'win') { PlayerData.mod('respect', 3); log('👊', 'Altercation : tu mets le provocateur au sol. Le quartier a vu (+3 👑).', 'good'); }
          else if (res === 'lose') { PlayerData.mod('respect', -2); log('🤕', 'Altercation : tu te prends une raclée devant tout le monde (−2 👑).', 'bad'); }
          else { PlayerData.mod('respect', -1); log('🏃', 'Altercation : tu battes en retraite (−1 👑).', ''); }
        } }) },
      { label: '🔫 Sortir ton arme', dis: PlayerData.firepower() < 15, sub: PlayerData.firepower() < 15 ? 'Il te faut une arme à feu' : '+5 respect, +8 🚨', fn: () => {
        PlayerData.mod('respect', 5); PlayerData.mod('heat', 8);
        log('🔫', 'Tu sors ton arme : le type détale en courant. (+5 👑, +8 🚨)', 'good');
        if (U.chance(20)) { PlayerData.mod('heat', 10); log('📱', 'Quelqu\'un a filmé la scène et la vidéo tourne sur les réseaux… (+10 🚨)', 'bad'); }
      } },
      { label: '🚶 Laisser couler', fn: () => { PlayerData.mod('respect', -2); log('🚶', 'Tu laisses couler. Certains y voient de la faiblesse (−2 👑).', ''); } },
    ] });
  },
  hit() {
    PlayerData.mod('stress', 8);
    const rv = S.rivals.length ? U.pick(S.rivals).name : 'des inconnus', armed = PlayerData.firepower() >= 15;
    UI.modal({ icon: '🏍️', title: 'Règlement de compte !', cls: 'bad', text: `Deux hommes cagoulés sur une moto ralentissent à ta hauteur… Envoyés par <b>${rv}</b>. Des coups de feu éclatent !`, choices: [
      { label: '🔫 Riposter', dis: !armed, sub: armed ? `Combat armé à mort · victoire ~${Combat.estimate('tueur', { arms: 'all' })} %` : 'Il te faut une arme à feu', fn: () => Combat.start({ foe: 'tueur', over: { role: `Sicaire (${rv})` },
        ctx: { arms: 'all', lethal: true, flee: 40, place: 'Règlement de compte', cause: `Abattu lors d'un règlement de compte (${rv})`, intro: 'Le passager de la moto braque son arme sur toi. Tu dégaines à ton tour.' },
        onEnd: (res) => {
          if (res === 'win') { PlayerData.mod('respect', 6); log('🔫', `Règlement de compte : tu abats le tueur envoyé par ${rv} (+6 👑).`, 'good'); UI.result('🔫', 'Riposte', 'Le tueur gît sur le bitume. Le quartier ne parle que de toi. +6 👑', 'good'); }
          else if (res === 'fled') log('🏃', 'Règlement de compte : tu parviens à t\'échapper entre les voitures.', '');
        } }) },
      { label: '🏃 Plonger et fuir', sub: `~${Math.min(95, 45 + PlayerData.soldiers().length * 4)} % de s'en sortir indemne`, fn: () => this.hitResolve(rv) },
    ] });
  },
  hitResolve(rv) {
    const prot = PlayerData.soldiers().length * 4;
    if (U.chance(45 + prot)) { log('🏃', 'Règlement de compte : tu échappes aux balles de justesse.', ''); UI.result('🏃', 'Sauvé', 'Tu plonges derrière une voiture. Les balles sifflent… mais aucune ne te touche.', 'good'); return; }
    const dmg = Math.round(U.ri(20, 65) * (1 - PlayerData.armor() / 130));
    S.wounded = true;
    log('🩸', `Règlement de compte : touché par balle (−${dmg} ❤️).`, 'bad');
    PlayerData.hurt(dmg, `Abattu lors d'un règlement de compte (${rv})`);
    if (S.alive) UI.result('🩸', 'Touché !', `Une balle t'atteint. −${dmg} ❤️. Fais-toi soigner vite.`, 'bad');
  },
  marketShock() {
    const city = U.chance(60) ? S.city : U.pick(Object.keys(CITIES)), d = U.pick(Object.keys(DRUGS)), up = U.chance(50);
    const mult = up ? U.rand(1.4, 1.9) : U.rand(0.5, 0.7);
    MarketData.shock(city, d, mult);
    const C = CITIES[city], D = DRUGS[d];
    const txt = up
      ? U.pick([`Grosse saisie au port : pénurie ${U.de(D.name)} à ${C.name}`, `Les douanes frappent fort : ${D.name} introuvable à ${C.name}`, `Guerre de gangs à ${C.name} : ${D.name} en rupture`])
      : U.pick([`Le marché de ${C.name} est inondé ${U.de(D.name)}`, `Un nouveau réseau casse les prix à ${C.name} (${D.name})`, `Arrivage massif à ${C.name} (${D.name})`]);
    log(up ? '📈' : '📉', `Marché noir : ${txt} → prix ${up ? '+' : ''}${Math.round((mult - 1) * 100)} %.`, 'info');
  },
  snitch() {
    const m = S.crew.slice().sort((a, b) => a.loyalty - b.loyalty)[0];
    UI.modal({ icon: '🐀', title: 'Une balance ?', text: `Des rumeurs disent que <b>${m.name}</b> parlerait aux flics…`, choices: [
      { label: '☠️ Régler le problème définitivement', fn: () => { Crew.remove(m); S.stats.kills++; PlayerData.mod('respect', 5); PlayerData.mod('heat', 10); log('☠️', `${m.name} ne parlera plus jamais. (+5 👑, +10 🚨)`, 'bad'); } },
      { label: '💶 Acheter son silence (3 000 €)', dis: S.cash < 3000, fn: () => { S.cash -= 3000; m.loyalty = Math.min(100, m.loyalty + 30); log('💶', `Tu achètes la loyauté de ${m.name} (+30).`, ''); } },
      { label: '🤷 Ignorer les rumeurs', fn: () => { if (U.chance(60)) { PlayerData.mod('heat', 18); log('🐀', `${m.name} était bien une balance ! (+18 🚨)`, 'bad'); } else log('🤷', 'Fausse rumeur, apparemment.', ''); } },
    ] });
  },
  rapper() { PlayerData.mod('respect', 4); PlayerData.mod('heat', 3); log('🎤', 'Un rappeur local cite ton nom dans son dernier son. Il tourne en boucle dans le quartier. (+4 👑, +3 🚨)', 'good'); },
  wallet() {
    const n = U.ri(150, 900);
    UI.modal({ icon: '👛', title: 'Portefeuille trouvé', text: `Tu trouves un portefeuille par terre avec <b>${U.money(n)}</b> en liquide et une carte d'identité.`, choices: [
      { label: '💵 Garder l\'argent', fn: () => { S.cash += n; log('👛', `Tu gardes les ${U.money(n)} du portefeuille.`, 'money'); } },
      { label: '📮 Le rendre à son propriétaire', fn: () => { PlayerData.heal(3); PlayerData.mod('heat', -2); log('📮', 'Tu rends le portefeuille. Ça fait du bien de faire une bonne action. (+3 ❤️)', 'good'); } },
    ] });
  },
  oldFriend() {
    const d = U.pick(['coke', 'weed', 'hash', 'mdma', 'oxy', 'benzo', 'keta']), D = DRUGS[d];
    const qty = Math.max(5, Math.round(D.demand * U.rand(0.5, 1.5)));
    const price = Math.round(MarketData.buyUnit(S.city, d) * qty * 0.5), q = U.ri(5, 95);
    const fits = Inventory.bulk() + qty * D.bulk <= PlayerData.capacity();
    UI.modal({ icon: '🤝', title: 'Le plan d\'un vieux pote', text: `Un ami d'enfance te propose <b>${qty} ${U.u(D, qty)}</b> ${U.de(D.name)} pour <b>${U.money(price)}</b> (moitié prix). Qualité inconnue…`, choices: [
      { label: '💵 Acheter le lot', sub: !fits ? 'Planque trop petite' : '', dis: S.cash < price || !fits, fn: () => {
        S.cash -= price; Inventory.add(d, qty, q);
