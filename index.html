    h += H.row({ icon: '🏦', title: 'Banque & Usurier', sub: 'Retraits, dépôts, prêts, dettes', fn: () => UI.open('finance') });
    return { title: '🕴️ Mafia & Business', html: h };
  },
  hierarchy() {
    let h = '';
    RANKS.forEach((rk, i) => {
      const st = i < S.rank ? '✅' : i === S.rank ? '📍' : '🔒';
      h += H.row({ icon: rk.icon, title: `${st} ${rk.name}`, cls: i === S.rank ? 'hl' : '', sub: `${i ? `Respect ${rk.respect} · gains ${U.money(rk.earned)}${rk.terr ? ` · ${rk.terr} territoire(s)` : ''}<br>` : ''}${rk.perks.join(' · ')}` });
    });
    const nx = S.rank + 1;
    if (RANKS[nx]) {
      const req = Actions.reqs(nx), ok = req.every((x) => x.ok);
      h += H.sec(`Pour devenir ${RANKS[nx].name}`);
      h += H.card(req.map((x) => `${x.ok ? '✅' : '❌'} ${x.label}`).join('<br>') + `<br><small class="m">Tes gains criminels : ${U.money(S.earned)} · Respect : ${PlayerData.respect()}</small>`);
      h += H.row({ icon: '🎖️', title: 'Demander une promotion', sub: ok ? 'Toutes les conditions sont réunies !' : 'Conditions non remplies', dis: !ok, cls: ok ? 'hl' : '', fn: () => Actions.promote() });
    }
    return { title: '🎖️ Hiérarchie', html: h };
  },
  crew() {
    let h = H.note(`Les dealeurs écoulent ton stock chaque mois (ils gardent 35 %). Les soldats te protègent et combattent (${U.money(SOLDIER_PAY)}/mois).`);
    if (!S.crew.length) h += H.note('Aucun membre. Recrute des sous-fifres !');
    for (const m of S.crew) {
      const job = m.role === 'soldier' ? '🛡️ Soldat' : m.drug ? `${DRUGS[m.drug].icon} ${DRUGS[m.drug].name}` : '💤 Sans affectation';
      h += H.row({ icon: TRAITS[m.trait].icon, title: m.name, sub: `${job} · talent ${Math.round(m.skill)} · loyauté <span class="${m.loyalty < 35 ? 'r' : m.loyalty < 60 ? 'y' : 'g'}">${Math.round(m.loyalty)}</span>`, fn: () => UI.open('member', m.id) });
    }
    return { title: '🧑‍🤝‍🧑 Mon équipe', html: h };
  },
  member(id) {
    const m = Crew.get(id); if (!m) return V.crew();
    const T = TRAITS[m.trait];
    let h = H.card(`<div class="big">${T.icon} ${m.name}</div><small class="m">${T.name} — ${T.desc} · depuis ${U.dur(m.months)}</small>

    h += H.sec('Affectation');
    h += H.row({ icon: m.role === 'soldier' ? '🛡️' : '💊', title: m.role === 'soldier' ? 'Soldat (protection)' : m.drug ? `Vend : ${DRUGS[m.drug].name}` : 'Sans affectation', sub: 'Changer d\'affectation', fn: () => UI.open('assign', id) });
    h += H.sec('Gestion');
    h += H.row({ icon: '🤝', title: 'Féliciter (prime)', sub: `+15 loyauté · ${U.money(500 + S.rank * 1000)}`, fn: () => Crew.praise(id) });
    h += H.row({ icon: '👊', title: 'Sanctionner', sub: 'Recadrage physique : loyauté par la peur (risque de départ)', fn: () => Crew.punish(id) });
    h += H.row({ icon: '🚪', title: 'Virer', sub: 'Risque qu\'il ou elle parle à la police', fn: () => Crew.fire(id) });

  },
  assign(id) {
    const m = Crew.get(id); if (!m) return V.crew();

    for (const d in DRUGS) {
      const D = DRUGS[d];
      h += H.row({ icon: D.icon, title: D.name, sub: `En stock : ${U.num(Inventory.qty(d))} ${D.unit}`, cls: m.role === 'dealer' && m.drug === d ? 'hl' : '', fn: () => Crew.assign(id, 'dealer', d) });

  recruit() {
    const max = Crew.max();

  },

    let h = '';

  },

    let h = H.card(`🧼 Capacité totale : <b>${U.money(cap)}/mois</b><br>Objectif actuel : <b>${S.launderTarget == null ? 'maximum' : U.money(S.launderTarget)}</b><br><small class="m">Chaque mois, ce montant est prélevé sur ton liquide et crédité en banque (−15 % de commission). L'argent en banque est à l'abri des descentes et sert à acheter l'immobilier et le luxe sans éveiller les soupçons.</small>`, 'accent');
    if (!cap) return { title: '🧼 Blanchiment', html: h + H.note('Aucun commerce : rachète une façade dans « Clubs & Entreprises ».') };
    h += H.sec('Objectif mensuel');
    [[null, 'Maximum'], [0, 'Suspendre'], [Math.round(cap * 0.25), '25 %'], [Math.round(cap * 0.5), '50 %'], [Math.round(cap * 0.75), '75 %']].forEach(([v, l]) => {
      h += H.row({ icon: v === 0 ? '⏸️' : '🧼', title: l, sub: v == null ? U.money(cap) + '/mois' : U.money(v) + '/mois', cls: S.launderTarget === v ? 'hl' : '', fn: () => Actions.setLaunder(v) });
    });

    return { title: '🧼 Blanchiment', html: h };
  },
  finance() {
    let h = H.card(H.kv([['💵 Liquide', U.money(S.cash)], ['🏦 Banque', U.money(S.bank)], ['💸 Dettes', U.money(PlayerData.debt())], ['📈 Valeur nette', U.money(PlayerData.netWorth())]]));
    h += H.sec('Banque');
    h += H.row({ icon: '🏧', title: 'Retirer du liquide', sub: 'Banque → liquide', fn: () => Actions.withdraw() });
    h += H.row({ icon: '🏦', title: 'Dépôt discret', sub: `Liquide → banque, max 1 500 €/mois (reste ${U.money(Math.max(0, 1500 - S.deposit))})`, fn: () => Actions.deposit() });
    if (S.debts.length) {
      h += H.sec('Mes dettes');
      for (const d of S.debts) {
        const left = d.due - S.ageMonths;
        h += H.row({ icon: '💸', title: d.lender, sub: `${d.rate ? Math.round(d.rate * 100) + ' %/mois · ' : ''}${left >= 0 ? `échéance dans ${left} mois` : `<span class="r">EN RETARD (${d.overdue} mois)</span>`}`, right: `<span class="r">${U.money(d.amount)}</span>`, fn: () => Actions.repay(d.id) });
      }
    }
    h += H.sec('Usuriers & prêteurs');
    for (const L of LOANS) {
      const has = S.debts.some((d) => d.lender === L.lender), lock = PlayerData.respect() < L.respect;
      h += H.row({ icon: '🤝', title: L.lender, sub: `${Math.round(L.rate * 100)} %/mois · ${L.months} mois${lock ? ` · 🔒 respect ${L.respect}` : ''}${has ? ' · déjà endetté' : ''}`, right: U.money(L.amount), dis: lock || has, fn: () => Actions.borrow(L.id) });

  /* ---------- Onglet 4 : Achats & Patrimoine ---------- */
  assets() {
    let h = H.card(`${H.kv([['📈 Valeur nette', U.money(PlayerData.netWorth())], ['👑 Respect (biens)', `+${PlayerData.possessionRespect()}`], ['📦 Planque', U.num(PlayerData.capacity())], ['🛡️ Sécurité', PlayerData.security()], ['💥 Puissance de feu', PlayerData.firepower()], ['🦺 Protection', PlayerData.armor()]])}<small class="m">Logement : ${PlayerData.home().icon} ${PlayerData.home().name}</small>`, 'accent');

        fn: () => (own ? Shop.sell(cat, it) : Shop.buy(cat, it)) });

  stats() {
    const s = S.stats;
    const h = H.card(H.kv([
      ['Âge', U.age(S.ageMonths)], ['Grade', `${RANKS[S.rank].icon} ${RANKS[S.rank].name}`],
      ['Valeur nette', U.money(PlayerData.netWorth())], ['Fortune max.', U.money(s.maxWorth)],
      ['Gains criminels', U.money(S.earned)], ['Ventes de drogue', U.money(s.sold)],
      ['Achats de drogue', U.money(s.bought)], ['Crimes commis', s.crimes],
      ['Arrestations', s.arrests], ['Temps en prison', U.dur(s.jailMonths)],
      ['Casier', `${S.record} condamnation(s)`], ['Victimes', s.kills],
      ['Guerres menées', s.wars], ['Territoires', S.territories],
      ['Doses consommées', s.doses], ['Overdoses', s.ods],

  settings() {
    let h = H.card('💾 La partie est <b>sauvegardée automatiquement</b> dans ton navigateur (localStorage) après chaque action et chaque mois.');

    h += H.note('Crime Life est une œuvre de fiction. Aucune incitation à la consommation de drogues ni à la commission de crimes. Besoin d\'aide face à une addiction ? En France : Drogues Info Service, 0 800 23 13 13 (gratuit, anonyme).');
    return { title: '⚙️ Paramètres', html: h };
  },
};

/* ================================ GAME ================================ */
const Game = {
  rival(strength, terr) { return { id: U.uid(), name: U.pick(RIVAL_NAMES), strength, terr }; },
  genRivals() {
    const names = U.shuffle(RIVAL_NAMES).slice(0, 5);
    return [[50, 1], [85, 2], [130, 3], [200, 4], [320, 6]].map(([s, t], i) => ({ id: U.uid(), name: names[i], strength: s, terr: t }));
  },
  create(name, avatar, city) {
    S = PlayerData.blank(name, avatar, city);
    S.market = MarketData.init();
    S.rivals = this.genRivals();
    S.candidates = Crew.genList(3);
    S.gofasts = GoFast.gen();
    log('👶', CITIES[city].intro, 'info');
    log('🎂', `Tu as <b>18 ans</b>. Poche : ${U.money(S.cash)}. La rue t'appelle.`, 'info');
    log('💡', 'Astuce : achète un peu de marchandise en gros (onglet Trafic), revends-la au détail, et appuie sur <b>+1 mois</b> pour avancer.', '');
    UI.stack = []; UI.tab = null; UI._seq = -1;
    this.commit();
  },
  newLifeScreen() {
    const reg = NAMES.fr;
    let name = `${U.pick(reg.first)} ${U.pick(reg.last)}`, avatar = U.pick(AVATARS), city = 'marseille';
    UI.queue = []; UI.cur = null;
    const html = `<div class="form">
      <label>Nom</label><input type="text" id="ng-name" maxlength="28" value="${U.esc(name)}">
      <label>Apparence</label><div class="picks" id="ng-av">${AVATARS.map((a) => `<button type="button" class="pick av ${a === avatar ? 'sel' : ''}" data-v="${a}">${a}</button>`).join('')}</div>
      <label>Ville de départ</label><div class="picks" id="ng-city">${Object.keys(CITIES).map((c) => `<button type="button" class="pick ${c === city ? 'sel' : ''}" data-v="${c}">${CITIES[c].flag} ${CITIES[c].name}</button>`).join('')}</div>
      <div class="disclaimer">Œuvre de fiction. Aucune incitation à la consommation ni au crime.</div></div>`;
    UI.showModal({ force: true, title: '<span class="logo">CRIME LIFE</span>', text: 'De guetteur à parrain. Chaque mois compte. Chaque choix se paie.', html,
      choices: [{ label: '▶ Commencer ma vie', cls: 'primary', fn: () => this.create((name || '').trim() || 'Anonyme', avatar, city) }],
      onShow: (root) => {
        root.querySelector('#ng-name').addEventListener('input', (e) => { name = e.target.value.slice(0, 28); });
        const group = (sel, set) => root.querySelectorAll(`${sel} .pick`).forEach((b) => b.addEventListener('click', () => {
          root.querySelectorAll(`${sel} .pick`).forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); set(b.dataset.v);
        }));
        group('#ng-av', (v) => { avatar = v; });
        group('#ng-city', (v) => { city = v; });
      } });
    UI.render();
  },
  ageUp() {
    if (!S || !S.alive || UI.cur) return;
    UI.closePanel();
    S.ageMonths++;
    if (S.ageMonths % 12 === 0) log('🎂', `Joyeux anniversaire ! Tu as maintenant <b>${S.ageMonths / 12} ans</b>.`, 'info');
    const consumed = Object.keys(S.used).length > 0;
    S.used = {}; S.deposit = 0;
    S.buffs = S.buffs.filter((b) => --b.months > 0);
    const steps = [Monthly.jail, () => Monthly.addiction(consumed), Monthly.health, Monthly.income, () => Monthly.crew(), Monthly.labs,
      Monthly.business, Monthly.upkeep, Monthly.imports, Monthly.debts, Monthly.heat, Monthly.refresh];
    for (const st of steps) { st.call(Monthly); if (!S.alive) break; }
    S.ap = PlayerData.apMax();
    if (S.alive) Events.monthly();
    if (S.alive) Monthly.naturalDeath();
    S.stats.maxWorth = Math.max(S.stats.maxWorth, PlayerData.netWorth());
    this.commit();
  },
  die(cause) {
    if (!S || !S.alive) return;
    log('⚰️', `<b>Fin de partie à ${U.age(S.ageMonths)}.</b> Cause du décès : ${cause}.`, 'death');
    S.alive = false; S.death = { cause, m: S.ageMonths };
    S.stats.maxWorth = Math.max(S.stats.maxWorth, PlayerData.netWorth());
    this.save();
    UI.gameOver();
  },
  save() { try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ } },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || !data.name) return false;
      S = data; this.migrate(); return true;
    } catch (e) { return false; }
  },
  migrate() {
    const b = PlayerData.blank(S.name, S.avatar, S.city);
    for (const k in b) if (!(k in S)) S[k] = b[k];
    for (const k in b.owned) if (!S.owned[k]) S.owned[k] = [];
    for (const k in b.stats) if (!(k in S.stats)) S.stats[k] = 0;
    if (!S.market) S.market = MarketData.init();
    if (!S.rivals || !S.rivals.length) S.rivals = this.genRivals();
    if (!CITIES[S.city]) S.city = 'marseille';
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } S = null; UI.stack = []; UI.tab = null; UI.render(); },
  commit() { this.save(); UI.render(); },
};
const SAVE_KEY = 'crimelife_save_v1';

/* ============================ INITIALISATION ============================ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-cb]');
  if (!el || el.disabled) return;
  const id = el.dataset.cb, fn = CB[id[0]] && CB[id[0]][+id.slice(1)];
  if (!fn) return;
  e.preventDefault();
  fn();
  if (S) Game.commit();
});
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => UI.openTab(t.dataset.tab)));
$('#age-btn').addEventListener('click', () => Game.ageUp());
$('#p-back').addEventListener('click', () => UI.back());
$('#p-close').addEventListener('click', () => UI.closePanel());

if (Game.load()) {
  UI.render();
  if (!S.alive) UI.gameOver(); else UI.toast('💾 Partie chargée');
} else Game.newLifeScreen();
</script>
</body>
</html>
