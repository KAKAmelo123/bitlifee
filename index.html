  open() {
    const b = PlayerData.styleBreakdown(), E = (s) => PlayerData.equipped(s), r = RANKS[S.rank];
    const ic = (s) => (E(s) ? E(s).icon : `<span class="empty">${SLOTS[s].icon}</span>`);
    const extra = (...sl) => sl.map((s) => (E(s) ? E(s).icon : '')).join('');
    const doll = `<div class="doll">
      <div class="d head">${S.avatar}<small>${E('dents') ? '😁 grillz' : 'visage'}</small></div>
      <div class="d">${ic('cou')}${extra('pendentif')}<small>cou</small></div>
      <div class="d">${ic('haut')}${extra('veste')}<small>torse</small></div>
      <div class="d">${ic('montre')}${extra('poignet', 'doigts')}<small>poignets</small></div>
      <div class="d">${ic('bas')}<small>jambes</small></div>
      <div class="d">${ic('chaussures')}<small>pieds</small></div></div>`;
    const info = `<div class="pinfo"><div class="big">${U.esc(S.name)}</div>${r.icon} ${r.name}<br>${U.age(S.ageMonths)} · ${CITIES[S.city].flag} ${CITIES[S.city].name}<br>
      💪 Force ${Math.round(S.force)} %<br>👑 Respect ${PlayerData.respect()} %<br>❤️ Santé ${Math.round(S.health)} %<br><span class="tier">${this.tier(b.total)}</span></div>`;
    const slot = (s) => {
      const it = E(s), n = PlayerData.items(SLOTS[s].cat).filter((i) => i.slot === s).length;
      return `<button class="slot ${it ? '' : 'none'}" data-slot="${s}"><span class="si">${it ? it.icon : SLOTS[s].icon}</span><span class="sl"><small>${SLOTS[s].label}${n > 1 ? ` · ${n} en stock` : ''}</small><b>${it ? it.name : 'Rien d\'équipé'}</b></span><span class="sr">${it ? '+' + it.respect : ''}</span></button>`;
    };
    const list = (cat) => Object.keys(SLOTS).filter((s) => SLOTS[s].cat === cat).map(slot).join('');
    const bonus = `<div class="bonus"><span>👕 Tenue</span><b>+${b.tenue}</b><span>💍 Accessoires</span><b>+${b.acc}</b><span>🚗 Meilleur véhicule</span><b>+${b.veh}</b>
      <span>🏠 Logement</span><b>+${b.home}</b><span>🏢 Commerces</span><b>+${b.biz}</b>
      <span class="tot">Bonus de respect${b.raw > 40 ? ' (plafonné)' : ''}</span><b class="tot y">+${b.total} / 40</b></div>`;
    UI.modal({ title: '🪞 Profil & Style', cls: 'profile', html: `<div class="prof">${doll}${info}</div><div class="ptitle">Tenue équipée</div>${list('clothes')}<div class="ptitle">Accessoires</div>${list('jewelry')}<div class="ptitle">Statut social</div>${bonus}`,
      choices: [{ label: '🛍️ Boutique de vêtements', fn: () => { if (!S.jail) { UI.tab = 'assets'; UI.stack = [{ view: 'assets' }, { view: 'shop', arg: 'clothes' }]; } else UI.toast('⛓️ Pas de shopping en cellule.'); } }, { label: 'Fermer', cls: 'ghost' }],
      onShow: (root) => root.querySelectorAll('[data-slot]').forEach((bt) => bt.addEventListener('click', () => { const s = bt.dataset.slot; UI.dismiss(() => this.pick(s)); })) });
  },
  pick(slot) {
    const sl = SLOTS[slot], cur = S.equip[slot];
    const own = PlayerData.items(sl.cat).filter((i) => i.slot === slot).sort((a, b) => b.respect - a.respect);
    UI.modal({ icon: sl.icon, title: sl.label, text: own.length ? 'Que portes-tu ?' : 'Tu ne possèdes rien pour cet emplacement. Passe par la boutique !', choices: [
      ...own.map((it) => ({ label: `${it.icon} ${it.name}${it.id === cur ? ' ✔' : ''}`, sub: `+${it.respect} respect`, cls: it.id === cur ? 'primary' : '', fn: () => { Shop.equip(it); this.open(); } })),
      ...(cur ? [{ label: '🚫 Ne rien porter', fn: () => { delete S.equip[slot]; this.open(); } }] : []),
      { label: '↩️ Retour au profil', cls: 'ghost', fn: () => this.open() },
    ] });
  },
};

/* ============================ RENDUS DES PRODUITS ============================ */
const Looks = {
  pill(d, brand) { return Inventory.look(d, brand) || PILL_LOOK[brand] || { c: '#f4f4f4', s: 'round', t: '' }; },
  html(pl, extra = '') { return `<i class="pl ${pl.s || 'round'}${pl.sc ? ' sc' : ''}${extra}" style="--pc:${pl.c};--pc2:${pl.c2 || pl.c}"><em>${U.esc(pl.t || '')}</em></i>`; },
  leanVars(brand) { return /Actavis/.test(brand) ? '--lc:#4b1170;--lm:#9b4dd4' : /maison/.test(brand) ? '--lc:#5d1a8a;--lm:#ab64d8' : /Paderyl/.test(brand) ? '--lc:#b23a0e;--lm:#e8814a' : /Maka/.test(brand) ? '--lc:#7a3b12;--lm:#c08043' : '--lc:#9e1b1f;--lm:#e2545e'; },
  leanBottle(brand) {
    if (/Actavis/.test(brand)) return '<div class="lbt act"><div class="cap"></div><div class="nk"></div><div class="body"><div class="lq"></div><div class="lb"><div class="ob">actavis</div><b>PROMETHAZINE<br>w/ CODEINE</b><span>6.25-10 mg / 5 mL</span><span>C-V · Rx only</span><em>16 FL OZ (473 mL)</em></div></div></div>';
    if (/maison/.test(brand)) return '<div class="lbt home"><div class="cap"></div><div class="nk"></div><div class="body"><div class="lq"></div><div class="tp">lean maison</div></div></div>';
    let band = '#1d4f9b', nm = 'EUPHON', sub = 'sirop', dci = 'codéine · érysimum', lab = 'MAYOLY SPINDLER', vol = 'flacon de 300 ml', cls = 'eup', extra = '';
    if (/Paderyl/.test(brand)) { band = '#1b7a3a'; nm = 'PADERYL'; sub = '0,1 % sirop'; dci = 'codéine'; lab = 'Gerda'; vol = 'flacon de 150 ml'; }
    else if (/Maka/.test(brand)) { band = '#c62828'; nm = 'Makatussin'; sub = 'gouttes'; dci = 'codéine'; lab = 'Gebro · Suisse'; vol = 'flacon 30 g'; cls = 'eup maka'; extra = '<i class="swiss"></i>'; }
    return `<div class="lbt ${cls}" style="--bandc:${band}"><div class="cap"><i class="gd"></i></div><div class="nk"></div><div class="body"><div class="lb"><i class="bl"></i><b>${nm}<sup>®</sup></b><span class="sy">${sub}</span><i class="rs"></i><span>${dci}</span><span>${vol}</span><em>${lab}</em></div>${extra}</div></div>`;
  },
  cigBrand(brand) { const m = /^Fausses (\S+)/.exec(brand); return m ? Object.values(CIG_BRANDS).find((x) => x.name === m[1]) || null : null; },
  cigPack(brand) {
    const smug = /Contrebande/.test(brand), fb = this.cigBrand(brand);
    const br = fb ? fb.name : smug ? 'MARLBORO<br>duty free' : /volé/.test(brand) ? 'Marlboro<br>(lot volé)' : 'Marlboro<br>Red';
    return `<div class="pk"><div class="br">${br}</div><div class="warn">${fb ? 'SMOKING<br>KILLS' : smug ? 'NUIT GRAVEMENT<br>À LA SANTÉ' : 'FUMER<br>TUE'}</div></div>`;
  },
  cigAttrs(brand) { const fb = this.cigBrand(brand); return fb ? { cls: ' brand', style: `--pk:${fb.pk};--pl:${fb.pl};--pt:${fb.pt}` } : { cls: /Contrebande/.test(brand) ? ' red' : '', style: '' }; },
};

/* ============================ LABOS : RÉGLAGES DE PRODUCTION ============================ */
const Labs = {
  configurable: (type) => ['serre', 'resine', 'presse', 'mdma', 'codeine', 'tabac'].includes(type),
  defaults(type) {
    return ({ serre: { strain: 'amnesia' }, resine: { plant: 'beldia', method: 'tamis' }, presse: { model: 'percocet', shape: 'oblong', color: '#f5d33b', imprint: 'PERCOCET' },
      mdma: { logo: 'Tesla' }, codeine: { label: 'actavis', fenta: 0 }, tabac: { brand: 'marlboro' } })[type] || {};
  },
  cfg(l) { if (!l.cfg) l.cfg = this.defaults(l.type); return l.cfg; },
  norm: (t) => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, ''),
  colorName: (c) => (PRESS_COLORS.find((x) => x[0] === c) || [c, 'personnalisé'])[1],
  // crédibilité d'une contrefaçon : couleur, forme et gravure identiques au modèle copié
  credibility(c) {
    const M = PRESS_MODELS[c.model] || PRESS_MODELS.percocet;
    if (!M.look) return 45;
    return 40 + (c.color === M.look.c ? 20 : 0) + (c.shape === M.look.s ? 20 : 0) + (this.norm(c.imprint) === this.norm(M.look.t) ? 20 : 0);
  },
  // caractéristiques de la production : produit, rendement, bonus de qualité, marque, rendu
  spec(l) {
    const L = LABS[l.type], c = this.cfg(l);
    const sp = { drug: L.drug, y: 1, q: 0, brand: 'Production maison', look: null, label: '', fentaPer: 0, cutQ: 0, cut: 0, fake: false };
    if (l.type === 'serre') { const s = STRAINS[c.strain] || STRAINS.amnesia; Object.assign(sp, { y: s.y, q: s.q, brand: s.name, label: `🌿 ${s.name} (${s.type.toLowerCase()})` }); }
    else if (l.type === 'resine') { const pl = HASH_PLANTS[c.plant] || HASH_PLANTS.beldia, m = HASH_METHODS[c.method] || HASH_METHODS.tamis; Object.assign(sp, { y: pl.y * m.y, q: pl.q + m.q, brand: m.brand, label: `🟫 ${m.brand} · ${pl.name}` }); }
    else if (l.type === 'presse') {
      const M = PRESS_MODELS[c.model] || PRESS_MODELS.percocet, cr = this.credibility(c), t = String(c.imprint || '').toUpperCase().slice(0, 10);
      Object.assign(sp, { drug: M.drug, q: Math.round((cr - 70) / 3), brand: `${M.name} (pressé)`, look: { c: c.color, s: c.shape, t },
        label: `💊 ${M.look ? 'Copie ' : ''}${M.name} · ${PRESS_SHAPES[c.shape].toLowerCase()} ${this.colorName(c.color)}${t ? ` « ${U.esc(t)} »` : ''} · crédibilité ${cr} %` });
    } else if (l.type === 'mdma') Object.assign(sp, { brand: c.logo, label: `💗 Logo ${c.logo}` });
    else if (l.type === 'codeine') {
      const lb = LEAN_LABELS[c.label] || LEAN_LABELS.actavis, f = FENTA_CUT[c.fenta] || FENTA_CUT[0];
      Object.assign(sp, { q: lb.q, brand: lb.brand, fake: lb.fake, fentaPer: f.per, cutQ: f.q, cut: f.cut, label: `🧴 ${lb.name}${f.per ? ` · ☠️ ${f.name.toLowerCase()} au fentanyl` : ''}` });
    } else if (l.type === 'tabac') { const b = CIG_BRANDS[c.brand] || CIG_BRANDS.marlboro; Object.assign(sp, { brand: `Fausses ${b.name} (usine)`, label: `🚬 Fausses ${b.name}` }); }
    return sp;
  },
  // production mensuelle : matières premières, coupe au fentanyl, contrefaçons démasquées
  produce(l, out) {
    const L = LABS[l.type], mult = LAB_MULT[l.level - 1], sp = this.spec(l), D = DRUGS[sp.drug];
    let n = Math.round(L.out * mult * sp.y * U.rand(0.85, 1.15));
    if (L.input) {
      const I = DRUGS[L.input.drug], per = L.input.qty / L.out, can = Math.floor(Inventory.qty(L.input.drug) / per);
      if (can < 1) { const need = Math.ceil(n * per); out.push(`${L.icon} en attente de ${U.num(need)} ${U.u(I, need)} ${U.de(I.name.toLowerCase())}`); return; }
      if (can < n) out.push(`${L.icon} tourne au ralenti (manque ${U.de(I.name.toLowerCase())})`);
      n = Math.min(n, can);
      Inventory.remove(L.input.drug, Math.ceil(n * per));
    }
    let q = U.clamp(U.ri(L.q[0], L.q[1]) + (l.level - 1) * 8 + sp.q, 1, 100), cut = 0, note = '';
    if (sp.fentaPer) {
      const need = Math.ceil(n / sp.fentaPer);
      if (Inventory.qty('fenta') >= need) { Inventory.remove('fenta', need); cut = sp.cut; q = U.clamp(q + sp.cutQ, 1, 100); note = ` ☠️ coupé (${need} cp de fentanyl)`; }
      else note = ' (pas assez de fentanyl : sirop non coupé)';
    }
    Inventory.add(sp.drug, n, q, sp.brand, { look: sp.look, cut });
    out.push(`${L.icon} +${U.num(n)} ${U.u(D, U.num(n))} « ${U.esc(sp.brand)} » (Q${q})${note}`);
    if (sp.fake && q < 55 && U.chance(15)) { PlayerData.mod('respect', -2); log('🕵️', `Des clients repèrent tes faux flacons (${sp.brand}) : sirop trop dilué. Ta réputation en prend un coup (−2 👑).`, 'bad'); }
  },
  /* ----- panneau de réglage (ouvert à l'achat ou depuis le menu du labo) ----- */
  setup(id, first = false) {
    const l = S.labs.find((x) => x.id === id); if (!l || !this.configurable(l.type)) return;
    const L = LABS[l.type], cfg = { ...this.cfg(l) };
    UI.modal({ icon: L.icon, title: first ? `${L.name} : que produis-tu ?` : `Réglages — ${L.name}`, cls: 'labcfg', html: '<div class="lcw"></div>',
      choices: [{ label: first ? '✅ Lancer la production' : '✅ Enregistrer', cls: 'primary', fn: () => { l.cfg = cfg; log(L.icon, `${L.name} : production réglée — ${this.spec(l).label}.`, 'good'); } },
        ...(first ? [] : [{ label: 'Annuler', cls: 'ghost' }])],
      onShow: (root) => {
        const el = root.querySelector('.lcw'), draw = () => { el.innerHTML = this.panel(l, cfg); };
        el.addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (!b) return; this.set(l.type, cfg, b.dataset.k, b.dataset.v); draw(); });
        el.addEventListener('input', (e) => { if (e.target.dataset.k !== 'imprint') return; cfg.imprint = e.target.value.toUpperCase().slice(0, 10); this.refresh(el, l, cfg); });
        draw();
      } });
  },
  set(type, cfg, k, v) {
    cfg[k] = k === 'fenta' ? +v : v;
    if (type === 'presse' && k === 'model') { const M = PRESS_MODELS[v]; if (M && M.look) Object.assign(cfg, { shape: M.look.s, color: M.look.c, imprint: M.look.t }); }
  },
  refresh(el, l, cfg) {
    const pv = el.querySelector('.lc-prev'), inf = el.querySelector('.lc-info');
    if (pv) pv.innerHTML = this.preview(l.type, cfg);
    if (inf) inf.innerHTML = this.info(l, cfg);
  },
  panel(l, c) {
    const t = l.type, sec = (x) => `<div class="lc-sec">${x}</div>`;
    const o = (k, v, title, sub) => `<button type="button" class="lc-o${String(c[k]) === String(v) ? ' on' : ''}" data-k="${k}" data-v="${U.esc(v)}"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
    const grid = (k, obj, fn) => `<div class="lc-opts">${Object.keys(obj).map((x) => fn(x, obj[x])).join('')}</div>`;
    let h = `<div class="lc-prev">${this.preview(t, c)}</div>`;
    if (t === 'serre') h += sec('Variété à planter') + grid('strain', STRAINS, (k, s) => o('strain', k, s.name, `${s.type} · ${s.desc}`));
    if (t === 'resine') h += sec('Plantes cultivées') + grid('plant', HASH_PLANTS, (k, s) => o('plant', k, s.name, s.desc)) + sec('Méthode d\'extraction') + grid('method', HASH_METHODS, (k, m) => o('method', k, m.name, `« ${m.brand} » · ${m.desc}`));
    if (t === 'presse') {
      h += sec('Médicament à copier') + grid('model', PRESS_MODELS, (k, M) => o('model', k, M.name, `${DRUGS[M.drug].name}${M.look ? '' : ' · forme libre'}`));
      h += sec('Forme') + `<div class="lc-opts">${Object.keys(PRESS_SHAPES).map((k) => o('shape', k, PRESS_SHAPES[k], '')).join('')}</div>`;
      h += sec('Couleur') + `<div class="lc-sws">${PRESS_COLORS.map(([col, nm]) => `<button type="button" class="lc-sw${c.color === col ? ' on' : ''}" data-k="color" data-v="${col}" style="background:${col}" aria-label="${nm}"></button>`).join('')}</div>`;
      h += sec('Inscription gravée') + `<input class="lc-in" data-k="imprint" maxlength="10" value="${U.esc(c.imprint || '')}" placeholder="ex. M 30, OP 80…" autocomplete="off">`;
    }
    if (t === 'mdma') h += sec('Logo pressé sur les cachets') + `<div class="lc-opts">${['Tesla', 'Punisher', 'Blue Dolphin', 'Skull'].map((x) => o('logo', x, `${ZIP_LOOK[x][1]} ${x}`, '')).join('')}</div>`;
    if (t === 'codeine') {
      h += sec('Étiquette (contrefaçon)') + grid('label', LEAN_LABELS, (k, x) => o('label', k, x.name, x.desc));
      h += sec('Coupe au fentanyl') + `<div class="lc-opts">${FENTA_CUT.map((f, i) => o('fenta', i, f.name, f.desc)).join('')}</div>`;
    }
    if (t === 'tabac') h += sec('Marque imitée') + grid('brand', CIG_BRANDS, (k, b) => o('brand', k, b.name, 'Paquets contrefaits, tabac bas de gamme'));
    return h + `<div class="lc-info">${this.info(l, c)}</div>`;
  },
  preview(t, c) {
    if (t === 'serre') { const s = STRAINS[c.strain]; return `<div class="lc-bud" style="filter:${s.f}">🌿</div>`; }
    if (t === 'resine') { const m = HASH_METHODS[c.method]; return `<div class="lc-hash" style="--hc:${m.color}">${m.stamp}</div>`; }
    if (t === 'presse') return Looks.html({ c: c.color, s: c.shape, t: String(c.imprint || '').toUpperCase() });
    if (t === 'mdma') { const z = ZIP_LOOK[c.logo]; return `<i class="tb" style="--pc:${z[0]}">${z[1]}</i>`; }
    if (t === 'codeine') { const lb = LEAN_LABELS[c.label]; return `<div class="st-lean" style="${Looks.leanVars(lb.brand)}">${Looks.leanBottle(lb.brand)}</div>${c.fenta ? '<span class="lc-badge">☠️ fentanyl</span>' : ''}`; }
    if (t === 'tabac') { const b = `Fausses ${CIG_BRANDS[c.brand].name} (usine)`, a = Looks.cigAttrs(b); return `<div class="st-cig${a.cls}" style="${a.style}">${Looks.cigPack(b)}</div>`; }
    return '';
  },
  info(l, c) {
    const L = LABS[l.type], sp = this.spec({ ...l, cfg: c }), D = DRUGS[sp.drug], n = Math.round(L.out * LAB_MULT[l.level - 1] * sp.y);
    const q0 = U.clamp(L.q[0] + (l.level - 1) * 8 + sp.q, 1, 100), q1 = U.clamp(L.q[1] + (l.level - 1) * 8 + sp.q, 1, 100);
    let h = `Production : <b>~${U.num(n)} ${U.u(D, U.num(n))}/mois</b> ${U.de(D.name.toLowerCase())} « ${U.esc(sp.brand)} »<br>Qualité : ${U.q(q0)} à ${U.q(q1)}${sp.cutQ ? ` (+${sp.cutQ} si coupé)` : ''}`;
    if (l.type === 'presse') { const cr = this.credibility(c); h += `<br>Crédibilité de la copie : <b class="${cr >= 80 ? 'g' : cr >= 60 ? 'y' : 'r'}">${cr} %</b>${PRESS_MODELS[c.model].look ? ' <small class="m">(couleur, forme et gravure du vrai)</small>' : ''}`; }
    if (L.input) { const need = Math.ceil(n * L.input.qty / L.out); h += `<br>Matière première : ${U.num(need)} ${U.u(DRUGS[L.input.drug], need)} ${U.de(DRUGS[L.input.drug].name.toLowerCase())}/mois (stock ${U.num(Inventory.qty(L.input.drug))})`; }
    if (sp.fentaPer) h += `<br>Fentanyl : ${Math.ceil(n / sp.fentaPer)} cp/mois (stock ${U.num(Inventory.qty('fenta'))}) · <b class="r">risque d'overdoses chez tes clients</b>`;
    if (sp.fake) h += '<br><small class="m">Contrefaçon : vendue au prix du vrai, mais un sirop trop dilué peut être démasqué.</small>';
    return h;
  },
};

/* ============================ POLICE & CORRUPTION ============================ */
// Police locale achetée (par ville) : versement mensuel ou gros pot-de-vin valable 12 mois.
const Police = {
  get: (c = S.city) => S.corrupt[c] || null,
  bought(c = S.city) { const p = this.get(c); return !!p && (p.monthly > 0 || p.until > S.ageMonths); },
  level(c = S.city) { return CITIES[c].police * (this.bought(c) ? 0.35 : 1); },
  customs(c = S.city) { return CITIES[c].customs * (this.bought(c) ? 0.6 : 1); },
  bribeCost(c = S.city) { return Math.round(40000 * CITIES[c].police * (1 + S.rank * 0.5) / 1000) * 1000; },
  monthlyCost(c = S.city) { return Math.round(4500 * CITIES[c].police * (1 + S.rank * 0.5) / 100) * 100; },
  minRespect: 25,
  internal: (c) => (CITIES[c].country === 'France' ? 'l\'IGPN (police des polices)' : 'les affaires internes'),
  statusShort(c = S.city) { const p = this.get(c); return p && p.monthly > 0 ? 'Arrosée' : p && p.until > S.ageMonths ? `Achetée (${p.until - S.ageMonths} mois)` : 'Intègre'; },
  status(c = S.city) {
    const p = this.get(c);
    if (p && p.monthly > 0) return `Arrosée (${U.money(p.monthly)}/mois)`;
    if (p && p.until > S.ageMonths) return `Achetée (encore ${p.until - S.ageMonths} mois)`;
    return 'Intègre';
  },
  buyOnce(c = S.city) {
    const cost = this.bribeCost(c), C = CITIES[c];
    if (PlayerData.respect() < this.minRespect) return UI.toast(`🔒 Respect ${this.minRespect} requis : les flics ne traitent pas avec un inconnu.`);
    UI.confirm('💼', `Acheter la police de ${C.name}`, `Une enveloppe de <b>${U.money(cost)}</b> en liquide pour le commissaire (${C.cops}).<br>Pendant <b>12 mois</b>, pression policière ×${U.f2(C.police * 0.35)} : contrôles, descentes, flagrants délits et interceptions de go fast fortement réduits.<br><small class="m">Chaque mois, ${this.internal(c)} peut tout faire tomber (2,5 %).</small>`, `💼 Payer ${U.money(cost)}`, () => {
      if (S.cash < cost) return UI.toast('💵 Pas assez de liquide.');
      S.cash -= cost;
      const p = S.corrupt[c] || { monthly: 0, until: 0 };
      p.until = Math.max(p.until, S.ageMonths) + 12; S.corrupt[c] = p;
      PlayerData.mod('heat', -15);
      log('💼', `Enveloppe de ${U.money(cost)} au commissariat de ${C.name} : la police locale ferme les yeux pendant 12 mois (−15 🚨).`, 'good');
    });
  },
  subscribe(c = S.city) {
    const cost = this.monthlyCost(c), C = CITIES[c];
    if (PlayerData.respect() < this.minRespect) return UI.toast(`🔒 Respect ${this.minRespect} requis : les flics ne traitent pas avec un inconnu.`);
    UI.confirm('🤝', `Arroser la police de ${C.name}`, `Versement de <b>${U.money(cost)}/mois</b> en liquide à des policiers (${C.cops}).<br>Tant que tu paies : pression policière ×${U.f2(C.police * 0.35)}.<br><small class="m">Un mois impayé et l'arrangement tombe.</small>`, '🤝 Mettre en place', () => {
      const p = S.corrupt[c] || { monthly: 0, until: 0 }; p.monthly = cost; S.corrupt[c] = p;
      log('🤝', `Tu arroses désormais des policiers de ${C.name} : ${U.money(cost)}/mois.`, 'good');
    });
  },
  stop(c) {
    const p = this.get(c); if (!p) return;
    p.monthly = 0; if (!(p.until > S.ageMonths)) delete S.corrupt[c];
    log('✋', `Tu cesses d'arroser la police de ${CITIES[c].name}.`, '');
  },
  monthly() {
    for (const c of Object.keys(S.corrupt)) {
      const p = S.corrupt[c], C = CITIES[c];
      if (p.monthly > 0) {
        if (S.cash >= p.monthly) { S.cash -= p.monthly; log('🤝', `Enveloppe mensuelle aux policiers de ${C.name} : −${U.money(p.monthly)}.`, ''); }
        else { p.monthly = 0; log('📵', `Tu n'as pas pu payer les policiers de ${C.name} : l'arrangement tombe.`, 'bad'); }
      }
      if (this.bought(c) && U.chance(2.5)) {
        delete S.corrupt[c]; PlayerData.mod('heat', 20);
        log('🕵️', `Coup de filet : ${this.internal(c)} démantèle ton réseau de flics ripoux à ${C.name}. Protection perdue (+20 🚨).`, 'bad');
        continue;
      }
      if (!(p.monthly > 0) && !(p.until > S.ageMonths)) { delete S.corrupt[c]; log('⌛', `Ton arrangement avec la police de ${C.name} a expiré.`, ''); }
    }
  },
};

/* ============================== EMPLOI LÉGAL ============================== */
const Jobs = {
  get: (id) => JOBS.find((j) => j.id === id),
  cur() { return S.job ? this.get(S.job.id) || null : null; },
  // raisons pour lesquelles le poste est inaccessible (casier, force, expérience)
  block(j) {
    if (S.record > j.maxRecord) return j.maxRecord ? `casier trop chargé (${j.maxRecord} condamnation max.)` : 'casier judiciaire vierge exigé';
    if (j.force && S.force < j.force) return `force ${j.force} % requise`;
    if (j.exp && S.stats.jobMonths < j.exp) return `${j.exp} mois d'expérience légale (${S.stats.jobMonths})`;
    return '';
  },
  chance(j) { return Math.round(U.clamp(88 - S.record * 22 - S.stats.arrests * 4 - S.heat * 0.3 - (S.addiction > 50 ? 15 : 0), 5, 95)); },
  salary(j) { return Math.round(j.salary * (1 + 0.05 * Math.floor((S.job ? S.job.months : 0) / 12))); }, // +5 % par année d'ancienneté
  apply(id) {
    const j = this.get(id); if (!j || S.jail) return;
    if (S.job) return UI.toast('💼 Tu as déjà un emploi. Démissionne d\'abord.');
    const b = this.block(j); if (b) return UI.toast(`🔒 ${b}`);
    if (!PlayerData.useAP(1)) return;
    if (U.chance(this.chance(j))) {
      S.job = { id, months: 0 };
      log(j.icon, `Embauché : <b>${j.name}</b> (${U.money(j.salary)}/mois déclarés, versés en banque).`, 'good');
      UI.result(j.icon, 'Embauché !', `Tu commences dès lundi : <b>${j.name}</b>.<br>Salaire : <b class="g">${U.money(j.salary)}/mois</b> (argent propre, versé en banque).<br><small class="m">Un emploi prend du temps : −1 ⚡ par mois.</small>`, 'good');
    } else {
      log('📄', `Candidature refusée (${j.name}).${S.record ? ' Ton casier judiciaire a pesé lourd.' : ''}`, 'bad');
      UI.result('📄', 'Candidature refusée', `« Nous avons retenu un autre profil. »${S.record ? `<br><small class="m">Ton casier (${S.record} condamnation${S.record > 1 ? 's' : ''}) fait peur aux employeurs.</small>` : ''}`, 'bad');
    }
  },
  quit() {
    const j = this.cur(); if (!j) return;
    UI.confirm('🚪', 'Démissionner ?', `Quitter ton poste (${j.name}) ?`, '🚪 Démissionner', () => { S.job = null; log('🚪', `Tu démissionnes de ton poste (${j.name}).`, ''); }, 'danger');
  },
  monthly() {
    const j = this.cur(); if (!j) { S.job = null; return; }
    if (S.jail) { S.job = null; log('📄', `Incarcéré, tu perds ton emploi (${j.name}).`, 'bad'); return; }
    if (S.heat > 65 && U.chance(12)) { S.job = null; log('📄', `Ton employeur a eu vent de tes « activités » : licenciement pour faute grave (${j.name}).`, 'bad'); return; }
    const pay = this.salary(j);
    S.bank += pay; S.job.months++; S.stats.jobMonths++;
    const tips = j.tips ? U.ri(j.tips[0], j.tips[1]) : 0;
    S.cash += tips;
    PlayerData.mod('heat', -1); PlayerData.mod('stress', 1);
    log(j.icon, `Salaire (${j.name}) : <b>+${U.money(pay)}</b> en banque${tips ? ` · pourboires +${U.money(tips)} en liquide` : ''}.`, 'money');
  },
};

/* ============================ VOL DE VÉHICULES ============================ */
const Cars = {
  cap() { return 1 + PlayerData.items('properties').reduce((a, p) => a + (p.garage || 0), 0); },
  chance(t) { return Math.round(U.clamp(72 - t.diff + S.carSkill * 0.45 + PlayerData.crimeBuff() * 0.5 - S.heat * 0.12 * Police.level() - PlayerData.stressMalus(), 5, 95)); },
  fence(t) { return Math.round(t.value * U.rand(0.2, 0.32) / 10) * 10; },
  steal(id) {
    const t = CAR_TARGETS.find((x) => x.id === id);
    if (!t || S.jail) return;
    if (!PlayerData.useAP(1)) return;
    S.stats.crimes++;
    if (U.chance(this.chance(t))) {
      S.carSkill = Math.min(100, S.carSkill + 3); S.stats.carsStolen++;
      PlayerData.mod('heat', 2 + t.diff / 10);
      const car = { uid: U.uid(), id: t.id, name: t.name, icon: t.icon, value: t.value, speed: t.speed, disc: t.disc };
      const cash = this.fence(t), room = S.garage.length < this.cap();
      log('🚗', `Vol de véhicule réussi : ${t.icon} ${t.name}.`, 'good');
      UI.modal({ icon: t.icon, title: 'Véhicule volé !', text: `Contact ponté, alarme coupée : tu files au volant du véhicule (<b>${t.name}</b>).<br>Qu'en fais-tu ?`, choices: [
        { label: `💵 Le revendre au receleur (${U.money(cash)})`, sub: 'Cash immédiat, démonté pour les pièces', fn: () => { PlayerData.earn(cash); log('🔧', `Le receleur te rachète le véhicule volé (${t.name}) ${U.money(cash)} en liquide.`, 'money'); } },
        { label: '🅿️ Le garder au garage', sub: room ? `Voiture sacrifiable pour les go fast (+10 discrétion) · garage ${S.garage.length}/${this.cap()}` : `Garage plein (${this.cap()} place${this.cap() > 1 ? 's' : ''}) : un logement avec garage en ajoute`, dis: !room,
          fn: () => { S.garage.push(car); log('🅿️', `Tu planques le véhicule volé (${t.name}) dans ton garage, plaques maquillées.`, 'good'); } },
      ] });
      return;
    }
    S.carSkill = Math.min(100, S.carSkill + 1);
    const r = Math.random();
    if (r < 0.45) { PlayerData.mod('heat', 4); log('🚨', `Vol de véhicule raté (${t.name}) : l'alarme se déclenche, tu détales.`, 'bad'); UI.result('🚨', 'Alarme !', 'La sirène hurle dans toute la rue. Tu t\'enfuis à pied.', 'bad'); }
    else if (r < 0.75) {
      log('😡', `Vol de véhicule raté (${t.name}) : le propriétaire te surprend !`, 'bad');
      Combat.start({ foe: 'proprio', ctx: { arms: 'melee', flee: 55, place: 'Vol de véhicule', intro: 'Le propriétaire sort de l\'immeuble en hurlant, une barre de fer à la main.' }, onEnd: (res) => {
        if (res === 'win') { PlayerData.mod('respect', 1); log('👊', 'Tu te débarrasses du propriétaire et prends la fuite à pied.', ''); }
        else if (res === 'lose') { log('🚓', 'Le propriétaire te maîtrise en attendant la police…', 'bad'); Actions.arrest({ charge: 'Tentative de vol de véhicule', months: U.ri(3, 10) }); }
        else log('🏃', 'Tu échappes au propriétaire furieux.', '');
      } });
    } else { log('🚓', `Vol de véhicule raté (${t.name}) : une patrouille te surprend en train de forcer la portière.`, 'bad'); Actions.arrest({ charge: 'Tentative de vol de véhicule', months: U.ri(4, 12) }); }
  },
  menu(uid) {
    const c = S.garage.find((x) => x.uid === uid); if (!c) return;
    const cash = Math.round(c.value * 0.22 / 10) * 10;
    UI.modal({ icon: c.icon, title: c.name, text: `Véhicule volé · ⚡ Vitesse ${c.speed} · 🕶️ Discrétion ${c.disc + 10} (plaques maquillées)<br><small class="m">Utilisable pour un go fast, puis brûlé : rien ne remonte jusqu'à toi.</small>`, choices: [
      { label: `💵 Le revendre au receleur (${U.money(cash)})`, fn: () => { S.garage = S.garage.filter((x) => x !== c); PlayerData.earn(cash); log('🔧', `Tu revends le véhicule volé (${c.name}) au receleur : ${U.money(cash)}.`, 'money'); } },
      { label: '🔥 Le brûler dans un terrain vague', sub: 'Effacer les preuves · −2 🚨', cls: 'danger', fn: () => { S.garage = S.garage.filter((x) => x !== c); PlayerData.mod('heat', -2); log('🔥', `Tu fais disparaître le véhicule volé (${c.name}) dans un terrain vague.`, ''); } },
      { label: 'Fermer', cls: 'ghost' },
    ] });
  },
  monthly() {
    while (S.garage.length > this.cap()) { const c = S.garage.pop(); log('🚗', `Faute de place au garage, tu abandonnes le véhicule volé (${c.name}).`, ''); }
    for (const c of [...S.garage]) {
      if (U.chance(2 * Police.level())) { S.garage = S.garage.filter((x) => x !== c); PlayerData.mod('heat', 5); log('🚓', `La police retrouve un véhicule volé (${c.name}) planqué dans ton garage : saisi (+5 🚨).`, 'bad'); }
    }
  },
};

/* ============================ PLANQUES DE CASH ============================ */
// Chaque bien immobilier possède une planque plafonnée : l'argent qui y dort échappe aux vols,
// contrôles et saisies sur ta personne. Lors d'une descente, une planque peut être découverte.
const Vault = {
  spots() {
    const s = [{ key: 'base', name: 'Cachette perso (faux plafond)', icon: '🧦', cap: 5000, sec: 5 }];
    for (const p of PlayerData.items('properties')) s.push({ key: 'p:' + p.id, name: p.name, icon: p.icon, cap: p.vault || 0, sec: p.sec });
    for (const b of Strip.list()) s.push({ key: 'b:' + b.id, name: 'Coffre-fort du strip club', icon: '💃', cap: 1000000, sec: 60 + Strip.ensure(b).up.secu * 10, club: true });
    return s;
  },
  spot(key) { return this.spots().find((x) => x.key === key) || null; },
  amount: (key) => S.vault[key] || 0,
  total() { return Object.values(S.vault).reduce((a, v) => a + (v || 0), 0); },
  findRisk: (sp) => Math.max(5, 35 - sp.sec * 0.4),
  menu(key) {
    const sp = this.spot(key); if (!sp) return;
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    const v = this.amount(key);
    UI.modal({ icon: sp.icon, title: sp.name, text: `Planqué : <b class="g">${U.money(v)}</b> / ${U.money(sp.cap)}<br>Liquide sur toi : ${U.money(S.cash)}`, choices: [
      { label: '🗄️ Planquer du liquide', dis: S.cash < 1 || v >= sp.cap, fn: () => this.deposit(key) },
      { label: '💵 Récupérer du liquide', dis: v < 1, fn: () => this.withdraw(key) },
      { label: 'Fermer', cls: 'ghost' },
    ] });
  },
  deposit(key) {
    const sp = this.spot(key); if (!sp) return;
    const max = Math.min(S.cash, sp.cap - this.amount(key));
    if (max < 1) return UI.toast(S.cash < 1 ? 'Pas de liquide à planquer.' : 'Planque pleine.');
    UI.qty({ icon: sp.icon, title: 'Planquer du liquide', text: `${sp.name} · plafond ${U.money(sp.cap)} · déjà ${U.money(this.amount(key))}`, max, init: max, unit: '€', confirm: '🗄️ Planquer',
      onConfirm: (n) => { n = Math.min(n, S.cash, sp.cap - this.amount(key)); if (n < 1) return; S.cash -= n; S.vault[key] = this.amount(key) + n; UI.toast(`🗄️ ${U.money(n)} planqués`); } });
  },
  withdraw(key) {
    const sp = this.spot(key), have = this.amount(key);
    if (!sp || have < 1) return UI.toast('Planque vide.');
    UI.qty({ icon: sp.icon, title: 'Récupérer du liquide', text: `${sp.name} · ${U.money(have)} planqués`, max: have, init: have, unit: '€', confirm: '💵 Récupérer',
      onConfirm: (n) => { n = Math.min(n, this.amount(key)); S.vault[key] -= n; if (!S.vault[key]) delete S.vault[key]; S.cash += n; UI.toast(`💵 +${U.money(n)} en liquide`); } });
  },
  // un bien vendu ou saisi : l'argent planqué revient en liquide
  cleanup() {
    const keys = new Set(this.spots().map((x) => x.key));
    for (const k of Object.keys(S.vault)) {
      const v = S.vault[k];
      if (keys.has(k) && v > 0) continue;
      if (v > 0) { S.cash += v; log('🗄️', `Tu récupères ${U.money(v)} planqués avant de quitter les lieux.`, 'money'); }
      delete S.vault[k];
    }
  },
  lose(chanceOf, frac) {
    let lost = 0;
    for (const sp of this.spots()) {
      const v = this.amount(sp.key); if (!v || sp.club) continue;
      if (U.chance(chanceOf(sp))) { const n = Math.round(v * frac()); S.vault[sp.key] -= n; lost += n; if (!S.vault[sp.key]) delete S.vault[sp.key]; }
    }
    return lost;
  },
  raid() { return this.lose((sp) => this.findRisk(sp), () => U.rand(0.5, 1)); },
  burglary() { return this.lose((sp) => Math.max(3, 20 - sp.sec * 0.3), () => 0.3); },
};

/* ============================== ARSENAL ============================== */
// Stock d'armes de l'organisation : puissance militaire (guerres, dissuasion) et trafic d'armes.
const Arsenal = {
  count: () => Object.values(S.arsenal).reduce((a, n) => a + (n || 0), 0),
  military() { return Object.keys(ARMS).reduce((a, t) => a + (S.arsenal[t] || 0) * ARMS[t].mil, 0); },
  hands() { return 5 + PlayerData.soldiers().length * 5 + PlayerData.dealers().length; },
  // armes réellement utilisables : les meilleures d'abord, dans la limite des bras disponibles
  usable() {
    let left = this.hands(), m = 0;
    for (const t of Object.keys(ARMS).sort((a, b) => ARMS[b].mil - ARMS[a].mil)) { const n = Math.min(left, S.arsenal[t] || 0); m += n * ARMS[t].mil; left -= n; }
    return m;
  },
  value() { return Object.keys(ARMS).reduce((a, t) => a + (S.arsenal[t] || 0) * ARMS[t].sell * 0.5, 0); },
  deter() { return Math.min(0.6, this.usable() / 250); }, // réduit la fréquence des règlements de compte
  priceSell(t, c = S.city) { return Math.round(ARMS[t].sell * ARMS_CITY[c]); },
  demandLeft(t) { return Math.max(0, 10 + S.rank * 8 - (S.market.sold['arms:' + S.city + ':' + t] || 0)); },
  crateCost(i) { const c = CRATES[i]; return Math.round(ARMS[c.type].buy * c.n * (c.n >= 50 ? 0.85 : 1)); },
  crateRank(i) { return CRATES[i].n >= 50 ? 2 : 1; },
  crateRisk(i) { return Math.round(U.clamp((3 + CRATES[i].n * 0.25 + S.heat * 0.08) * Police.customs(), 1, 60)); },
  sellRisk(n) { return Math.round(U.clamp((2 + n * 0.3 + S.heat * 0.06) * Police.level(), 1, 50) * 10) / 10; },
  seize(frac) { let n = 0; for (const t in S.arsenal) { const k = Math.floor((S.arsenal[t] || 0) * frac); S.arsenal[t] -= k; n += k; } return n; },
  buyCrate(i) {
    const c = CRATES[i], A = ARMS[c.type], cost = this.crateCost(i), risk = this.crateRisk(i);
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    if (S.rank < this.crateRank(i)) return UI.toast(`🔒 Grade requis : ${RANKS[this.crateRank(i)].name}`);
    UI.confirm('📦', `Caisse de ${c.n} × ${A.name}`, `Prix : <b class="y">${U.money(cost)}</b> en liquide<br>Puissance militaire : +${c.n * A.mil}<br>Risque d'interception : ${U.risk(risk)}`, '📦 Commander', () => {
      if (S.cash < cost) return UI.toast('💵 Pas assez de liquide.');
      S.cash -= cost;
      if (U.chance(risk)) {
        PlayerData.mod('heat', 12);
        log('🛃', `Ta caisse d'armes (${c.n} × ${A.name}) a été interceptée par les douanes : ${U.money(cost)} perdus (+12 🚨).`, 'bad');
        if (U.chance(30)) Actions.arrest({ charge: 'Importation d\'armes de guerre en bande organisée', months: 24 + c.n });
        return;
      }
      S.arsenal[c.type] = (S.arsenal[c.type] || 0) + c.n; PlayerData.mod('heat', Math.min(6, c.n / 10));
      log('📦', `Livraison d'armes : ${c.n} × ${A.name} rejoignent l'arsenal de l'organisation.`, 'good');
    });
  },
  sell(t) {
    const A = ARMS[t], have = S.arsenal[t] || 0, left = this.demandLeft(t), unit = this.priceSell(t);
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    if (!have) return UI.toast('Aucune arme de ce type dans l\'arsenal.');
    if (!left) return UI.toast('Plus d\'acheteurs ce mois-ci dans cette ville.');

        const rev = n * unit; PlayerData.earn(rev); S.stats.sold += rev;

      } });

    if (S.rank < F.rank) return UI.toast(`🔒 Grade requis : ${RANKS[F.rank].name}`);

      onPay: () => { S.factories.push({ id: U.uid(), type }); log(F.icon, `Nouvel atelier clandestin : <b>${F.name}</b>.`, 'good'); } });

  factoryMenu(id) {
    const f = S.factories.find((x) => x.id === id); if (!f) return;
    const F = FACTORIES[f.type], v = Math.round(F.price * 0.5);
    UI.modal({ icon: F.icon, title: F.name, text: `Production : ~${F.out} ghost guns/mois${F.smg ? ` + ${F.smg} PM` : ''}<br>Frais : ${U.money(F.upkeep)}/mois`, choices: [
      { label: `💰 Revendre le matériel (${U.money(v)})`, cls: 'danger', fn: () => { S.factories = S.factories.filter((x) => x !== f); S.cash += v; log('💰', `Tu revends ton atelier (${F.name}).`, 'money'); } },
      { label: 'Fermer', cls: 'ghost' },
    ] });
  },
  monthly() {
    if (!S.factories.length) return;
    const out = [];
    for (const f of [...S.factories]) {
      const F = FACTORIES[f.type];
      if (!PlayerData.pay(F.upkeep)) { out.push(`${F.icon} à l'arrêt (frais impayés)`); continue; }

      out.push(txt);

    if (out.length) log('🔧', 'Ateliers d\'armes : ' + out.join(' · '), 'info');

/* ======================= ARMURERIE : MODIFICATIONS ======================= */
const Armory = {
  isGun: (id) => !!WEAPON_STATS[id] && !WEAPON_STATS[id].melee,
  mods: (id) => (S.mods && S.mods[id]) || [],
  // statistiques de combat d'une arme à feu avec ses modifications
  stats(w) {
    const ms = this.mods(w.id); if (!ms.length) return w;
    let acc = w.acc, dm = 1, silent = false;
    for (const m of ms) { const M = WEAPON_MODS[m]; if (!M) continue; acc += M.acc || 0; dm += M.dmg || 0; if (M.silent) silent = true; }
    return { ...w, acc, dmg: [w.dmg[0] * dm, w.dmg[1] * dm], silent, name: `${w.name} ⚙️` };
  },
  menu(it) {
    const ms = this.mods(it.id), st = this.stats({ id: it.id, name: it.name, ...WEAPON_STATS[it.id] });
    UI.modal({ icon: it.icon, title: it.name, text: `💥 Dégâts ${Math.round(st.dmg[0])}–${Math.round(st.dmg[1])} · 🎯 Précision ${st.acc}${st.silent ? ' · 🔇 silencieux' : ''}<br>Modifications : ${ms.length ? ms.map((m) => `${WEAPON_MODS[m].icon} ${WEAPON_MODS[m].name}`).join(', ') : 'aucune'}<br><small class="m">Armurier clandestin, liquide uniquement. +3 puissance de feu par modification.</small>`,
      choices: [
        ...Object.keys(WEAPON_MODS).filter((m) => !WEAPON_MODS[m].dark).map((m) => { const M = WEAPON_MODS[m], has = ms.includes(m); return { label: `${M.icon} ${M.name}${has ? ' ✔' : ''}`, sub: has ? 'Installé' : `${U.money(M.price)} · ${M.desc}`, dis: has || S.cash < M.price, fn: () => this.install(it, m) }; }),
        { label: `💰 Revendre (${U.money(it.price * RESALE.weapons)})`, cls: 'danger', fn: () => Shop.sell('weapons', it) },
        { label: 'Fermer', cls: 'ghost' },
      ] });
  },
  install(it, m) {
    const M = WEAPON_MODS[m];
    if (S.jail) return UI.toast('⛓️ Impossible depuis ta cellule.');
    if (S.cash < M.price) return UI.toast('💵 Pas assez de liquide.');
    S.cash -= M.price; S.mods[it.id] = [...this.mods(it.id), m];
    log('🔧', `Armurier clandestin : ${M.name} installé sur ton arme (${it.name}).`, 'good');
    this.menu(it);
  },
};

/* ============================== STRIP CLUBS ============================== */
const Strip = {
  list: () => S.businesses.filter((b) => BUSINESSES[b.type].strip),
  get: (id) => S.businesses.find((b) => b.id === id && BUSINESSES[b.type].strip) || null,
  ensure(b) { if (!b.up) b.up = { secu: 0, vip: 0, sono: 0 }; if (b.escorts == null) b.escorts = 0; return b; },
  prestige(b) { return 15 + b.up.sono * 10 + b.up.vip * 15 + b.up.secu * 4; },
  maxEscorts(b) { return 4 + b.up.vip * 4; },
  // protection armée : tes soldats et la sécurité du club
  protection(b) { return Math.min(1, PlayerData.soldiers().length * 0.12 + b.up.secu * 0.15); },
  escortRevenue(b) { return Math.round(b.escorts * 1400 * (0.5 + this.prestige(b) / 100) * (0.8 + this.protection(b) * 0.4)); },
  legalIncome(b) { return Math.round(BUSINESSES[b.type].income * (1 + b.up.sono * 0.15 + b.up.vip * 0.2)); },
  risk(b) { return Math.round(b.escorts * 0.7 * (Police.bought() ? 0.2 : 1) * (1 - b.up.secu * 0.2) * 10) / 10; },
  upCost(b, k) { return STRIP_UP[k].base * (b.up[k] + 1); },
  upgrade(id, k) {
    const b = this.get(id); if (!b) return;
    if (S.jail && !Prison.remote()) return UI.toast('📵 Il te faut un téléphone en cellule.');
    if (b.up[k] >= 3) return UI.toast('Niveau maximum.');
    const X = STRIP_UP[k];
    UI.pay({ icon: X.icon, title: `${X.name} (niv. ${b.up[k] + 1})`, text: X.desc, price: this.upCost(b, k), onPay: () => { b.up[k]++; log(X.icon, `Strip club : ${X.name} au niveau ${b.up[k]}.`, 'good'); } });
  },
  recruit(id) {
    const b = this.get(id); if (!b) return;
    if (S.jail && !Prison.remote()) return UI.toast('📵 Il te faut un téléphone en cellule.');
    if (b.escorts >= this.maxEscorts(b)) return UI.toast(`Salons complets (${this.maxEscorts(b)} max.) : agrandis les salons VIP.`);
    if (S.cash < STRIP_RECRUIT) return UI.toast('💵 Pas assez de liquide.');
    S.cash -= STRIP_RECRUIT; b.escorts++;
    log('💃', `Une nouvelle escorte (majeure) rejoint les salons de ton strip club (${b.escorts}/${this.maxEscorts(b)}).`, 'good');
  },
  release(id) {
    const b = this.get(id); if (!b || !b.escorts) return;
    b.escorts--; log('🚪', `Une escorte quitte ton strip club (${b.escorts} restante${b.escorts > 1 ? 's' : ''}).`, '');
  },
  monthly() {
    const remote = Prison.remote();
    for (const b of this.list()) {
      this.ensure(b);
      if (!b.escorts) continue;
      const rev = Math.round(this.escortRevenue(b) * (remote ? 1 : 0.5));
      PlayerData.earn(rev);
      log('💃', `Strip club : les salons privés rapportent <b>+${U.money(rev)}</b> en liquide${remote ? '' : ' (moitié moins sans toi pour gérer)'}.`, 'money');
      if (U.chance(4)) { b.escorts--; log('🚪', 'Une escorte quitte ton strip club.', ''); }
      if (U.chance(this.risk(b))) { this.raid(b); return; }
    }
  },
  // enquête pour proxénétisme aggravé
  raid(b) {
    const n = b.escorts, key = 'b:' + b.id, seized = Math.round(Vault.amount(key) * 0.5);
    b.escorts = 0; PlayerData.mod('heat', 25); PlayerData.mod('stress', 10);
    if (seized) S.vault[key] -= seized;
    const brig = CITIES[S.city].country === 'France' ? 'la brigade de répression du proxénétisme' : 'la brigade des mœurs';
    log('🚨', `Descente de ${brig} dans ton strip club : ${n} escorte${n > 1 ? 's' : ''} auditionnée${n > 1 ? 's' : ''}${seized ? `, ${U.money(seized)} saisis dans le coffre` : ''} (+25 🚨).`, 'bad');
    if (!S.jail && U.chance(Police.bought() ? 15 : 55)) Actions.arrest({ charge: 'Proxénétisme aggravé', months: U.ri(48, 96) });
    else UI.result('🚨', 'Descente au club', `Les enquêteurs ont auditionné tout le personnel.${seized ? ` ${U.money(seized)} saisis dans le coffre.` : ''} ${Police.bought() ? 'Tes contacts dans la police ont étouffé l\'affaire.' : 'Faute de preuves directes, tu échappes aux poursuites… cette fois.'}`, 'bad');
  },
};

/* ============================== CRYPTO ============================== */
const Crypto = {
  rate(c) { return Math.round((S.cryptoRate && S.cryptoRate[c]) || (c === 'btc' ? 55000 : 180)); },
  amt(c) { return (S.crypto && S.crypto[c]) || 0; },
  fmt(c) { return this.amt(c).toFixed(c === 'btc' ? 5 : 3); },
  worth() { return Math.round(this.amt('btc') * this.rate('btc') + this.amt('xmr') * this.rate('xmr')); },
  can(amount) { return this.worth() >= amount; },
  monthly() {
    if (!S.cryptoRate) return;
    for (const c of ['btc', 'xmr']) { let r = this.rate(c) * U.rand(0.8, 1.28); S.cryptoRate[c] = Math.round(U.clamp(r, CRYPTO[c].lo * 0.55, CRYPTO[c].hi * 2)); }
  },
  // paie un montant en € avec la crypto (XMR en priorité, puis BTC). Renvoie true si réglé.
  pay(amount) {
    if (!this.can(amount)) return false;
    let need = amount;
    for (const c of ['xmr', 'btc']) {
      if (need <= 0) break;
      const rate = this.rate(c), use = Math.min(this.amt(c), need / rate);
      S.crypto[c] -= use; need -= use * rate;
    }
    return true;
  },
  credit(c, coins) { S.crypto[c] = this.amt(c) + coins; },
  buy(c) {
    const rate = this.rate(c), max = Math.floor(S.cash + S.bank);
    if (max < 1) return UI.toast('Aucun fonds à convertir.');
    UI.qty({ icon: CRYPTO[c].sym, title: `Acheter du ${CRYPTO[c].name}`, text: `Cours : <b>${U.money(rate)}</b> / ${CRYPTO[c].sym} · frais ${Math.round(DW_FEE * 100)} %`, max, init: Math.min(max, 2000), unit: '€ investis',
      info: (n) => `Tu reçois ≈ <b class="g">${(n * (1 - DW_FEE) / rate).toFixed(c === 'btc' ? 5 : 3)} ${CRYPTO[c].sym}</b>`, confirm: '🪙 Convertir',
      onConfirm: (n) => { n = Math.min(n, S.cash + S.bank); if (!PlayerData.pay(n)) return; this.credit(c, n * (1 - DW_FEE) / rate); log('🪙', `Conversion : ${U.money(n)} → ${(n * (1 - DW_FEE) / rate).toFixed(c === 'btc' ? 5 : 3)} ${CRYPTO[c].sym} (insaisissable).`, 'money'); } });
  },
  sell(c) {
    const rate = this.rate(c), have = this.amt(c), maxE = Math.floor(have * rate);
    if (maxE < 1) return UI.toast(`Aucun ${CRYPTO[c].sym}.`);
    UI.qty({ icon: CRYPTO[c].sym, title: `Encaisser du ${CRYPTO[c].name}`, text: `Cours : <b>${U.money(rate)}</b> / ${CRYPTO[c].sym}`, max: maxE, init: maxE, unit: '€ reçus',
      info: (n) => `Tu débites ≈ ${(n / rate).toFixed(c === 'btc' ? 5 : 3)} ${CRYPTO[c].sym} · reçois <b class="g">${U.money(n * (1 - DW_FEE))}</b> en liquide`, confirm: '💵 Encaisser',
      onConfirm: (n) => { const coins = Math.min(have, n / rate); S.crypto[c] -= coins; S.cash += Math.round(coins * rate * (1 - DW_FEE)); log('🪙', `Tu encaisses ${coins.toFixed(c === 'btc' ? 5 : 3)} ${CRYPTO[c].sym} en liquide.`, 'money'); } });
  },
  payModal({ title, price, onPay }) {
    const can = this.can(price);
    UI.modal({ icon: '🪙', title, text: `Prix : <b class="y">${U.money(price)}</b> en crypto<br>Portefeuille : ${this.fmt('btc')} ₿ + ${this.fmt('xmr')} ɱ ≈ ${U.money(this.worth())}`,
      choices: [{ label: '🪙 Payer en crypto', dis: !can, sub: can ? 'Insaisissable' : 'Solde crypto insuffisant', fn: () => { if (this.pay(price)) onPay(); } }, { label: 'Annuler', cls: 'ghost' }] });
  },
};

  buyMed(d, b) { this.vendorBuy(DRUGS[d].icon, b + ' (pur Q100)', Math.max(1, Math.round(DRUGS[d].base * 0.85 * brandVal(b).buy)), DRUGS[d].unit, (n) => { Inventory.add(d, n, 100, b); log('💊', `Dark Web : ${U.num(n)} « ${b} » (Q100).`, 'good'); }); },
  buyRaw(d) { this.vendorBuy(DRUGS[d].icon, DRUGS[d].name, Math.max(1, Math.round(MarketData.buyUnit(S.city, d) * 0.9)), DRUGS[d].unit, (n) => { Inventory.add(d, n, S.market.qual[S.city][d], MarketData.brand(S.city, d)); log('🌿', `Dark Web : ${U.num(n)} ${U.u(DRUGS[d], n)} ${U.de(DRUGS[d].name)}.`, 'good'); }); },
  /* commandes de clients + expéditions suivies */
  genOrders() {
    const pool = Object.keys(DRUGS).filter((d) => DRUGS[d].cat !== 'tabac' && d !== 'fenta');
    return Array.from({ length: U.ri(4, 7) }, () => { const d = U.pick(pool), city = U.pick(Object.keys(CITIES)), big = U.chance(35); const qty = big ? U.ri(1200, 25000) : U.ri(5, 600); const unit = Math.round(MarketData.retail(S.city, d, 60) * U.rand(1.3, 2.1)); return { id: U.uid(), d, city, qty, unit }; });

  orders() { if (!S.dwOrders || !S.dwOrders.length) S.dwOrders = this.genOrders(); return S.dwOrders; },
  transit(city) { const a = CITIES[S.city], b = CITIES[city]; return a === b ? 1 : a.country === b.country ? 1 : a.region === b.region ? 2 : 3; },
  shipRiskFor(o, m) { const t = this.transit(o.city); return Math.round(U.clamp((4 + t * 3 + o.qty / 250 + m.exposure) * Police.customs() * (S.special.jammer ? 0.6 : 1) - S.servers * 2, 2, 72) * 10) / 10; },
  sellMenu() {
    if (!S.relays) return UI.toast('📮 Achète d\'abord une adresse relais (onglet Envois).');
    const orders = this.orders();
    UI.modal({ icon: '🌐', title: 'Commandes clients', text: 'Des acheteurs du monde entier réclament des produits précis, à des prix différents.', choices: orders.map((o) => { const have = Inventory.qty(o.d); return { label: `${CITIES[o.city].flag} ${DRUGS[o.d].icon} ${U.num(o.qty)} ${U.u(DRUGS[o.d], o.qty)} ${DRUGS[o.d].name}`, sub: `${U.unitPrice(o.unit)}/${DRUGS[o.d].unit} · ${CITIES[o.city].name} · en stock : ${U.num(have)}`, dis: have < o.qty, fn: () => this.fulfil(o) }; }).concat([{ label: 'Fermer', cls: 'ghost' }]) });
  },
  fulfil(o) {
    if (Inventory.qty(o.d) < o.qty) return UI.toast('Stock insuffisant.');
    const methods = SHIP_TYPES.filter((m) => o.qty <= m.max && (!m.need || (S.fleet[m.need] || 0) > 0) && (!m.relay || S.relays >= m.relay));
    if (!methods.length) { const need = SHIP_TYPES.find((m) => o.qty <= m.max); return UI.toast(need && need.need ? `🚚 Grosse quantité : il te faut ${FLEET[need.need].name} (Logistique).` : 'Quantité trop grande pour tes moyens.'); }
    UI.modal({ icon: '🚚', title: 'Mode d\'expédition', text: `${U.num(o.qty)} ${U.u(DRUGS[o.d], o.qty)} ${U.de(DRUGS[o.d].name)} → ${CITIES[o.city].flag} ${CITIES[o.city].name}<br><small class="m">La poste suffit pour les petites ventes ; les grosses exigent camionnette, vedette ou avion.</small>`, choices: methods.map((m) => ({ label: `${m.icon} ${m.name}`, sub: `frais ${U.money(m.fee)} · suivi ${this.transit(o.city)} mois · interception ~${this.shipRiskFor(o, m)} %`, fn: () => this.send(o, m) })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  send(o, m) {
    if (!PlayerData.pay(m.fee)) return UI.toast('Fonds insuffisants pour les frais.');
    Inventory.remove(o.d, o.qty);
    S.dwShip.push({ id: U.uid(), d: o.d, qty: o.qty, from: S.city, dest: o.city, method: m.id, unit: o.unit, arrive: S.ageMonths + this.transit(o.city), risk: this.shipRiskFor(o, m) });
    S.dwOrders = S.dwOrders.filter((x) => x !== o);
    log('🌐', `Colis expédié (${m.name}) vers ${CITIES[o.city].name} : ${U.num(o.qty)} ${U.u(DRUGS[o.d], o.qty)} ${U.de(DRUGS[o.d].name)}. Suivi en cours.`, 'money');
  },
  tracking() {
    if (!S.dwShip || !S.dwShip.length) return UI.toast('Aucun colis en transit.');
    UI.modal({ icon: '📦', title: 'Suivi des colis', choices: S.dwShip.map((sh) => ({ label: `${DRUGS[sh.d].icon} ${U.num(sh.qty)} ${U.u(DRUGS[sh.d], sh.qty)} → ${CITIES[sh.dest].flag} ${CITIES[sh.dest].name}`, sub: `${CITIES[sh.from].name} → ${CITIES[sh.dest].name} · arrive dans ${Math.max(0, sh.arrive - S.ageMonths)} mois · douane ~${sh.risk} %` })).concat([{ label: 'Fermer', cls: 'ghost' }]) });
  },
  monthly() {
    if (!S.dwShip) { S.dwShip = []; S.dwOrders = []; return; }
    for (const sh of [...S.dwShip]) {
      if (sh.arrive > S.ageMonths) continue;
      S.dwShip = S.dwShip.filter((x) => x !== sh); const D = DRUGS[sh.d]; if (!D) continue;

/* ============================== LOGISTIQUE (fret & abonnements) ============================== */
const Logistics = {
  warehouses() { return PlayerData.items('properties').filter((p) => p.ware); },
  fleetRisk() { let r = 1; for (const f in S.fleet) if (S.fleet[f]) r *= FLEET[f].risk; return r * (S.special.jammer ? 0.7 : 1); },
  freightRisk(from, m) { return Math.round(U.clamp(m.risk * (Police.customs(from) + Police.customs()) / 2 * this.fleetRisk(), 1, 85)); },
  order(from, d, m, sub) {
    const D = DRUGS[d];
    const cost = (n) => MarketData.buyCost(from, d, n) * (1 + m.pct) + m.fixed;
    const room = Math.floor((PlayerData.capacity() - Inventory.bulk()) / D.bulk);
    const max = U.maxQty(cost, S.cash + S.bank, Math.min(Math.floor(m.max / D.bulk), room || 1));
    if (max < 1) return UI.toast(room < 1 ? '📦 Entrepôt plein.' : '💵 Fonds insuffisants.');
    const q = S.market.qual[from][d], risk = this.freightRisk(from, m);
    UI.qty({ icon: m.icon, title: `${m.name} — ${D.name}`, text: `${MarketData.brand(from, d)} · ${U.q(q)} · ${U.unitPrice(MarketData.buyUnit(from, d))}/${D.unit}<br>Arrivée : ${m.months} mois · saisie ${U.risk(risk)}${sub ? '<br><b>Abonnement : prélèvement automatique récurrent.</b>' : ''}`,
      max, init: Math.max(1, Math.floor(max / 2)), unit: D.unit,
      info: (n) => `Total : <b class="y">${U.money(cost(n))}</b>${sub ? ' / livraison' : ''}`,
      confirm: sub ? '🔁 Programmer' : '📦 Commander', onConfirm: (n) => {
        const total = Math.round(cost(n));
        if (sub) return this.askPeriod(from, d, m, n, total);
        if (!PlayerData.pay(total)) return UI.toast('Fonds insuffisants.');
        S.stats.bought += total; MarketData.impact(from, d, n, 1);
        S.imports.push({ id: U.uid(), d, qty: n, q, b: MarketData.brand(from, d), from, method: m.id, arrive: S.ageMonths + m.months, risk });
        log(m.icon, `Fret lancé : ${U.num(n)} ${U.u(D, U.num(n))} ${U.de(D.name)} depuis ${CITIES[from].name} → −${U.money(total)}.`, 'money');
      } });
  },
  askPeriod(from, d, m, n, total) {
    UI.modal({ icon: '🔁', title: 'Fréquence de livraison', text: `Arrivage automatique de ${U.num(n)} ${U.u(DRUGS[d], U.num(n))} ${U.de(DRUGS[d].name)} depuis ${CITIES[from].name}.<br>${U.money(total)} prélevés à chaque échéance.`,
      choices: SUB_PERIODS.map((pr) => ({ label: pr === 1 ? 'Tous les mois' : `Tous les ${pr} mois`, fn: () => { S.subs.push({ id: U.uid(), from, d, method: m.id, qty: n, period: pr, next: S.ageMonths + pr }); log('🔁', `Abonnement programmé : ${U.num(n)} ${U.u(DRUGS[d], U.num(n))} ${U.de(DRUGS[d].name)} tous les ${pr} mois.`, 'good'); } })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  cancelSub(id) { S.subs = S.subs.filter((x) => x.id !== id); UI.toast('🔁 Abonnement annulé'); UI.renderPanel(); },
  buyFleet(f) { const F = FLEET[f]; UI.pay({ icon: F.icon, title: F.name, text: `Réduit le risque douanier de tes arrivages.`, price: F.price, onPay: () => { S.fleet[f]++; log(F.icon, `Flotte : +1 ${F.name} (${S.fleet[f]}).`, 'good'); } }); },
  newOrder() {
    UI.modal({ icon: '🌍', title: 'Origine du fret', choices: Object.keys(CITIES).filter((c) => c !== S.city).map((c) => ({ label: `${CITIES[c].flag} ${CITIES[c].name}`, sub: `douanes ×${U.f2(Police.customs(c))}`, fn: () => this.pickDrug(c) })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  pickDrug(from) {
    UI.modal({ icon: '📦', title: `Fret depuis ${CITIES[from].name}`, text: 'Quel produit faire venir ?', choices: Object.keys(DRUGS).map((d) => ({ label: `${DRUGS[d].icon} ${DRUGS[d].name}`, sub: `${U.unitPrice(MarketData.buyUnit(from, d))}/${DRUGS[d].unit}`, fn: () => this.pickMethod(from, d) })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  pickMethod(from, d) {
    const avail = FREIGHT.filter((m) => !m.rank || S.rank >= m.rank);
    const ch = [];
    for (const m of avail) {
      ch.push({ label: `${m.icon} ${m.name}`, sub: `max ${U.num(m.max)} · ${m.months} mois · saisie ~${this.freightRisk(from, m)} %`, fn: () => this.order(from, d, m, false) });
      ch.push({ label: `🔁 ${m.name} — abonnement`, sub: 'Livraison récurrente automatique', fn: () => this.order(from, d, m, true) });
    }
    ch.push({ label: 'Annuler', cls: 'ghost' });
    UI.modal({ icon: '🚢', title: `${DRUGS[d].name} · ${CITIES[from].name}`, choices: ch });
  },
  monthly() {
    for (const s of [...S.subs]) {
      if (s.next > S.ageMonths) continue;
      s.next += s.period;
      const m = FREIGHT.find((x) => x.id === s.method) || IMPORT_METHODS.find((x) => x.id === s.method); if (!m) continue;
      const D = DRUGS[s.d], q = S.market.qual[s.from][s.d], total = Math.round(MarketData.buyCost(s.from, s.d, s.qty) * (1 + m.pct) + m.fixed);
      if (!PlayerData.pay(total)) { log('🔁', `Abonnement (${D.name}) impayé : livraison annulée ce cycle.`, 'bad'); continue; }
      const risk = this.freightRisk(s.from, m);
      S.imports.push({ id: U.uid(), d: s.d, qty: s.qty, q, b: MarketData.brand(s.from, s.d), from: s.from, method: m.id, arrive: S.ageMonths + m.months, risk });
      log('🔁', `Arrivage programmé parti de ${CITIES[s.from].name} : ${U.num(s.qty)} ${U.u(D, U.num(s.qty))} ${U.de(D.name)} (−${U.money(total)}).`, 'money');
    }
  },
};

/* ============================== CHIMIE (R&D & coupe) ============================== */
const Chemistry = {
  has() { return !!S.rnd; },
  buyLab() { UI.pay({ icon: '🔬', title: 'Laboratoire de R&D moléculaire', text: 'Synthétise des drogues de synthèse (RC) à partir de molécules du Dark Web.', price: 180000, onPay: () => { S.rnd = true; log('🔬', 'Laboratoire de R&D monté.', 'good'); } }); },
  // stats générées à partir de la combinaison de molécules
  _sel: [],
  W: { alpha: [6, 2, 1, 'stim'], beta: [3, 4, 2, 'benzo'], gamma: [9, 3, 4, 'stim'], delta: [2, 1, 0, ''], epsilon: [7, 5, 3, 'opioid'], zeta: [4, 2, 5, 'psy'], eta: [11, 6, 2, 'stim'], theta: [1, 8, 1, 'opioid'] },
  toggle(m) { const i = this._sel.indexOf(m); if (i >= 0) this._sel.splice(i, 1); else if (this._sel.length < 3) this._sel.push(m); if (UI.stack.length) UI.renderPanel(); },
  design(mix) {
    const W = this.W; let pw = 18, ad = 1, od = 0.3; const tags = {};
    for (const m of mix) { const w = W[m] || [5, 3, 2, '']; pw += w[0]; ad += w[1]; od += w[2] * 0.4; if (w[3]) tags[w[3]] = (tags[w[3]] || 0) + 1; }
    const tag = Object.keys(tags).sort((a, b) => tags[b] - tags[a])[0] || '';
    let hsh = 0; for (const ch of mix.join('')) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
    const name = RC_PREFIX[hsh % RC_PREFIX.length] + RC_SUFFIX[(hsh >>> 4) % RC_SUFFIX.length];
    return { name, pw: Math.round(pw), add: Math.round(ad * 10) / 10, od: Math.round(od * 10) / 10, value: Math.round(pw * 2.2), form: RC_FORMS[hsh % RC_FORMS.length], tag };
  },
  synth(mix) {
    mix = mix || this._sel.slice();
    if (mix.length < 2) return UI.toast('Sélectionne 2 ou 3 molécules.');
    for (const m of mix) if ((S.molecules[m] || 0) < 1) return UI.toast(`Il manque ${MOLECULES[m].name}.`);
    const spec = this.design(mix);
    const key = 'rc_' + Math.random().toString(36).slice(2, 7);
    const flags = {}; if (spec.tag === 'opioid') flags.opioid = true; else if (spec.tag === 'benzo') flags.benzo = true; else flags.stim = true;
    const fx = { crime: Math.round(spec.pw / 8), stress: -6, health: spec.tag === 'opioid' ? 2 : -2 };
    if (spec.tag === 'psy') { fx.respect = 2; fx.stress = -10; }
    const def = { form: spec.form, name: spec.name + ' (RC)', cat: 'dure', icon: '⚗️', unit: spec.form === 'pill' || spec.form === 'ziplock' ? 'cp' : 'g', brands: [spec.name], base: spec.value, demand: 40, depth: 3000, bulk: 0.4, add: spec.add, od: spec.od, ...flags, fx, txt: `Molécule inédite (${spec.tag || 'mixte'}) : sensations imprévisibles.` };
    registerDrug(key, def);
    S.rcDefs.push({ key, def });
    for (const m of mix) S.molecules[m]--;
    const qty = U.ri(200, 600);
    Inventory.add(key, qty, U.ri(55, 85), spec.name);
    S.stats.synth++; this._sel = [];
    log('⚗️', `Synthèse réussie : <b>${spec.name}</b> (puissance ${spec.pw}, addiction ${spec.add}, OD ${spec.od}). +${U.num(qty)} ${def.unit}.`, 'drug');
    UI.result('⚗️', spec.name, `Nouvelle drogue de synthèse créée.<br><b>Puissance ${spec.pw} · Addiction ${spec.add} · Létalité ${spec.od} · Valeur ${U.money(spec.value)}</b><br>+${U.num(qty)} ${def.unit} en stock.`, 'drug');
  },
  cut(d) {
    const D = DRUGS[d], have = Inventory.qty(d); if (!have) return;
    if (!Inventory.qty('fenta')) return UI.toast('☠️ Il te faut du fentanyl en stock.');
    const need = Math.max(1, Math.round(have / 8));
    UI.confirm('☠️', `Couper ${D.name} au fentanyl`, `Consomme ${need} cp de fentanyl.<br><b>+40 % de quantité</b>, dépendance accrue, mais <b class="r">overdoses mortelles possibles chez tes clients</b> (réputation).`, '☠️ Couper', () => {
      if (Inventory.qty('fenta') < need) return UI.toast('Pas assez de fentanyl.');
      Inventory.remove('fenta', need);
      const s = S.stock[d]; const add = Math.round(s.qty * 0.4); s.qty += add;
      s.cut = Math.round((((s.cut || 0) * (s.qty - add) + 1 * (add + need)) / s.qty) * 100) / 100;
      log('☠️', `Tu coupes ${D.name} au fentanyl : +${U.num(add)} ${U.u(D, add)}. Lot dangereux.`, 'drug');
    });
  },
};

        const el = root.querySelector('.lcw'), draw = () => { el.innerHTML = this.panel(c); };
        el.addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (!b) return; c[b.dataset.k] = b.dataset.k === 'dose' ? +b.dataset.v : b.dataset.v; draw(); });
        el.addEventListener('input', (e) => { if (e.target.dataset.k === 'brand') { c.brand = e.target.value.slice(0, 16) || 'NordPouch'; const pv = el.querySelector('.lc-badge2'); if (pv) pv.textContent = c.brand; } });
        draw();
      } });
  },
  panel(c) {
    const o = (k, v, t) => `<button type="button" class="lc-o${String(c[k]) === String(v) ? ' on' : ''}" data-k="${k}" data-v="${U.esc(v)}"><b>${t}</b></button>`;
    let h = `<div class="lc-prev" style="background:radial-gradient(circle at 50% 60%, ${c.color}, #141417 80%)"><div class="snus-box" style="--sc:${c.color};filter:hue-rotate(${SNUS_FLAVOR[c.flavor].hue}deg)">${SNUS_DOSE.includes(c.dose) ? c.dose + 'mg' : ''}<span class="lc-badge2">${U.esc(c.brand)}</span></div></div>`;
    h += '<div class="lc-sec">Dosage nicotine</div><div class="lc-opts">' + SNUS_DOSE.map((d) => o('dose', d, d + ' mg' + (d >= 100 ? ' 🔥' : ''))).join('') + '</div>';
    h += '<div class="lc-sec">Format</div><div class="lc-opts">' + Object.keys(SNUS_FORMAT).map((f) => o('format', f, SNUS_FORMAT[f])).join('') + '</div>';
    h += '<div class="lc-sec">Parfum</div><div class="lc-opts">' + Object.keys(SNUS_FLAVOR).map((f) => o('flavor', f, SNUS_FLAVOR[f].name)).join('') + '</div>';
    h += '<div class="lc-sec">Couleur de la boîte</div><div class="lc-sws">' + SNUS_COLORS.map(([col, nm]) => `<button type="button" class="lc-sw${c.color === col ? ' on' : ''}" data-k="color" data-v="${col}" style="background:${col}" aria-label="${nm}"></button>`).join('') + '</div>';
    h += '<div class="lc-sec">Nom de marque</div><input class="lc-in" data-k="brand" maxlength="16" value="' + U.esc(c.brand) + '">';
    return h;
  },
};

const Subchefs = {
  max: 2,
  can() { return S.rank >= 4; },
  promote() {
    if (!this.can()) return UI.toast('🔒 Grade Parrain requis.');
    if (S.subchefs.length >= this.max) return UI.toast('Déjà 2 sous-chefs.');
    const pool = PlayerData.soldiers().filter((m) => m.loyalty >= 70).sort((a, b) => b.skill - a.skill);
    if (!pool.length) return UI.toast('Il te faut un soldat loyal (loyauté ≥ 70).');
    UI.modal({ icon: '🎖️', title: 'Nommer un sous-chef', text: 'Un lieutenant de confiance gérera une partie du réseau en autonomie.', choices: pool.slice(0, 5).map((m) => ({ label: `${m.name}`, sub: `talent ${Math.round(m.skill)} · loyauté ${Math.round(m.loyalty)}`, fn: () => { Crew.remove(m); S.subchefs.push({ id: U.uid(), name: m.name, skill: m.skill, loyalty: m.loyalty, focus: 'Équilibré' }); log('🎖️', `${m.name} devient ton sous-chef : il gère recrutement, stocks et collecte.`, 'good'); } })).concat([{ label: 'Annuler', cls: 'ghost' }]) });
  },
  dismiss(id) { const s = S.subchefs.find((x) => x.id === id); if (!s) return; S.subchefs = S.subchefs.filter((x) => x !== id && x.id !== id); log('🚪', `${s.name} n'est plus sous-chef.`, ''); UI.back(); },
  monthly() {
    if (!S.subchefs.length) return;
    let rev = 0, loss = 0;
    for (const s of S.subchefs) {
      const base = Math.round(s.skill * 140 * (1 + S.rank * 0.15) * (1 + (S.zones ? Object.values(S.zones).filter((z) => z.mine).length : 0) * 0.1));
      if (U.chance(8)) { loss += Math.round(base * 0.5); continue; } // pertes/arrestations d'équipe gérées par le sous-chef
      rev += base;
    }
    if (rev) { PlayerData.earn(rev); S.stats.sold += rev; }
    if (rev || loss) log('🎖️', `Réseaux délégués : <b>+${U.money(rev)}</b>${loss ? ` (pertes ${U.money(loss)})` : ''}.`, 'money');
    // rapport trimestriel
    if (S.ageMonths % 3 === 0) this.report(rev, loss);
  },
  report(rev, loss) {
    const recos = ['Augmenter les effectifs à l\'Est', 'Changer le produit prioritaire pour la coke', 'Se concentrer sur les clubs du centre', 'Lever le pied : la pression monte', 'Monter les prix de 10 %'];
    const reco = U.pick(recos), bonus = U.ri(3000, 20000) * (1 + S.rank);
    UI.modal({ icon: '📋', title: 'Rapport trimestriel des sous-chefs', cls: 'accent',
      text: `Bilan du trimestre :<br>${H.kv([['Chiffre d\'affaires', U.money(rev * 3)], ['Pertes', U.money(loss * 3)], ['Sous-chefs', S.subchefs.length]])}<br>Recommandation : « <b>${reco}</b> »`,
      choices: [
        { label: '✅ Valider la recommandation', sub: `Réajustement : +${U.money(bonus)} estimé`, fn: () => { PlayerData.earn(bonus); PlayerData.mod('respect', 1); log('📋', `Tu valides : « ${reco} ». +${U.money(bonus)}.`, 'money'); } },
        { label: '🙅 Garder le cap', fn: () => log('📋', 'Tu maintiens la stratégie actuelle.', '') },
      ] });
  },
};

/* ============================== QUARTIERS (guerres dynamiques) ============================== */
const Districts = {
  init() { const names = U.shuffle(RIVAL_NAMES); const z = {}; let i = 0; for (const k in DISTRICTS) { z[k] = { owner: names[i % names.length], mine: false, tribute: 0 }; i++; } return z; },
  owned() { return S.zones ? Object.keys(S.zones).filter((k) => S.zones[k].mine) : []; },
  raid(k) {
    const z = S.zones[k], D = DISTRICTS[k];
    if (z.mine) return;
    if (S.rank < 2) return UI.toast('🔒 Grade Lieutenant requis.');
    if (!PlayerData.useAP(2)) return;
    const chance = U.clamp(PlayerData.warPower() / (D.str + (S.rivals.find((r) => r.name === z.owner) || { strength: 0 }).strength * 0.2) * 55, 8, 92);
    S.stats.wars++;
    if (U.chance(chance)) {
      z.mine = true; z.owner = null; S.territories++; S.stats.conquered++;
      PlayerData.mod('respect', 6);
      log('🗺️', `Tu conquiers <b>${D.name}</b> ! Dividende mensuel passif débloqué (+6 👑).`, 'good');
      UI.result(D.icon, 'Quartier conquis', `${D.name} est à toi. Dividende mensuel régulier.`, 'good');
    } else {
      const dmg = Math.round(U.ri(15, 45) * (1 - PlayerData.armor() / 150)); S.wounded = true;
      const dead = PlayerData.soldiers().filter(() => U.chance(25)); S.crew = S.crew.filter((c) => !dead.includes(c));
      log('💀', `Raid repoussé à ${D.name} : −${dmg} ❤️${dead.length ? `, ${dead.length} soldat(s) perdu(s)` : ''}.`, 'bad');
      PlayerData.hurt(dmg, `Tué en tentant de prendre ${D.name}`);
    }
  },
  tribute(k) {
    const z = S.zones[k], D = DISTRICTS[k], cost = Math.round(D.income[1] * 1.5);
    if (z.mine) return;
    UI.confirm('💶', `Droit de passage — ${D.name}`, `Payer <b>${U.money(cost)}</b> au syndicat ${U.deN(z.owner)} pour y trafiquer librement 6 mois (petit revenu d'accès).`, '💶 Payer le tribut', () => {
      if (!PlayerData.pay(cost)) return UI.toast('Fonds insuffisants.');
      z.tribute = S.ageMonths + 6; log('💶', `Tribut versé ${U.aN(z.owner)} : accès à ${D.name} pour 6 mois.`, 'money');
    });
  },
  monthly() {
    if (!S.zones) return;
    let div = 0, acc = 0;
    for (const k in S.zones) {
      const z = S.zones[k], D = DISTRICTS[k];
      if (z.mine) {
        const d = Math.round(U.rand(D.income[0], D.income[1]) * (1 + S.rank * 0.1)); div += d;
        if (!S.exile && U.chance(Math.max(1, 7 - PlayerData.warPower() / 70))) { z.mine = false; z.owner = U.pick(RIVAL_NAMES); S.territories = Math.max(0, S.territories - 1); log('🏴', `Un syndicat rival reprend ${D.name} !`, 'bad'); }
      } else if (z.tribute > S.ageMonths) acc += Math.round(U.rand(D.income[0], D.income[1]) * 0.3);
    }
    if (div) { PlayerData.earn(div); log('🗺️', `Dividendes des quartiers contrôlés : <b>+${U.money(div)}</b>.`, 'money'); }
    if (acc) { PlayerData.earn(acc); }
  },
};
